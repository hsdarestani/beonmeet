<!doctype html>
<html lang="$lang" dir="$dir"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title><meta name="description" content="$intro"><meta name="theme-color" content="#f9faf7">
<link rel="alternate" hreflang="fa" href="/"><link rel="alternate" hreflang="en" href="/en">
<link rel="preload" href="/landing/vazir.woff2" as="font" type="font/woff2" crossorigin>
<style>$css</style><link rel="stylesheet" href="/landing/site.css?v=2"><script defer src="/landing/metrics.js"></script></head>
<body><a data-metric="skip" class="skip" href="#main">$skip</a><header><div class="wrap mast">
<a data-metric="brand" class="wordmark" dir="ltr" href="$home"><i class="logo" aria-hidden="true"><b></b><b></b><b></b><b></b></i>BeOnMeet</a>
<nav aria-label="$nav"><a data-metric="nav_how" href="#how">$how</a><a data-metric="nav_credits" href="#credits">$pricing</a><a data-metric="nav_faq" href="#data">$faq</a></nav>
<div class="tools"><a data-metric="header_language" class="locale" href="$alternate" lang="$otherlang">$language</a><a data-metric="header_start" class="button compact" href="$bot">$start</a></div>
</div></header>
<main id="main"><section class="wrap hero"><div class="hero-copy">
<div class="eyebrow"><i></i>$context</div><h1>$headline<br><em>$accent</em></h1><p>$intro</p>
<div class="actions"><a data-metric="hero_start" class="button" href="$bot">$start <span aria-hidden="true">↗</span></a><a data-metric="hero_how" class="textlink" href="#how">$how</a></div></div>
<div class="illustration" aria-label="$preview"><div class="grid-bg"></div><div class="poster" dir="ltr" aria-hidden="true">
<div class="poster-top"><span class="dots"><i></i><i></i><i></i></span><span>BEONMEET &nbsp;/&nbsp; STUDIO</span></div>
<div class="art"><div class="ribbon blue"></div><div class="ribbon green"></div><div class="ribbon yellow"></div><div class="ribbon red"></div><div class="grooves"></div></div>
<div class="poster-foot"><div class="sound">$wave</div><span>00:24</span></div></div>
<div class="receipt"><span class="tick" aria-hidden="true">✓</span><div><strong>$sample</strong><small>$example</small></div></div></div></section>
<section class="how" id="how"><div class="wrap"><div class="sectionhead"><div class="eyebrow"><i></i>$how</div><h2>$howtitle</h2></div>
<div class="steps">$steps</div></div></section>
<section class="wrap credits" id="credits"><div class="sectionhead"><div class="eyebrow"><i></i>$pricing</div><h2>$pricetitle</h2><p>$creditintro</p></div>
<div class="plans">$plans</div><p class="fine">$billing <a data-metric="pricing_terms" href="$legalprefix/terms">$terms</a></p></section>
<section class="faq" id="data"><div class="wrap faqgrid"><div class="sectionhead"><div class="eyebrow"><i></i>$faq</div><h2>$faqtitle</h2></div><div>$questions</div></div></section></main>
<footer class="wrap"><strong dir="ltr">BeOnMeet</strong><span><a data-metric="footer_privacy" href="$legalprefix/privacy">$privacy</a><a data-metric="footer_terms" href="$legalprefix/terms">$terms</a><a data-metric="footer_language" href="$alternate">$language</a></span></footer></body></html>
