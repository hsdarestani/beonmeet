# BeOnMeet production capacity: 5 free slots + 3 reserved Premium slots.
# Premium can also borrow an unused free slot. Free users never consume Premium slots.
services:
  controller:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      TRANSCRIPTION_CONCURRENCY: "1"
      FREE_MEETING_BOT_URL: http://meeting-bot:3000
      PREMIUM_MEETING_BOT_URL: http://meeting-bot-premium:3000
      FREE_WORKER_URLS: http://meeting-bot:3000
      PREMIUM_WORKER_URLS: http://meeting-bot-premium:3000
      FREE_MEETING_SLOTS: "5"
      PREMIUM_MEETING_SLOTS: "3"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - controller_state:/data
      - /dev/shm/beonmeet:/recordings
    expose:
      - "8000"
    depends_on:
      meeting-bot:
        condition: service_started
      meeting-bot-premium:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  meeting-bot:
    image: beonmeet-meeting-bot:latest
    platform: linux/amd64
    build:
      context: ./upstream
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CONSUMER_ENABLED: "false"
      GOOGLE_CHROME_CDP_URL: http://chrome-cdp:9223
      RECORDING_TMP_DIR: /recordings
      CONTROLLER_UPLOAD_URL: http://controller:8000/internal/recording-ready
      CONTROLLER_RECORDING_STARTED_URL: http://controller:8000/internal/recording-started
      CONTROLLER_WAITING_FOR_ADMISSION_URL: http://controller:8000/internal/waiting-for-admission
      UPLOADER_FILE_EXTENSION: .webm
      MAX_RECORDING_DURATION_MINUTES: "240"
      MAX_CONCURRENT_MEETINGS: "5"
      MEETING_INACTIVITY_MINUTES: "1"
      INACTIVITY_DETECTION_START_DELAY_MINUTES: "3"
      JOIN_WAIT_TIME_MINUTES: "5"
    volumes:
      - /dev/shm/beonmeet:/recordings
    depends_on:
      redis:
        condition: service_started
      chrome-cdp:
        condition: service_healthy
    expose:
      - "3000"

  meeting-bot-premium:
    image: beonmeet-meeting-bot:latest
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CONSUMER_ENABLED: "false"
      GOOGLE_CHROME_CDP_URL: http://chrome-cdp:9223
      RECORDING_TMP_DIR: /recordings
      CONTROLLER_UPLOAD_URL: http://controller:8000/internal/recording-ready
      CONTROLLER_RECORDING_STARTED_URL: http://controller:8000/internal/recording-started
      CONTROLLER_WAITING_FOR_ADMISSION_URL: http://controller:8000/internal/waiting-for-admission
      UPLOADER_FILE_EXTENSION: .webm
      MAX_RECORDING_DURATION_MINUTES: "240"
      MAX_CONCURRENT_MEETINGS: "3"
      MEETING_INACTIVITY_MINUTES: "1"
      INACTIVITY_DETECTION_START_DELAY_MINUTES: "3"
      JOIN_WAIT_TIME_MINUTES: "5"
    volumes:
      - /dev/shm/beonmeet:/recordings
    depends_on:
      redis:
        condition: service_started
      chrome-cdp:
        condition: service_healthy
    expose:
      - "3000"

  chrome-cdp:
    platform: linux/amd64
    build:
      context: ./upstream
      dockerfile: Dockerfile.chrome-cdp
    restart: unless-stopped
    shm_size: "8gb"
    environment:
      CHROME_WINDOW_SIZE: "1600,900"
    volumes:
      - ./chrome-profile:/tmp/chrome-profile
    expose:
      - "9223"
      - "6080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/json/version"]
      interval: 5s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      controller:
        condition: service_started

volumes:
  controller_state:
  redis_data:
  caddy_data:
  caddy_config:
