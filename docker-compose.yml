# BeOnMeet production stack.
# 12 local recorder slots on the current 16 vCPU / 32 GB host:
#   8 general slots across two isolated Chrome workers
#   4 reserved Premium slots on a dedicated Chrome worker
# Premium may borrow unused general capacity. Free never consumes Premium slots.
services:
  controller:
    build: ./app
    restart: unless-stopped
    env_file:
      - .env
      - .autoscale.env
    environment:
      TRANSCRIPTION_CONCURRENCY: "1"
      REDIS_URL: redis://redis:6379/0
      FREE_MEETING_BOT_URL: http://meeting-bot-free1:3000
      PREMIUM_MEETING_BOT_URL: http://meeting-bot-premium1:3000
      FREE_WORKER_URLS: http://meeting-bot-free1:3000,http://meeting-bot-free2:3000
      PREMIUM_WORKER_URLS: http://meeting-bot-premium1:3000
      FREE_MEETING_SLOTS: "8"
      PREMIUM_MEETING_SLOTS: "4"
      DATABASE_URL: postgresql://beonmeet:${POSTGRES_PASSWORD}@postgres:5432/beonmeet
      AUTOSCALE_ENABLED: "true"
      CONTROLLER_PUBLIC_URL: https://beonmeet.smarbiz.sbs
      AUTOSCALE_SERVER_TYPE: cpx32
      AUTOSCALE_SERVER_IMAGE: ubuntu-24.04
      AUTOSCALE_SERVER_LOCATION: fsn1
      AUTOSCALE_FALLBACK_LOCATIONS: fsn1,hel1
      AUTOSCALE_WORKER_SLOTS: "3"
      AUTOSCALE_MAX_FREE_WORKERS: "6"
      AUTOSCALE_MAX_PREMIUM_WORKERS: "3"
      AUTOSCALE_MIN_FREE_WORKERS: "0"
      AUTOSCALE_MIN_PREMIUM_WORKERS: "0"
      AUTOSCALE_IDLE_MINUTES: "20"
      AUTOSCALE_SCALE_UP_COOLDOWN_SECONDS: "60"
      AUTOSCALE_BOOT_TIMEOUT_MINUTES: "15"
      AUTOSCALE_MAX_WORKERS_PER_ACCOUNT: "3"
    volumes:
      - controller_state:/data
      - /dev/shm/beonmeet:/recordings
      - ./chrome-profile:/bootstrap/chrome-profile:ro
      - ./recorder-accounts:/bootstrap/accounts:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meeting-bot-free1:
        condition: service_started
      meeting-bot-free2:
        condition: service_started
      meeting-bot-premium1:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: beonmeet
      POSTGRES_USER: beonmeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beonmeet -d beonmeet"]
      interval: 5s
      timeout: 3s
      retries: 30
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  meeting-bot-free1:
    image: beonmeet-meeting-bot:latest
    platform: linux/amd64
    build:
      context: ./upstream
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CONSUMER_ENABLED: "false"
      GOOGLE_CHROME_CDP_URL: http://chrome-cdp-free1:9223
      RECORDING_TMP_DIR: /recordings
      CONTROLLER_UPLOAD_URL: http://controller:8000/internal/recording-ready
      CONTROLLER_RECORDING_STARTED_URL: http://controller:8000/internal/recording-started
      CONTROLLER_WAITING_FOR_ADMISSION_URL: http://controller:8000/internal/waiting-for-admission
      UPLOADER_FILE_EXTENSION: .webm
      MAX_RECORDING_DURATION_MINUTES: "240"
      MAX_CONCURRENT_MEETINGS: "4"
      MEETING_INACTIVITY_MINUTES: "1"
      INACTIVITY_DETECTION_START_DELAY_MINUTES: "3"
      JOIN_WAIT_TIME_MINUTES: "5"
    volumes:
      - /dev/shm/beonmeet:/recordings
    depends_on:
      redis:
        condition: service_started
      chrome-cdp-free1:
        condition: service_healthy
    expose:
      - "3000"

  meeting-bot-free2:
    image: beonmeet-meeting-bot:latest
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CONSUMER_ENABLED: "false"
      GOOGLE_CHROME_CDP_URL: http://chrome-cdp-free2:9223
      RECORDING_TMP_DIR: /recordings
      CONTROLLER_UPLOAD_URL: http://controller:8000/internal/recording-ready
      CONTROLLER_RECORDING_STARTED_URL: http://controller:8000/internal/recording-started
      CONTROLLER_WAITING_FOR_ADMISSION_URL: http://controller:8000/internal/waiting-for-admission
      UPLOADER_FILE_EXTENSION: .webm
      MAX_RECORDING_DURATION_MINUTES: "240"
      MAX_CONCURRENT_MEETINGS: "4"
      MEETING_INACTIVITY_MINUTES: "1"
      INACTIVITY_DETECTION_START_DELAY_MINUTES: "3"
      JOIN_WAIT_TIME_MINUTES: "5"
    volumes:
      - /dev/shm/beonmeet:/recordings
    depends_on:
      redis:
        condition: service_started
      chrome-cdp-free2:
        condition: service_healthy
    expose:
      - "3000"

  meeting-bot-premium1:
    image: beonmeet-meeting-bot:latest
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CONSUMER_ENABLED: "false"
      GOOGLE_CHROME_CDP_URL: http://chrome-cdp-premium1:9223
      RECORDING_TMP_DIR: /recordings
      CONTROLLER_UPLOAD_URL: http://controller:8000/internal/recording-ready
      CONTROLLER_RECORDING_STARTED_URL: http://controller:8000/internal/recording-started
      CONTROLLER_WAITING_FOR_ADMISSION_URL: http://controller:8000/internal/waiting-for-admission
      UPLOADER_FILE_EXTENSION: .webm
      MAX_RECORDING_DURATION_MINUTES: "240"
      MAX_CONCURRENT_MEETINGS: "4"
      MEETING_INACTIVITY_MINUTES: "1"
      INACTIVITY_DETECTION_START_DELAY_MINUTES: "3"
      JOIN_WAIT_TIME_MINUTES: "5"
    volumes:
      - /dev/shm/beonmeet:/recordings
    depends_on:
      redis:
        condition: service_started
      chrome-cdp-premium1:
        condition: service_healthy
    expose:
      - "3000"

  chrome-cdp-free1:
    image: beonmeet-chrome-cdp:latest
    platform: linux/amd64
    build:
      context: ./upstream
      dockerfile: Dockerfile.chrome-cdp
    restart: unless-stopped
    shm_size: "4gb"
    environment:
      CHROME_WINDOW_SIZE: "1600,900"
    volumes:
      - ./chrome-profile:/tmp/chrome-profile
    expose:
      - "9223"
      - "6080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/json/version"]
      interval: 5s
      timeout: 3s
      retries: 30

  chrome-cdp-free2:
    image: beonmeet-chrome-cdp:latest
    platform: linux/amd64
    restart: unless-stopped
    shm_size: "4gb"
    environment:
      CHROME_WINDOW_SIZE: "1600,900"
    volumes:
      - ./chrome-profile-free2:/tmp/chrome-profile
    expose:
      - "9223"
      - "6080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/json/version"]
      interval: 5s
      timeout: 3s
      retries: 30

  chrome-cdp-premium1:
    image: beonmeet-chrome-cdp:latest
    platform: linux/amd64
    restart: unless-stopped
    shm_size: "4gb"
    environment:
      CHROME_WINDOW_SIZE: "1600,900"
    volumes:
      - ./chrome-profile-premium1:/tmp/chrome-profile
    expose:
      - "9223"
      - "6080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/json/version"]
      interval: 5s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      controller:
        condition: service_started

volumes:
  controller_state:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
