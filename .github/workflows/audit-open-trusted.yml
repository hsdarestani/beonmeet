name: Read-only correlate Open vs Trusted Meet tests and Telegram status
on:
  push:
    branches: [ops/qa-live-open-trusted-20261121]
    paths: [.github/workflows/audit-open-trusted.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only inspect actual join, admission and recording callbacks
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,urllib.request,json,datetime
            print("MEET_BADGE_DIAG_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:d=json.load(r)
                print("ACTIVE_RECORDER_JOBS",port,(d.get("data")or d).get("runningJobs"))
            js=r"""
            (async()=>{
              const timeout=setTimeout(()=>process.exit(18),14500);
              try{
                const {chromium}=require('playwright-extra');
                const b=await chromium.connectOverCDP(process.env.GOOGLE_CHROME_CDP_URL,{timeout:9500});
                let count=0;
                for(const ctx of b.contexts())for(const page of ctx.pages()){
                  if(!page.url().startsWith('https://meet.google.com/'))continue;
                  count++;
                  const s=await page.evaluate(()=>{
                    const buttons=Array.from(document.querySelectorAll('button'));
                    const labels=buttons.map(b=>String(b.getAttribute('aria-label')||b.innerText||'').toLowerCase());
                    const text=(document.body?.innerText||'').toLowerCase();
                    const badges=Array.from(document.querySelectorAll('[data-avatar-count]')).map(e=>e.getAttribute('data-avatar-count')).slice(0,5);
                    return {badges,
                      in_call_controls: {
                        leave:labels.some(t=>t.includes('leave call')||t.includes('anruf verlassen')),
                        hand:labels.some(t=>t.includes('raise hand')||t.includes('hand heben')),
                        reactions:labels.some(t=>t.includes('reactions')||t.includes('reaktion')),
                        chat:labels.some(t=>t.includes('chat')),
                        ask:labels.some(t=>t.includes('ask to join')),
                        join:labels.some(t=>t.includes('join now'))
                      },
                      lobby_wait_text:text.includes('asking to join')||text.includes('let you in')||text.includes('waiting for someone')
                    }
                  });
                  console.log('OPEN_MEET_BADGE_AND_CONTROLS',count,JSON.stringify(s));
                }
                console.log('OPEN_MEET_TAB_COUNT',count);
              }catch(e){console.log('OPEN_MEET_BADGE_ERROR_CLASS',e.name)}
              clearTimeout(timeout);process.exit(0);
            })();
            """
            p=subprocess.run(["docker","exec","beonmeet-worker-five","node","-e",js],capture_output=True,text=True,timeout=23)
            for line in p.stdout.splitlines():
                if line.startswith(("OPEN_MEET_BADGE","OPEN_MEET_TAB")):print(line[:900])
            print("MEET_BADGE_DIAG_COMPLETE")
            PY
