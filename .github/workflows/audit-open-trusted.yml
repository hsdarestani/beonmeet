name: Read-only correlate Open vs Trusted Meet tests and Telegram status
on:
  push:
    branches: [ops/qa-live-open-trusted-20261121]
    paths: [.github/workflows/audit-open-trusted.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only inspect actual join, admission and recording callbacks
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,urllib.request,datetime
            print("JOIN_STATE_VERIFY_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            for port in (8109,9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+("/health" if port==8109 else "/capacity"),timeout=6) as resp:data=json.load(resp)
                d=data.get("data",data)
                print("STATUS",port,json.dumps({k:d.get(k) for k in ("ok","free_queue","premium_queue","pending_delivery_jobs","active_delivery_jobs","runningJobs","availableSlots") if k in d}))
            code=subprocess.run(["docker","exec","beonmeet-worker-five","cat","/usr/src/app/dist/bots/GoogleMeetBot.js"],capture_output=True,text=True,timeout=20).stdout
            start=code.find("waitAtLobbyPromise =")
            print("LOBBY_SOURCE_START",start)
            if start>=0:
                print("LOBBY_SOURCE_BEGIN")
                print(code[start:start+11000])
                print("LOBBY_SOURCE_END")
            p=subprocess.run(["docker","stats","--no-stream","--format","{{.Name}}|{{.CPUPerc}}|{{.MemUsage}}|{{.PIDs}}","beonmeet-worker-five","beonmeet-chrome-single"],capture_output=True,text=True,timeout=12)
            print("RESOURCE_USAGE",p.stdout.strip().splitlines())
            try:
                txt=open("/proc/meminfo").read()
                m=int(next(x.split()[1] for x in txt.splitlines() if x.startswith("MemAvailable:")))
                print("HOST_MEMORY_AVAILABLE_MIB",round(m/1024))
            except Exception:pass
            print("JOIN_SOURCE_STATE_INSPECTION_DONE")
            PY
