name: Read-only correlate Open vs Trusted Meet tests and Telegram status
on:
  push:
    branches: [ops/qa-live-open-trusted-20261121]
    paths: [.github/workflows/audit-open-trusted.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only inspect actual join, admission and recording callbacks
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess
            p=subprocess.run(["docker","exec","beonmeet-worker-five","cat","/usr/src/app/dist/bots/GoogleMeetBot.js"],capture_output=True,text=True,timeout=20)
            s=p.stdout
            for n,k in (("PARTICIPANT_DETECTION","const participantCountDetected ="),("BROWSER_JOIN_CONFIRM","if (participantCountDetected)"),("PROMISE_RETURN","await waitAtLobbyPromise"),("RECORDING_START","recordingStarted"),("RECORDING_STARTED_NOTICE","notifyBeOnMeetRecordingStarted")):
                i=s.find(k)
                print("SOURCE_ANCHOR",n,i)
                if i>=0:
                    print("SOURCE_FRAGMENT_BEGIN",n)
                    print(s[max(0,i-120):i+5300])
                    print("SOURCE_FRAGMENT_END",n)
            print("SOURCE_PARTICIPANT_DIAGNOSTIC_COMPLETE")
            PY
