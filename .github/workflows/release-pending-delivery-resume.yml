name: One-time resume BeOnMeet stuck Premium deliverables

on:
  push:
    branches: [ops/recover-pending-premium-after-fix-20261121]
    paths:
      - .github/workflows/release-pending-delivery-resume.yml

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Safely activate bounded recovery for already-delivered Premium videos
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 60 9
            cd /opt/beonmeet
            release=f9cd67baa7b270116251adbd42719ff1cc8ef1f7
            baseline=a4b7ef94354e3f3ec99a109fb2c3082b98c1086e
            git fetch -q origin main
            git merge-base --is-ancestor "$release" FETCH_HEAD
            stage=$(mktemp /opt/beonmeet/.resume-premium.XXXXXXXX.py)
            git show "$release:app/main.py" > "$stage"
            python3 -m py_compile "$stage"
            cmp -s app/main.py <(git show "$baseline:app/main.py") || {
              echo INSTALLED_CONTROLLER_MISMATCH;rm -f "$stage";exit 1;
            }
            python3 - <<'PY'
            import json,subprocess,urllib.request
            from pathlib import Path
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=8) as r:h=json.load(r)
            assert h.get("ok") and int(h.get("max_concurrent_meetings") or 0)==5
            for k in ("free_queue","premium_queue","active_delivery_jobs"):
                assert int(h.get(k) or 0)==0,k+" busy"
            if int(h.get("pending_delivery_jobs") or 0):
                state=json.loads(Path("/opt/beonmeet/data/state.json").read_text())
                items=list((state.get("pending_deliveries") or {}).values())
                assert len(items)==int(h["pending_delivery_jobs"])
                for x in items:
                    assert x.get("video_delivered") and not x.get("audio_delivered")
                    p=Path(str(x.get("file_path") or x.get("source_path") or ""))
                    assert p.is_file() and p.stat().st_size>0
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=8) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0,"Recording active"
            for n in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","-f","{{.State.Health.Status}}",n],text=True).strip()=="healthy"
            print("PENDING_MEDIA_AND_IDLE_PRECHECK_PASS")
            PY
            backup="/opt/beonmeet/.pending-delivery-retry-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 700 "$backup"
            cp -p app/main.py "$backup/main.py.before"
            if [ -s data/state.json ]; then cp -p data/state.json "$backup/state.before"; fi
            changed=0
            done=0
            rollback() {
              if [ "$changed" = 1 ] && [ "$done" = 0 ]; then
                cp -p "$backup/main.py.before" app/main.py
                systemctl restart beonmeet-controller || true
                echo PREMIUM_RETRY_CONTROLLER_ROLLED_BACK
              fi
              rm -f "$stage"
            }
            trap rollback EXIT
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=6) as r:h=json.load(r)
            assert h.get("ok")
            for k in ("free_queue","premium_queue","active_delivery_jobs"):
                assert int(h.get(k) or 0)==0
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0
            PY
            changed=1
            install -m 644 "$stage" app/main.py
            systemctl restart beonmeet-controller
            ready=0
            for i in $(seq 1 24); do
              if curl -fsS --max-time 3 http://127.0.0.1:8109/health >/dev/null 2>&1; then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1
            cmp -s app/main.py "$stage"
            curl -fsS --max-time 10 https://beonmeet.smarbiz.sbs/health >/dev/null
            for n in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$n")" = healthy
            done
            done=1
            trap - EXIT
            rm -f "$stage"
            echo PREMIUM_PENDING_MEDIA_RECOVERY_REENABLED_PRODUCTION
            echo USER_RECORDINGS_AND_CAMCAM_PRESERVED
