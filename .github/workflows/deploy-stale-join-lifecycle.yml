name: One-time stale join lifecycle release
on:
  push:
    branches: [ops/release-stale-join-lifecycle-20261121]
    paths: [.github/workflows/deploy-stale-join-lifecycle.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Stage verified minimal patch and restart controller only if idle
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 35 9
            cd /opt/beonmeet
            release=cd6c7b996d2f69f03c36687cf8cae6ea042414ed
            git fetch -q origin main
            git merge-base --is-ancestor "$release" FETCH_HEAD
            stage=$(mktemp -d /opt/beonmeet/.stage-stale-status.XXXXXXXX)
            git show "$release:app/i18n.py" > "$stage/reference-i18n.py"
            python3 - "$stage" <<'PY'
            import sys,ast
            from pathlib import Path
            stage=Path(sys.argv[1])
            path=Path("/opt/beonmeet/app/main.py")
            s=path.read_text()
            def apply(old,new):
                global s
                assert s.count(old)==1,"Unexpected production source: refusing patch"
                s=s.replace(old,new,1)
            apply('                if not key or launched.get(key):\n                    continue\n                message_key = {',
                  '                if not key or launched.get(key):\n                    continue\n                # Suppress stale three-minute notices loaded after deploy/restart.\n                if age_seconds > 360:\n                    continue\n                message_key = {')
            apply('            launched_events = state.setdefault("launched_events", {})\n            for event_id, launched in list(launched_events.items()):',
                  '            expired_unconfirmed_chats: list[str] = []\n            launched_events = state.setdefault("launched_events", {})\n            for event_id, launched in list(launched_events.items()):')
            apply('                if now - created > max_age:\n                    launched_events.pop(event_id, None)\n                    changed = True\n\n            free_limit_notified =',
                  '                if now - created > max_age:\n                    launched_events.pop(event_id, None)\n                    changed = True\n                    if (status in {"joining", "remote_claimed", "waiting_for_admission"}\n                            and not (launched or {}).get("recording_started_at")\n                            and now - created <= max_age + timedelta(minutes=15)):\n                        chat_id = str((launched or {}).get("chat_id") or "")\n                        if chat_id:\n                            expired_unconfirmed_chats.append(chat_id)\n\n            free_limit_notified =')
            apply('            if changed:\n                await save_state()\n        except Exception as exc:\n            print("state cleanup loop error:", repr(exc), flush=True)',
                  '            if changed:\n                await save_state()\n            # Remove and persist before notifying, so restart cannot duplicate.\n            for chat_id in expired_unconfirmed_chats:\n                try:\n                    await tg_text(chat_id, t(chat_id, "join_expired_without_recording"))\n                except Exception as notify_error:\n                    print("expired join notification error:", type(notify_error).__name__, flush=True)\n        except Exception as exc:\n            print("state cleanup loop error:", repr(exc), flush=True)')
            assert 'if age_seconds > 360:' in s and 'expired_unconfirmed_chats' in s
            ast.parse(s)
            (stage/"main.py").write_text(s)
            live_i18n=Path("/opt/beonmeet/app/i18n.py").read_text().splitlines(keepends=True)
            target=(stage/"reference-i18n.py").read_text().splitlines(keepends=True)
            extra=[target[i+1] for i,line in enumerate(target[:-1]) if '"join_guest_access_possible":' in line]
            assert len(extra)==3 and all('"join_expired_without_recording":' in x for x in extra)
            assert sum('"join_guest_access_possible":' in x for x in live_i18n)==3
            assert not any('"join_expired_without_recording":' in x for x in live_i18n)
            out=[];i=0
            for line in live_i18n:
                out.append(line)
                if '"join_guest_access_possible":' in line:
                    out.append(extra[i]);i+=1
            assert i==3
            v="".join(out);ast.parse(v)
            (stage/"i18n.py").write_text(v)
            print("MINIMAL_STALE_JOIN_PATCH_STAGED")
            PY
            python3 -m py_compile "$stage/main.py" "$stage/i18n.py"
            python3 - <<'PY'
            import json,urllib.request,subprocess
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=6) as r:h=json.load(r)
            assert h.get("ok")
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0,"Controller is busy"
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:d=json.load(r)
                assert int((d.get("data")or d).get("runningJobs") or 0)==0,"Recorder active"
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","-f","{{.State.Health.Status}}",name],text=True).strip()=="healthy",name
            print("ALL_RECORDINGS_IDLE_CAMCAM_HEALTHY")
            PY
            backup=$(mktemp -d /opt/beonmeet/.backup-stale-status.XXXXXXXX)
            chmod 700 "$backup"
            cp -p app/main.py "$backup/main.py"
            cp -p app/i18n.py "$backup/i18n.py"
            changed=0
            done=0
            rollback(){
              if [ "$changed" = 1 ] && [ "$done" = 0 ];then
                cp -p "$backup/main.py" app/main.py
                cp -p "$backup/i18n.py" app/i18n.py
                systemctl restart beonmeet-controller || true
                echo CONTROLLER_STALE_STATUS_ROLLED_BACK
              fi
              rm -rf "$stage"
            }
            trap rollback EXIT
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=5) as r:h=json.load(r)
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as r:d=json.load(r)
                assert int((d.get("data")or d).get("runningJobs") or 0)==0
            print("IMMEDIATE_PRE_RESTART_IDLE_PASS")
            PY
            changed=1
            install -m 644 "$stage/main.py" app/main.py
            install -m 644 "$stage/i18n.py" app/i18n.py
            systemctl restart beonmeet-controller
            ready=0
            for i in $(seq 1 23);do
              if curl -fsS --max-time 3 http://127.0.0.1:8109/health >/dev/null 2>&1;then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1
            cmp -s app/main.py "$stage/main.py"
            cmp -s app/i18n.py "$stage/i18n.py"
            curl -fsS --max-time 8 https://beonmeet.smarbiz.sbs/health >/dev/null
            for name in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1;do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$name")" = healthy
            done
            done=1
            trap - EXIT
            rm -rf "$stage"
            echo STALE_JOIN_LIFECYCLE_CONTROLLER_RELEASE_SUCCESS
            echo RECORDERS_AND_CAMCAM_UNCHANGED
