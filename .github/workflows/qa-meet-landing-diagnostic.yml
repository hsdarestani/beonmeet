name: Google Meet QA landing + instant-room diagnosis
on:
  push:
    branches: [fix/stable-google-meet-qa-20261122]
    paths: [.github/workflows/qa-meet-landing-diagnostic.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: node --check tests/meet_landing_page_privacy_probe.js
      - name: Inspect only Chrome UI and redirects on idle isolated browser
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.PASS }}
          timeout: 20s
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 90 9
            python3 - <<'PY'
            import json,urllib.request
            def j(url):
                with urllib.request.urlopen(url,timeout=6) as r:return json.load(r)
            h=j('http://127.0.0.1:8109/health')
            assert h.get('ok')
            assert all(not int(h.get(k) or 0) for k in ('free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs'))
            for p in (9126,9132,9133,9134,9135):
                d=j(f'http://127.0.0.1:{p}/capacity');d=d.get('data') or d
                assert not int(d.get('runningJobs') or 0)
            print('MEET_LANDING_DIAG_IDLE_OK')
            PY
            git fetch -q origin fix/stable-google-meet-qa-20261122
            tmp=$(mktemp /tmp/meet-landing-diag.XXXXXXXX.js)
            trap 'rm -f "$tmp"' EXIT
            git show "${{ github.sha }}:tests/meet_landing_page_privacy_probe.js" > "$tmp"
            docker exec -i beonmeet-worker-five node - < "$tmp"

# QA retry with corrected Playwright failure signal classifier.
