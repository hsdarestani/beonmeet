name: Correct Whisper package read permissions for BeOnMeet service account

on:
  push:
    branches: [ops/repair-whisper-package-permissions-20261121]
    paths:
      - .github/workflows/repair-venv-package-permissions.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Restore wheel file permissions only inside BeOnMeet Python venv
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            cd /opt/beonmeet
            python3 - <<'PY'
            import os,stat,subprocess,json,sysconfig
            from pathlib import Path
            from datetime import datetime,timezone
            p=subprocess.run([".venv/bin/python","-c","import sysconfig;print(sysconfig.get_paths()['purelib'])"],capture_output=True,text=True,timeout=15)
            assert p.returncode==0
            root=Path(p.stdout.strip()).resolve()
            assert root.is_dir() and str(root).startswith("/opt/beonmeet/.venv/lib/")
            assert root.name=="site-packages"
            changed=[]
            for dirname,dirs,files in os.walk(root,followlinks=False):
                candidates=[Path(dirname)]+[Path(dirname)/x for x in files]
                for item in candidates:
                    if item.is_symlink():continue
                    st=item.lstat()
                    if st.st_uid!=0:continue
                    mode=stat.S_IMODE(st.st_mode)
                    if item.is_dir() and mode==0o700:
                        changed.append((str(item),mode,0o755))
                    elif item.is_file() and mode in (0o600,0o700):
                        changed.append((str(item),mode,0o644 if mode==0o600 else 0o755))
            assert 0<len(changed)<50000,"Unexpected count of restricted site-package files"
            backup=Path("/opt/beonmeet/.whisper-permissions-backup-20261121-v4.json")
            assert not backup.exists(),"Prior permissions repair already ran"
            backup.write_text(json.dumps({"modified_at":datetime.now(timezone.utc).isoformat(),
                "entries":[[str(Path(p).relative_to(root)),old] for p,old,_ in changed]}))
            backup.chmod(0o600)
            print("BEONMEET_VENV_RESTRICTED_PACKAGE_ENTRIES",len(changed))
            try:
                # Change directories before children so all paths become accessible.
                changed.sort(key=lambda x:len(Path(x[0]).parts))
                for path,old,new in changed:
                    Path(path).chmod(new)
                user=subprocess.run(["runuser","-u","beonmeet","--",
                    "/opt/beonmeet/.venv/bin/python","-c",
                    "from faster_whisper import WhisperModel;import av,ctranslate2,onnxruntime;print('SERVICE_WHISPER_IMPORT_PASS')"],
                    capture_output=True,text=True,timeout=30)
                if user.returncode!=0:
                    last=user.stderr.strip().splitlines()[-1] if user.stderr else "unknown"
                    import re
                    redacted=re.sub(r"/[^ ,:\\x27\\x22)]+","[PATH]",last)
                    print("SERVICE_IMPORT_FAILURE_CLASS",last.split(":",1)[0][:85])
                    print("SERVICE_IMPORT_FAILURE_SUMMARY",redacted[:230])
                    if ": cannot open shared object file:" in last:
                        libpath=last.split(": ",1)[1].split(": cannot open",1)[0]
                        from pathlib import Path
                        lib=Path(libpath)
                        print("LIBRARY_DENIED_NAME",lib.name[:120])
                        print("LIBRARY_DENIED_EXISTS",lib.exists())
                        if lib.exists():
                            print("LIBRARY_DENIED_MODE",oct(lib.stat().st_mode & 0o777),"UID",lib.stat().st_uid)
                assert user.returncode==0, "Nonroot Whisper import failed, reverting"
                assert "SERVICE_WHISPER_IMPORT_PASS" in user.stdout
                print("NONROOT_SERVICE_IMPORTS_VERIFIED")
            except Exception:
                for path,old,_ in sorted(changed,key=lambda x:len(Path(x[0]).parts),reverse=True):
                    Path(path).chmod(old)
                print("VENV_PACKAGE_MODES_ROLLED_BACK")
                raise
            PY
            test "$(systemctl is-active beonmeet-controller)" = active
            for n in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect --format '{{.State.Health.Status}}' "$n")" = healthy
            done
            echo "WHISPER_IMPORT_PERMISSION_REPAIR_SUCCESS"
