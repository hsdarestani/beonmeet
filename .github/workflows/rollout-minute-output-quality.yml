name: One-time BeOnMeet minute wallet, output permission and quality release

on:
  push:
    branches: [ops/rollout-minute-credit-output-quality-20261121]
    paths:
      - .github/workflows/rollout-minute-output-quality.yml

permissions:
  contents: read

jobs:
  rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - name: Guarded BeOnMeet-only controller and worker upgrade
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 8m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST;exit 1;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 60 9
            cd /opt/beonmeet
            release=a4b7ef94354e3f3ec99a109fb2c3082b98c1086e
            baseline=f5386c5e4d54ddc24c14a1496218bf49c5ea3550
            git fetch -q origin main
            git merge-base --is-ancestor "$release" FETCH_HEAD
            stage=$(mktemp -d /opt/beonmeet/.stage-reliable-recording.XXXXXXXX)
            for file in app/main.py app/i18n.py patches/patch_capture_quality_profile.py patches/patch_compiled_uploader_permissions.py; do
              git show "$release:$file" > "$stage/$(basename "$file")"
            done
            for file in app/main.py app/i18n.py; do
              git show "$baseline:$file" > "$stage/old-$(basename "$file")"
              cmp -s "$file" "$stage/old-$(basename "$file")" || {
                echo UNREVIEWED_CURRENT_CONTROLLER_SOURCE; rm -rf "$stage";exit 1;
              }
            done
            python3 -m py_compile "$stage/main.py" "$stage/i18n.py" "$stage/patch_capture_quality_profile.py" "$stage/patch_compiled_uploader_permissions.py"
            worker=beonmeet-worker-five
            overlay=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}' "$worker")
            case "$overlay" in /opt/beonmeet/*) : ;; *) echo UNKNOWN_EXISTING_RECORDER_OVERLAY;exit 1;; esac
            test -f "$overlay" && test ! -L "$overlay"
            docker cp "$worker:/usr/src/app/dist/middleware/disk-uploader.js" "$stage/uploader.before.js"
            cp -p "$overlay" "$stage/GoogleMeetBot.before.js"
            python3 "$stage/patch_capture_quality_profile.py" "$stage/GoogleMeetBot.before.js" "$stage/GoogleMeetBot.balanced.js"
            python3 "$stage/patch_compiled_uploader_permissions.py" "$stage/uploader.before.js" "$stage/uploader.fixed.js"
            image=$(docker inspect -f '{{.Config.Image}}' "$worker")
            for file in GoogleMeetBot.balanced.js uploader.fixed.js; do
              docker run --rm --network none --memory=300m --cpus=.3 --entrypoint node -v "$stage/$file:/tmp/$file:ro" "$image" --check "/tmp/$file"
            done
            echo COMPILED_RECORDER_QUALITY_AND_OUTPUT_PATCHES_VALIDATE
            python3 - <<'PY'
            import json,subprocess,time,urllib.request
            from pathlib import Path
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=8) as r:h=json.load(r)
            assert h.get("ok") and int(h.get("max_concurrent_meetings") or 0)==5
            assert not h.get("autoscaler_enabled"),"Autoprovisioning remains disabled"
            for key in ("free_queue","premium_queue","active_delivery_jobs"):
                assert int(h.get(key) or 0)==0,key+" not idle"
            if int(h.get("pending_delivery_jobs") or 0):
                state=json.loads(Path("/opt/beonmeet/data/state.json").read_text())
                pending=list((state.get("pending_deliveries") or {}).values())
                assert len(pending)==int(h["pending_delivery_jobs"])
                for item in pending:
                    assert item.get("video_delivered"),"Pending initial video must not be interrupted"
                    src=Path(str(item.get("file_path") or item.get("source_path") or ""))
                    assert src.is_file() and src.stat().st_size>0,"Pending source unavailable"
                print("EXISTING_PREMIUM_RECOVERY_PRESERVED",len(pending))
            for attempt in range(24):
                busy=[]
                for port in (9124,9126):
                    with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=7) as r:w=json.load(r)
                    busy.append(int((w.get("data") or w).get("runningJobs") or 0))
                if busy==[0,0]:break
                if attempt==23:raise AssertionError("Recorder remains busy; no update")
                time.sleep(7)
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","--format","{{.State.Health.Status}}",name],text=True).strip()=="healthy",name
            print("BEONMEET_IDLE_WITH_CAMCAM_GREEN")
            PY
            backup="/opt/beonmeet/.reliable-recording-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 700 "$backup"
            cp -p app/main.py "$backup/main.py"
            cp -p app/i18n.py "$backup/i18n.py"
            cp -p "$stage/GoogleMeetBot.before.js" "$backup/GoogleMeetBot.js"
            cp -p "$stage/uploader.before.js" "$backup/disk-uploader.js"
            cp -p .env "$backup/env.before"
            if [ -s data/state.json ]; then cp -p data/state.json "$backup/state.before"; fi
            python3 - "$backup" <<'PY'
            import sqlite3,os,sys
            from pathlib import Path
            db=Path("/opt/beonmeet/data/beonmeet.db")
            if db.is_file():
                src=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True)
                dstpath=Path(sys.argv[1])/"db.before"
                dst=sqlite3.connect(str(dstpath))
                src.backup(dst);dst.close();src.close()
                os.chmod(dstpath,0o600)
            print("PRESERVED_USER_DATA_AND_CODE_BACKUP")
            PY
            changed=0
            finished=0
            rollback() {
              if [ "$changed" = 1 ] && [ "$finished" = 0 ]; then
                echo REVERTING_BEONMEET_CODE_TO_PREVIOUS_VERSION
                cp -p "$backup/main.py" app/main.py
                cp -p "$backup/i18n.py" app/i18n.py
                cat "$backup/GoogleMeetBot.js" > "$overlay"
                docker cp "$backup/disk-uploader.js" "$worker:/usr/src/app/dist/middleware/disk-uploader.js" || true
                systemctl restart beonmeet-controller || true
                docker restart --time 20 "$worker" >/dev/null || true
              fi
              rm -rf "$stage"
            }
            trap rollback EXIT
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=6) as r:h=json.load(r)
            for k in ("free_queue","premium_queue","active_delivery_jobs"):
                assert int(h.get(k) or 0)==0,"Controller became busy"
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:w=json.load(r)
                assert int((w.get("data") or w).get("runningJobs") or 0)==0,"Recorder became busy"
            print("IMMEDIATE_PRE_CHANGE_IDLE_RECHECK_PASS")
            PY
            changed=1
            install -m 644 "$stage/main.py" app/main.py
            install -m 644 "$stage/i18n.py" app/i18n.py
            cat "$stage/GoogleMeetBot.balanced.js" > "$overlay"
            docker cp "$stage/uploader.fixed.js" "$worker:/usr/src/app/dist/middleware/disk-uploader.js"
            systemctl restart beonmeet-controller
            docker restart --time 20 "$worker" >/dev/null
            ready=0
            for i in $(seq 1 27); do
              if curl -fsS --max-time 3 http://127.0.0.1:8109/health >/dev/null 2>&1 &&
                 curl -fsS --max-time 3 http://127.0.0.1:9126/capacity >/dev/null 2>&1;then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1 || { echo BEONMEET_CONTROLLER_OR_WORKER_HEALTH_FAILED;exit 1; }
            cmp -s app/main.py "$stage/main.py"
            cmp -s app/i18n.py "$stage/i18n.py"
            docker exec "$worker" sh -c 'grep -q "const recordingQuality =" /usr/src/app/dist/bots/GoogleMeetBot.js && grep -q "chmod(instance.folderPath(), 0o2770)" /usr/src/app/dist/middleware/disk-uploader.js'
            docker exec "$worker" node --check /usr/src/app/dist/middleware/disk-uploader.js
            docker exec "$worker" node --check /usr/src/app/dist/bots/GoogleMeetBot.js
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:9126/capacity",timeout=6) as r:d=json.load(r)
            d=d.get("data",d)
            assert int(d.get("maxConcurrentJobs") or 0)==5
            assert int(d.get("runningJobs") or 0)==0
            print("FIVE_SLOT_WORKER_AND_NEW_BUILD_HEALTHY")
            PY
            curl -fsS --max-time 10 https://beonmeet.smarbiz.sbs/health >/dev/null
            for n in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$n")" = healthy
            done
            finished=1
            trap - EXIT
            rm -rf "$stage"
            echo DIVISIBLE_WALLET_JOIN_PROGRESS_480P_CAPTURE_AND_UPLOADER_PATCH_DEPLOYED
            echo CAMCAM_UNCHANGED_AND_PENDING_FILES_PRESERVED
