name: BeOnMeet change validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and regression tests
        run: |
          python3 -m py_compile app/main.py app/i18n.py app/hetzner_autoscaler.py app/autoscaler_smoke.py app/admin_panel.py app/billing_policy.py
          python3 tests/auto_calendar_test.py
          python3 tests/calendar_legacy_isolation_test.py
          python3 tests/auto_calendar_behavior_test.py
          python3 tests/premium_delivery_test.py
          python3 tests/i18n_test.py
          python3 tests/all_meetings_hidden_test.py
          python3 tests/billing_tier_test.py
          python3 tests/billing_usage_behavior_test.py
          python3 tests/prepaid_hour_wallet_behavior_test.py
          python3 tests/hamooncloud_payment_patch_test.py
          python3 -m py_compile patches/fix_hamooncloud_beonmeet_plans.py
          bash -n scripts/deploy_hamooncloud_payment_plan_fix.sh
          python3 tests/free_plan_limit_test.py
          python3 tests/public_oauth_pages_test.py
          python3 tests/recorder_end_guard_test.py
          python3 tests/admin_google_email_test.py
          python3 tests/admin_google_clay_test.py
          python3 tests/cloud_init_render_test.py
          node --check tests/five_sustained_av_smoke.js
          python3 tests/low_resource_capture_patch_test.py
          python3 -m py_compile patches/patch_low_resource_compiled_recorder.py
          bash -n scripts/activate_five_on_shared_vps.sh
          bash -n scripts/rollback_five_on_shared_vps.sh
          bash -n scripts/deploy_hide_auto_clarify_billing.sh
          bash -n scripts/deploy_prepaid_hour_wallet.sh









  prepaid-wallet-host-readonly-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/prepaid-recording-hour-wallet-20261119'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read-only audit of live app base, paid period counts, pending intents, and recording queue
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 90s
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST;exit 1;; esac
            echo PREPAID_AUDIT_BEGIN
            cd /opt/beonmeet
            git fetch --quiet origin refs/heads/feat/prepaid-recording-hour-wallet-20261119
            python3 - <<'PY'
            import hashlib,json,subprocess,sqlite3,datetime,urllib.request,os
            from pathlib import Path
            expected=['18099aca6d727baddd26700828da74aeaf932fe4','b3220a0dd7c1f4ca72321f70544b38c22a0b099b']
            for file in ('main.py','admin_panel.py','i18n.py','billing_policy.py'):
                raw=(Path('/opt/beonmeet/app')/file).read_bytes()
                match=[]
                for ref in expected:
                    try:
                        other=subprocess.check_output(['git','show',ref+':app/'+file],stderr=subprocess.DEVNULL)
                        if raw==other:match.append(ref[:12])
                    except Exception:pass
                print('LIVE_SOURCE',file,'matches=',match,'hash=',hashlib.sha256(raw).hexdigest()[:12])
            path=Path('/opt/beonmeet/data/beonmeet.db')
            print('DB_EXISTS=',path.exists())
            db=sqlite3.connect('file:'+str(path)+'?mode=ro',uri=True)
            now=datetime.datetime.now(datetime.timezone.utc).isoformat()
            tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
            print('HAS_CREDIT_LEDGER=', 'credit_entries' in tables)
            print('ACTIVE_OLD_PREPAID_ROWS=',db.execute(
                "SELECT COUNT(*) FROM subscriptions WHERE status='active' AND plan_code IN ('basic','pro','business') AND ends_at>?",(now,)
            ).fetchone()[0])
            print('ACTIVE_LEGACY_ROWS=',db.execute(
                "SELECT COUNT(*) FROM subscriptions WHERE status='active' AND plan_code IN ('monthly','quarterly','halfyear') AND ends_at>?",(now,)
            ).fetchone()[0])
            print('PENDING_PAYMENT_INTENTS=',db.execute(
                "SELECT COUNT(*) FROM payment_intents WHERE status='pending' AND expires_at>?",(now,)
            ).fetchone()[0])
            with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=8) as r:d=json.load(r)
            print('LIVE_HEALTH=',{k:d.get(k) for k in ('ok','max_concurrent_meetings','free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs')})
            for p in (9124,9126):
                with urllib.request.urlopen('http://127.0.0.1:'+str(p)+'/capacity',timeout=8) as r:obj=json.load(r)
                print('WORKER=',p,'running_jobs=',(obj.get('data') or obj).get('runningJobs'))
            PY
            for s in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1;do
              printf '%s=' "$s"
              docker inspect -f '{{.State.Health.Status}}' "$s"
            done
            echo PREPAID_AUDIT_END
