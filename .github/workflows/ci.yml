name: BeOnMeet change validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and regression tests
        run: |
          python3 -m py_compile app/main.py app/i18n.py app/hetzner_autoscaler.py app/autoscaler_smoke.py app/admin_panel.py app/billing_policy.py
          python3 tests/auto_calendar_test.py
          python3 tests/calendar_legacy_isolation_test.py
          python3 tests/auto_calendar_behavior_test.py
          python3 tests/premium_delivery_test.py
          python3 tests/i18n_test.py
          python3 tests/billing_tier_test.py
          python3 tests/billing_usage_behavior_test.py
          python3 tests/free_plan_limit_test.py
          python3 tests/public_oauth_pages_test.py
          python3 tests/recorder_end_guard_test.py
          python3 tests/admin_google_email_test.py
          python3 tests/admin_google_clay_test.py
          python3 tests/cloud_init_render_test.py
          python3 tests/low_resource_capture_patch_test.py
          python3 -m py_compile patches/patch_low_resource_compiled_recorder.py
          bash -n scripts/activate_five_on_shared_vps.sh



  one-vps-recorder-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/five-concurrent-recorder-capacity-20261119'
    runs-on: ubuntu-24.04
    steps:
      - name: Read-only audit of recorder slots and host budget
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 3m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST;exit 1;; esac
            cd /opt/beonmeet
            echo AUDIT_BEGIN
            date -u +%F-%T
            echo HOST_SYSTEM
            nproc
            free -m | head -3
            df -h / /dev/shm | tail -3
            uptime
            echo DOCKER_RUNNING_SERVICES
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
            echo DOCKER_RESOURCE_USAGE
            docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' | head -35
            echo DOCKER_RECORDER_CONFIG_NONSECRET
            python3 - <<'PY'
            import json,subprocess
            names=subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True).splitlines()
            for name in names:
                if not any(s in name.lower() for s in ('beonmeet','chrome','recorder','meeting-bot')):
                    continue
                info=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
                env={}
                allow={'MAX_CONCURRENT_MEETINGS','GOOGLE_CHROME_CDP_URL','CHROME_WINDOW_SIZE','MAX_RECORDING_DURATION_MINUTES','RECORDING_TMP_DIR','TRANSCRIPTION_CONCURRENCY','GOOGLE_CHROME_USER_DATA_DIR','NODE_ENV','SHM_SIZE'}
                for line in info['Config'].get('Env',[]):
                    if '=' in line:
                        k,v=line.split('=',1)
                        if k in allow:env[k]=v
                host=info.get('HostConfig') or {}
                print(json.dumps({'name':name,'image':info['Config'].get('Image'),'env':env,'memory_limit_bytes':host.get('Memory'),'cpus_nano':host.get('NanoCpus'),'shm_size_bytes':host.get('ShmSize'),'restart_policy':host.get('RestartPolicy',{}).get('Name')},ensure_ascii=False))
            PY
            echo DOCKER_RECORDER_CAPACITY
            curl -fsS --max-time 6 http://127.0.0.1:9124/capacity | python3 -c 'import sys,json;d=json.load(sys.stdin); v=d.get("data") or d; print({k:v.get(k) for k in ("maxConcurrentMeetings","maxConcurrent","runningJobs","availableSlots","maxRunningJobs","queuedJobs","pendingJobs","totalSlots")})' || true
            echo CONTROLLER_HEALTH
            curl -fsS --max-time 6 http://127.0.0.1:8109/health | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ("max_concurrent_meetings","local_free_meeting_slots","local_premium_reserved_slots","healthy_free_workers","healthy_premium_workers","free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs","autoscaler_enabled")})'
            echo NONSECRET_ENV
            python3 - <<'PY'
            from pathlib import Path
            d={}
            for line in Path('/opt/beonmeet/.env').read_text().splitlines():
                if '=' not in line or line.lstrip().startswith('#'):continue
                k,v=line.split('=',1);k=k.strip()
                if k in {'FREE_MEETING_SLOTS','PREMIUM_MEETING_SLOTS','TRANSCRIPTION_CONCURRENCY','AUTOSCALE_ENABLED','WHISPER_CPU_THREADS','WHISPER_MODEL','PREMIUM_WORKER_SLOTS','MAX_CONCURRENT_MEETINGS','FREE_WORKER_URLS','PREMIUM_WORKER_URLS'}:
                    if k.endswith('_URLS'):d[k]='configured' if v else 'unset'
                    else:d[k]=v.strip()
            print(d)
            PY

            echo HOST_DOCKER_COMPOSE_FILES
            find /opt/beonmeet -maxdepth 3 -type f \( -name 'docker-compose*.yml' -o -name 'compose*.yaml' -o -name '*single*.sh' -o -name '*single*.service' \) -printf '%p\n' 2>/dev/null | head -30
            echo DOCKER_CONTAINER_IMAGE_ENTRYPOINTS
            python3 - <<'PY'
            import json,subprocess
            for name in ('beonmeet-worker-single','beonmeet-chrome-single'):
                d=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
                print(name, 'command=',d['Config'].get('Cmd'),'entrypoint=',d['Config'].get('Entrypoint'))
                print(name,'mounts=',[{'Destination':m.get('Destination'),'RW':m.get('RW'),'Type':m.get('Type')} for m in d.get('Mounts',[])])
                print(name,'cpu_quota=',d['HostConfig'].get('CpuQuota'),'pids_limit=',d['HostConfig'].get('PidsLimit'))
            PY
            echo CHROME_CDP_DEBUG_TARGET_COUNTS
            docker exec beonmeet-chrome-single sh -lc 'ps -eo comm | sort | uniq -c | sort -nr | head -12' || true
            echo SHARED_HOST_RUNNING_APPS
            systemctl list-units --no-pager --no-legend --type=service --state=running | cut -d' ' -f1 | grep -Ei 'cam|beon|mediamtx|nginx|redis|rednote|postgres' | head -25 || true
            echo ACTIVE_RECORDER_STATUS
            curl -fsS --max-time 5 http://127.0.0.1:9124/capacity | python3 -c 'import sys,json;d=json.load(sys.stdin);v=d.get("data") or d;print({"running":v.get("runningJobs"),"available":v.get("availableSlots")})'

            echo RECORDER_DOCKER_NETWORK_AND_COMPOSE
            python3 - <<'PY'
            import json,subprocess
            for name in ('beonmeet-worker-single','beonmeet-chrome-single'):
                d=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
                config=d.get('Config') or {}
                net=d.get('NetworkSettings') or {}
                hc=d.get('HostConfig') or {}
                labels=config.get('Labels') or {}
                out={
                  'name':name,'host_network_mode':hc.get('NetworkMode'),
                  'network_names':list((net.get('Networks') or {}).keys()),
                  'network_aliases':{k:v.get('Aliases') for k,v in (net.get('Networks') or {}).items()},
                  'published_port_keys':list((hc.get('PortBindings') or {}).keys()),
                  'compose_project':labels.get('com.docker.compose.project'),
                  'compose_file':labels.get('com.docker.compose.project.config_files'),
                  'compose_service':labels.get('com.docker.compose.service'),
                  'mount_source_dest':[{'Source':m.get('Source'),'Destination':m.get('Destination')} for m in d.get('Mounts') or []],
                }
                print(json.dumps(out))
            PY
            echo PARENT_PROCESS_AND_ACTIVE_LOAD
            ps -eo comm,%cpu,%mem,rss --sort=-rss | head -18
            echo RECORDER_RELEVANT_COMPOSE_RESOURCES
            grep -nE 'beonmeet-(worker|chrome)-single|MAX_CONCURRENT_MEETINGS|CHROME_WINDOW_SIZE|mem_limit|cpus:|shm_size|pids_limit' /opt/beonmeet/worker/docker-compose.yml | head -60 || true
            echo PLAYWRIGHT_INSTALLED_IN_RECORDER
            docker exec beonmeet-worker-single node -e 'for (const mod of ["playwright","playwright-core","puppeteer","puppeteer-core"]) {try {console.log(mod+"="+require.resolve(mod));} catch(e) {}}'
            echo CHROME_CDP_VERSION
            docker exec beonmeet-worker-single node -e 'fetch("http://beonmeet-chrome-single:9223/json/version").then(r=>r.json()).then(x=>console.log({Browser:x.Browser,ProtocolVersion:x["Protocol-Version"]})).catch(e=>console.log("cdp_error="+e.message))'

            echo COMPILED_WORKER_ENTRYPOINT_AND_CAPTURE
            docker exec beonmeet-worker-single sh -lc 'find /usr/src/app/dist -maxdepth 3 -type f -name "*GoogleMeetBot*.js" -o -name "*recording*.js" | head -12' || true
            docker exec beonmeet-worker-single sh -lc "grep -R -n -m 2 -E 'new MediaRecorder|captureStream|getDisplayMedia|videoBitsPerSecond|selectedMimeType' /usr/src/app/dist/bots/GoogleMeetBot.js | head -18" || true
            echo LIVE_PORT_BINDINGS
            python3 - <<'PY'
            import json,subprocess
            for name in ('beonmeet-worker-single','beonmeet-chrome-single'):
                d=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
                print(name, 'ports=', d['HostConfig'].get('PortBindings'),'user=',d['Config'].get('User'),
                  'readonly_root=',d['HostConfig'].get('ReadonlyRootfs'),'mounts=',[(x.get('Source'),x.get('Destination')) for x in d.get('Mounts',[])])
            PY
            echo COMPILED_CAPTURE_SNIPPET
            docker exec beonmeet-worker-single sh -lc "sed -n '713,770p' /usr/src/app/dist/bots/GoogleMeetBot.js" || true
            echo COMPILED_CODEC_SNIPPET
            docker exec beonmeet-worker-single sh -lc "head -42 /usr/src/app/dist/lib/recording.js" || true

            echo ISOLATED_COMPILED_RECORDER_PATCH_SMOKE
            cd /opt/beonmeet
            TEMP=$(mktemp -d /opt/beonmeet/.five-compiled-smoke.XXXXXXXX)
            export TEMP
            cleanup_overlay() { rm -rf "$TEMP"; }
            trap cleanup_overlay EXIT
            git show c585793c6b369ab72af7856ac038e22c6bdc5072:patches/patch_low_resource_compiled_recorder.py > "$TEMP/patcher.py" || {
              git fetch --quiet origin refs/heads/feat/five-concurrent-recorder-capacity-20261119
              git show c585793c6b369ab72af7856ac038e22c6bdc5072:patches/patch_low_resource_compiled_recorder.py > "$TEMP/patcher.py"
            }
            docker cp beonmeet-worker-single:/usr/src/app/dist/bots/GoogleMeetBot.js "$TEMP/GoogleMeetBot.orig.js"
            python3 "$TEMP/patcher.py" "$TEMP/GoogleMeetBot.orig.js" "$TEMP/GoogleMeetBot.overlay.js"
            docker run --rm --network none --memory 300m --cpus .3 --entrypoint node -v "$TEMP/GoogleMeetBot.overlay.js:/tmp/recorder.js:ro" beonmeet-worker-audiofix:latest --check /tmp/recorder.js
            echo COMPILED_RECORDER_OVERLAY_SYNTAX_PASS
            echo AUDIT_COMPLETE


  controlled-five-slot-pilot-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/five-concurrent-recorder-capacity-20261119'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Controlled same-host five-slot pilot (keeps original 1-slot worker)
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST;exit 1;; esac
            cd /opt/beonmeet
            git fetch --quiet origin refs/heads/feat/five-concurrent-recorder-capacity-20261119
            TEMP=$(mktemp /tmp/beonmeet-five-slot-release.XXXXXXXX.sh)
            trap 'rm -f "$TEMP"' EXIT
            git show 1392b17de6528ec17a02e7d9b2e3d9e3e80dfbbf:scripts/activate_five_on_shared_vps.sh > "$TEMP"
            bash -n "$TEMP"
            bash "$TEMP"
