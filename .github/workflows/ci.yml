name: BeOnMeet change validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and regression tests
        run: |
          python3 -m py_compile app/main.py app/i18n.py app/hetzner_autoscaler.py app/autoscaler_smoke.py app/admin_panel.py app/billing_policy.py
          python3 tests/auto_calendar_test.py
          python3 tests/calendar_legacy_isolation_test.py
          python3 tests/auto_calendar_behavior_test.py
          python3 tests/premium_delivery_test.py
          python3 tests/i18n_test.py
          python3 tests/billing_tier_test.py
          python3 tests/billing_usage_behavior_test.py
          python3 tests/free_plan_limit_test.py
          python3 tests/public_oauth_pages_test.py
          python3 tests/recorder_end_guard_test.py
          python3 tests/admin_google_email_test.py
          python3 tests/admin_google_clay_test.py
          python3 tests/cloud_init_render_test.py
          node --check tests/five_sustained_av_smoke.js
          python3 tests/low_resource_capture_patch_test.py
          python3 -m py_compile patches/patch_low_resource_compiled_recorder.py
          bash -n scripts/activate_five_on_shared_vps.sh
          bash -n scripts/rollback_five_on_shared_vps.sh





  payment-readonly-production-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/payment-intent-gateway-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only payment-intent routing diagnosis (no purchase or changes)
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 2m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1;; esac
            echo PAYMENT_AUDIT_BEGIN
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            systemctl is-active beonmeet-controller
            python3 - <<'PY'
            import sqlite3, pathlib, datetime, os, json, urllib.request, urllib.error, urllib.parse
            p=pathlib.Path('/opt/beonmeet/data/beonmeet.db')
            now=datetime.datetime.now(datetime.timezone.utc)
            print('database_exists=',p.exists(),'database_size_bytes=',p.stat().st_size if p.exists() else 0)
            assert p.exists()
            db=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True)
            db.row_factory=sqlite3.Row
            tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
            print('has_payment_intents_table=', 'payment_intents' in tables)
            if 'payment_intents' in tables:
                for row in db.execute('SELECT status, count(*) as ct FROM payment_intents GROUP BY status'):
                    print('intent_status_count=',row['status'],row['ct'])
                candidates=list(db.execute("""SELECT intent,plan_code,amount_toman,status,created_at,expires_at
                   FROM payment_intents ORDER BY created_at DESC LIMIT 10"""))
                print('recent_intent_count=',len(candidates))
                for i,r in enumerate(candidates):
                    date=datetime.datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))
                    exp=datetime.datetime.fromisoformat(r['expires_at'].replace('Z','+00:00'))
                    print('intent_summary=',i,'plan=',r['plan_code'],'amount_toman=',r['amount_toman'],
                          'status=',r['status'],'age_minutes=',round((now-date).total_seconds()/60,1),
                          'expired_now=',exp<=now,'ttl_minutes=',round((exp-date).total_seconds()/60,2))
                usable=next((r for r in candidates if r['status']=='pending' and
                    datetime.datetime.fromisoformat(r['expires_at'].replace('Z','+00:00'))>now),None)
                if usable:
                    def probe(url):
                        try:
                            req=urllib.request.Request(url,headers={'User-Agent':'BeOnMeet-internal-ops-healthcheck'})
                            with urllib.request.urlopen(req,timeout=12) as response:
                                raw=response.read(12000)
                                ct=response.headers.get('content-type','')
                                try:
                                    ob=json.loads(raw) if 'json' in ct else None
                                    view={k:ob.get(k) for k in ('ok','status','plan','amount_toman','detail') if k in ob} if isinstance(ob,dict) else {}
                                except Exception:view={}
                                print('HTTP_PROBE=',urllib.parse.urlsplit(url).netloc, response.status,'content_type=',ct.split(';')[0],'json_fields=',view)
                        except urllib.error.HTTPError as e:
                            try:
                                raw=e.read(3000)
                                ct=e.headers.get('content-type','')
                                data=json.loads(raw) if 'json' in ct else {}
                                detail=data.get('detail') if isinstance(data,dict) else None
                            except Exception:detail=None
                            print('HTTP_PROBE=',urllib.parse.urlsplit(url).netloc, e.code, 'detail=',str(detail)[:120])
                        except Exception as e:
                            print('HTTP_PROBE_ERROR=',urllib.parse.urlsplit(url).netloc,type(e).__name__,str(e)[:180])
                    token=urllib.parse.quote(usable['intent'],safe='')
                    probe('http://127.0.0.1:8109/api/billing/payment-intent?intent='+token)
                    probe('https://beonmeet.smarbiz.sbs/api/billing/payment-intent?intent='+token)
                else:
                    print('NO_LIVE_PENDING_INTENT_TO_PROBE')
            try:
                with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=8) as response:
                    o=json.load(response)
                    print('service_health=',{k:o.get(k) for k in ('ok','database_backend','max_concurrent_meetings')})
            except Exception as e:print('HEALTH_ERROR=',type(e).__name__)
            PY
            echo PUBLIC_PAYMENT_ROUTES
            for url in 'https://pay.hamooncloud.ir/payments/beonmeet/start' 'https://pay.hamooncloud.ir/payments/beonmeet/status';do
              curl -sS -o /dev/null -w 'gateway_http=%{http_code} redirect=%{redirect_url}\n' --max-time 10 "$url" || true
            done

            echo GATEWAY_LATEST_LIVE_INTENT_PROBE
            python3 - <<'PY'
            import sqlite3,urllib.request,urllib.error,urllib.parse,json,datetime
            now=datetime.datetime.now(datetime.timezone.utc)
            db=sqlite3.connect('file:/opt/beonmeet/data/beonmeet.db?mode=ro',uri=True);db.row_factory=sqlite3.Row
            r=db.execute("""SELECT intent,plan_code,status,created_at,expires_at
                FROM payment_intents WHERE status='pending' ORDER BY created_at DESC LIMIT 1""").fetchone()
            if not r:
                print('GATEWAY_PROBE_SKIPPED no pending intent');raise SystemExit()
            expiry=datetime.datetime.fromisoformat(r['expires_at'].replace('Z','+00:00'))
            if now>=expiry:
                print('GATEWAY_PROBE_SKIPPED latest intent expired');raise SystemExit()
            t=urllib.parse.quote(r['intent'],safe='')
            url='https://pay.hamooncloud.ir/payments/beonmeet/start?intent='+t
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BeOnMeetQA/1.0)'})
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self,request,fp,code,msg,headers,newurl):return None
            try:
                with urllib.request.build_opener(NoRedirect()).open(req,timeout=15) as result:
                    body=result.read(12000).decode('utf-8',errors='replace')
                    code=result.status;ctype=result.headers.get('Content-Type','')
                    redirect=result.headers.get('Location','')
            except urllib.error.HTTPError as e:
                body=e.read(12000).decode('utf-8',errors='replace')
                code=e.code;ctype=e.headers.get('Content-Type','')
                redirect=e.headers.get('Location','')
            except Exception as e:
                print('GATEWAY_PROBE_EXCEPTION=',type(e).__name__,str(e)[:150]);raise SystemExit()
            print('GATEWAY_VALID_INTENT_HTTP=',code)
            print('GATEWAY_VALID_INTENT_CT=',ctype[:70])
            print('GATEWAY_VALID_INTENT_REDIRECT_HOST=',urllib.parse.urlsplit(redirect).netloc)
            for phrase in ('پرداخت قابل انجام نیست','درخواست منقضی یا نامعتبره','از داخل BeOnMeet دوباره تلاش کن','طرح پرداخت','مبلغ','خطا','منقضی','نامعتبر'):
                print('GATEWAY_BODY_CONTAINS',repr(phrase),phrase in body)
            print('GATEWAY_BODY_SIZE=',len(body))
            print('GATEWAY_PROBE_PLAN=',r['plan_code'])
            PY
            echo GATEWAY_DNS_AND_HEADERS
            getent ahostsv4 pay.hamooncloud.ir | awk 'NR==1 {print "gateway_ip="$1}'
            curl -sSI --max-time 8 https://pay.hamooncloud.ir/payments/beonmeet/start | grep -Ei '^(server|via|x-powered-by|content-type|HTTP/|location):?' | head -8 || true

            echo PAYMENT_HOST_SERVICE_DISCOVERY
            ls /etc/nginx/sites-enabled 2>/dev/null | head -30
            grep -RHnE 'server_name.*pay\.hamooncloud\.ir|proxy_pass|root ' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | grep -A 4 -B 4 -E 'pay\.hamooncloud|proxy_pass|/opt/|/srv/' | head -75 || true
            echo PAYMENT_RUNNING_SERVICES
            systemctl list-units --type=service --state=running --no-pager --no-legend | grep -Ei 'pay|hamoon|zibal|stripe|billing|gateway' | head -22 || true
            echo PAYMENT_HOST_PROCESSES
            ps -eo pid,comm,args --no-headers | grep -Ei '[p]ayments|[h]amoon|[z]ibal' | sed -E 's/(TOKEN|SECRET|PASSWORD|API_KEY|MERCHANT|AUTH|KEY)=[^ ]+/\1=[REDACTED]/g' | cut -c1-180 | head -18 || true
            echo PAYMENT_ROOT_PATHS
            find /opt /srv /var/www -maxdepth 3 -type d \( -iname '*payment*' -o -iname '*hamoon*' -o -iname '*billing*' -o -iname '*zibal*' \) 2>/dev/null | head -35
            echo PAYMENT_ERROR_SOURCE_FILE_MATCHES
            find /opt /srv /var/www -maxdepth 6 -type f \( -name '*.py' -o -name '*.js' -o -name '*.ts' \) ! -path '*/node_modules/*' ! -path '*/.venv/*' ! -path '*/.git/*' -print0 2>/dev/null |
              xargs -0 -r grep -Fl 'درخواست منقضی یا نامعتبره' 2>/dev/null | head -15 || true

            echo HAMOON_DASHBOARD_ORIGIN_DISCOVERY
            systemctl show hamoon-dashboard.service -p WorkingDirectory -p FragmentPath -p User --no-pager
            systemctl cat hamoon-dashboard.service | grep -E '^WorkingDirectory=|^ExecStart=' | sed -E 's/(TOKEN|SECRET|PASSWORD|API_KEY|MERCHANT|AUTH|KEY)=[^ ]+/\1=[REDACTED]/g' | cut -c1-200
            echo LISTENING_PID_8108
            ss -ltnp | grep -F ':8108' | cut -c1-180
            echo HAMOON_EXECUTABLE_WORKDIR
            pid=$(ss -ltnp | sed -n 's/.*:8108.*pid=\([0-9]*\).*/\1/p' | head -1)
            if [ -n "$pid" ];then
              readlink -f "/proc/$pid/cwd" || true
              readlink -f "/proc/$pid/exe" || true
            fi
            echo PAYMENT_GATEWAY_SOURCE_LOCATIONS
            for p in /root /home /usr/local/bin /opt /srv;do
              find "$p" -maxdepth 4 -type f \( -name '*payment*.py' -o -name '*dashboard*.py' -o -name '*gateway*.py' -o -name '*zibal*.py' -o -name '*payment*.js' \) ! -path '*/node_modules/*' ! -path '*/.venv/*' 2>/dev/null | head -30
            done

            echo GATEWAY_JS_SOURCE_DIAGNOSIS
            python3 - <<'PY'
            from pathlib import Path
            import re
            base=Path('/home/hamoondeploy/hamoon-source')
            for name in ('external-payments.js','services/payment-gateway-outage-guard.js','server.js'):
                p=base/name
                print('FILE=',name,'exists=',p.exists())
                if not p.exists():continue
                lines=p.read_text(errors='replace').splitlines()
                patterns=['beonmeet','درخواست منقضی','پرداخت قابل انجام نیست','/payments/beonmeet','getPaymentIntent','payment-intent','amount_toman']
                ids=[i for i,l in enumerate(lines) if any(w.lower() in l.lower() for w in patterns)]
                print('FILE_LINES=',len(lines),'MATCH_COUNT=',len(ids))
                selected=set()
                for idx in ids[:38]:
                    for k in range(max(0,idx-3),min(len(lines),idx+5)):selected.add(k)
                previous=-2
                for i in sorted(selected):
                    if i>previous+1:print('...')
                    v=lines[i]
                    if re.search(r'(MERCHANT|TOKEN|SECRET|PASSWORD|API_KEY|AUTHORIZATION)\s*[:=]\s*[^\s{]',v,re.I):
                        v=re.sub(r'((?:MERCHANT|TOKEN|SECRET|PASSWORD|API_KEY|AUTHORIZATION)\s*[:=]\s*)[^,\s}]+',r'\1[REDACTED]',v,flags=re.I)
                    print(f'{i+1}: {v[:330]}')
                    previous=i
            git=base/'.git'
            print('GATEWAY_GIT_PRESENT=',git.exists())
            PY
            echo PAYMENT_AUDIT_END
