name: BeOnMeet change validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and regression tests
        run: |
          python3 -m py_compile app/main.py app/i18n.py app/hetzner_autoscaler.py app/autoscaler_smoke.py app/admin_panel.py app/billing_policy.py
          python3 tests/auto_calendar_test.py
          python3 tests/calendar_legacy_isolation_test.py
          python3 tests/auto_calendar_behavior_test.py
          python3 tests/premium_delivery_test.py
          python3 tests/i18n_test.py
          python3 tests/all_meetings_hidden_test.py
          python3 tests/billing_tier_test.py
          python3 tests/billing_usage_behavior_test.py
          python3 tests/prepaid_hour_wallet_behavior_test.py
          python3 tests/trial_unified_wallet_behavior_test.py
          python3 tests/hamooncloud_payment_patch_test.py
          python3 -m py_compile patches/fix_hamooncloud_beonmeet_plans.py
          bash -n scripts/deploy_hamooncloud_payment_plan_fix.sh
          python3 tests/free_plan_limit_test.py
          python3 tests/public_oauth_pages_test.py
          python3 tests/recorder_end_guard_test.py
          python3 tests/admin_google_email_test.py
          python3 tests/admin_google_clay_test.py
          python3 tests/cloud_init_render_test.py
          node --check tests/five_sustained_av_smoke.js
          python3 tests/low_resource_capture_patch_test.py
          python3 -m py_compile patches/patch_low_resource_compiled_recorder.py
          bash -n scripts/activate_five_on_shared_vps.sh
          bash -n scripts/rollback_five_on_shared_vps.sh
          bash -n scripts/deploy_hide_auto_clarify_billing.sh
          bash -n scripts/deploy_prepaid_hour_wallet.sh

  read_only_production_audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/onboarding-free-hour-unified-wallet-20261120'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Observe production without touching users or services
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 2m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST;exit 1;; esac
            cd /opt/beonmeet
            echo CONTROLLER_ACTIVE=$(systemctl is-active beonmeet-controller)
            for f in app/main.py app/admin_panel.py app/i18n.py app/credit_wallet.py;do
              echo "BLOB_$(basename "$f")=$(git hash-object "$f")"
            done
            python3 - <<'PY'
            import json,urllib.request,sqlite3
            from pathlib import Path
            with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=10) as r:
                h=json.load(r)
            for k in ('ok','max_concurrent_meetings','free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs','healthy_free_workers','healthy_premium_workers'):
                print('HEALTH_'+k+'='+str(h.get(k)))
            env=dict(line.split('=',1) for line in Path('.env').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
            for k in ('TRIAL_CREDIT_MINUTES','FREE_RECORDING_LIMIT'):
                print('ENV_'+k+'='+str(env.get(k,'<unset>')))
            database=Path('data/beonmeet.db')
            if database.exists():
                db=sqlite3.connect('file:'+str(database)+'?mode=ro',uri=True)
                rows=db.execute("SELECT name FROM sqlite_master WHERE name='credit_entries'").fetchone()
                if rows:
                    for kind,count,delta in db.execute('SELECT kind,COUNT(*),SUM(seconds_delta) FROM credit_entries GROUP BY kind'):
                        print('LEDGER_'+str(kind)+'_ROWS='+str(count)+'_NET_SECONDS='+str(delta))
                db.close()
            for port in (9124,9126):
                with urllib.request.urlopen('http://127.0.0.1:'+str(port)+'/capacity',timeout=10) as r: data=json.load(r)
                print('RECORDING_'+str(port)+'_ACTIVE='+str((data.get('data') or data).get('runningJobs')))
            PY
            for svc in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1;do
              echo "CAMCAM_STATUS=$svc:$(docker inspect -f '{{.State.Health.Status}}' "$svc")"
            done
