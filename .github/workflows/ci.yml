name: BeOnMeet change validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and regression tests
        run: |
          python3 -m py_compile app/main.py app/i18n.py app/hetzner_autoscaler.py app/autoscaler_smoke.py app/admin_panel.py app/billing_policy.py
          python3 tests/auto_calendar_test.py
          python3 tests/calendar_legacy_isolation_test.py
          python3 tests/auto_calendar_behavior_test.py
          python3 tests/premium_delivery_test.py
          python3 tests/i18n_test.py
          python3 tests/billing_tier_test.py
          python3 tests/billing_usage_behavior_test.py
          python3 tests/free_plan_limit_test.py
          python3 tests/public_oauth_pages_test.py
          python3 tests/recorder_end_guard_test.py
          python3 tests/admin_google_email_test.py
          python3 tests/admin_google_clay_test.py
          python3 tests/cloud_init_render_test.py

  production-readonly-capacity-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/ad-launch-tiered-billing-20261113'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live host capacity without changing services
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 2m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST; exit 1;; esac
            echo BEONMEET_READONLY_CAPACITY_AUDIT
            printf 'cpu_visible=%s\n' "$(nproc)"
            awk '/MemTotal:/ {printf "ram_total_gb=%.2f\n",$2/1048576} /MemAvailable:/ {printf "ram_available_gb=%.2f\n",$2/1048576}' /proc/meminfo
            df -Pk / | awk 'NR==2 {printf "disk_total_gb=%.2f disk_avail_gb=%.2f\n",$2/1048576,$4/1048576}'
            df -Pk /dev/shm | awk 'NR==2 {printf "shm_total_gb=%.2f shm_avail_gb=%.2f\n",$2/1048576,$4/1048576}'
            printf 'controller_service='
            systemctl is-active beonmeet-controller || true
            if [ -d /opt/beonmeet/.git ]; then
              printf 'deployed_git_head='
              git -C /opt/beonmeet rev-parse --short=12 HEAD
              printf 'deployed_git_branch='
              git -C /opt/beonmeet branch --show-current
            fi
            if [ -f /opt/beonmeet/.env ]; then
              python3 - <<'PY'
            from pathlib import Path
            wanted={'AUTOSCALE_ENABLED','BEONMEET_STAGING_NO_POLL','FREE_RECORDING_LIMIT','TRANSCRIPTION_CONCURRENCY'}
            d={}
            for line in Path('/opt/beonmeet/.env').read_text().splitlines():
                if '=' in line and not line.lstrip().startswith('#'):
                    k,v=line.split('=',1)
                    if k in wanted:d[k]=v
                    if k=='TELEGRAM_BOT_URL':d['TELEGRAM_BOT_URL_configured']=str(bool(v.strip()))
            for key in sorted(d):print(f'{key}={d[key]}')
            PY
            fi
            echo health_report_begin
            curl -fsS --max-time 12 http://127.0.0.1:8109/health | python3 -c '
            import sys,json
            d=json.load(sys.stdin)
            allowed=("max_concurrent_meetings","free_meeting_slots","premium_reserved_slots","healthy_free_workers","healthy_premium_workers","free_queue","premium_queue","autoscaler_enabled","transcription_concurrency","active_delivery_jobs","pending_delivery_jobs","database_backend","remote_workers","local_free_meeting_slots","local_premium_reserved_slots")
            for k in allowed:
                if k in d: print(f"{k}={d[k]}")
            '
            echo health_report_end
