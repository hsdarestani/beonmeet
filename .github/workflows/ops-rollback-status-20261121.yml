name: BeOnMeet controller status after STT rollback (read only)
on:
  push:
    branches: [ops/stt-controller-rollback-diagnostic-20261121]
    paths: [.github/workflows/ops-rollback-status-20261121.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read sanitized controller service and traceback
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,re,urllib.request,json
            from pathlib import Path
            def run(argv):
                p=subprocess.run(argv,capture_output=True,text=True,timeout=12)
                return p.returncode,(p.stdout+'\\n'+p.stderr).splitlines()
            code,unit=run(['systemctl','is-active','beonmeet-controller'])
            print('ROLLBACK_CONTROLLER_ACTIVE',code,' '.join(unit)[:110])
            code,unit=run(['systemctl','show','beonmeet-controller','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','ExecMainStatus'])
            print('ROLLBACK_CONTROLLER_UNIT',unit[:15])
            for url in ('http://127.0.0.1:8109/health','https://beonmeet.smarbiz.sbs/health'):
                try:
                    with urllib.request.urlopen(url,timeout=6) as resp:
                        h=json.load(resp)
                    print('ROLLBACK_ENDPOINT',url,'code',resp.status,'healthy',bool(h.get('ok')),
                          'queues',{k:h.get(k) for k in ('free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs')})
                except Exception as e:print('ROLLBACK_ENDPOINT_ERROR',url,type(e).__name__,str(e)[:110])
            path=Path('.env')
            if path.exists():
                vals={}
                for s in path.read_text().splitlines():
                    if '=' in s and not s.startswith('#'):
                        k,v=s.split('=',1)
                        if k in ('WHISPER_MODEL','RECOVERY_WHISPER_MODEL','WHISPER_CPU_THREADS','TRANSCRIPTION_CHUNK_SECONDS'):vals[k]=v
                print('ROLLBACK_STT_ENV',vals)
            code,logs=run(['journalctl','-u','beonmeet-controller','--since','6 minutes ago','--no-pager','-o','cat'])
            def clean(s):
                s=re.sub(r'https?://[^\\s]+','[URL]',s)
                s=re.sub(r'(?i)[\\w.+-]+@[\\w.-]+','[EMAIL]',s)
                s=re.sub(r'(?<![\\w])[0-9]{5,}(?![\\w])','[ID]',s)
                s=re.sub(r'(?i)(secret|token|key|password|bearer)[=: ]+[^,} ]+',r'\\1=[REDACTED]',s)
                return s[:260]
            terms=('traceback','importerror','modulenotfound','exception','failed to','error:','systemd','uvicorn','stopping','started','segfault','killed','started server','application startup','address already in use')
            matches=[clean(x) for x in logs if any(t in x.lower() for t in terms)]
            print('ROLLBACK_DIAGNOSTIC_LINES',len(matches))
            for l in matches[-90:]:print('ROLLBACK_LOG',l)
            for port in (9124,9126):
                try:
                    with urllib.request.urlopen(f'http://127.0.0.1:{port}/capacity',timeout=6) as r:h=json.load(r)
                    print('ROLLBACK_RECORDER',port,h.get('data') or h)
                except Exception as e:print('ROLLBACK_RECORDER_ERROR',port,type(e).__name__)
            print('ROLLBACK_DIAG_COMPLETED')
            PY
