name: One-time BeOnMeet divisible trial and join progress release

on:
  push:
    branches: [ops/deploy-trial-and-join-progress-20261121]
    paths:
      - .github/workflows/deploy-trial-progress-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Safely deploy controller-only with backup, idle guard and CamCam checks
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 7m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 60 9
            cd /opt/beonmeet
            release=a92c928f980c6720b0dc3f74a11c858afc905208
            baseline=f5386c5e4d54ddc24c14a1496218bf49c5ea3550
            git fetch -q origin main
            git merge-base --is-ancestor "$release" FETCH_HEAD
            stage=$(mktemp -d /opt/beonmeet/.stage-minute-credit.XXXXXXXX)
            for file in app/main.py app/i18n.py; do
              git show "$release:$file" > "$stage/$(basename "$file")"
              git show "$baseline:$file" > "$stage/old-$(basename "$file")"
              cmp -s "$file" "$stage/old-$(basename "$file")" || {
                echo UNEXPECTED_CURRENT_CONTROLLER_SOURCE; rm -rf "$stage"; exit 1;
              }
            done
            python3 -m py_compile "$stage/main.py" "$stage/i18n.py"
            grep -q 'if remaining > 0:' "$stage/main.py"
            grep -q 'join_progress_loop' "$stage/main.py"
            python3 - <<'PY'
            import json,subprocess,urllib.request,time
            from pathlib import Path
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=8) as r:h=json.load(r)
            assert h.get("ok") and int(h.get("max_concurrent_meetings") or 0)==5
            assert not h.get("autoscaler_enabled")
            for k in ("free_queue","premium_queue","active_delivery_jobs"):
                assert int(h.get(k) or 0)==0,k+" not idle"
            # Some Premium video files have already reached Telegram, but the
            # separate MP3/transcript still require durable recovery. Preserve
            # their on-disk source and state rather than silently deleting them.
            if int(h.get("pending_delivery_jobs") or 0):
                st=Path("/opt/beonmeet/data/state.json")
                assert st.is_file(), "Pending delivery without durable state file"
                saved=json.loads(st.read_text())
                pending=list((saved.get("pending_deliveries") or {}).values())
                assert len(pending)==int(h["pending_delivery_jobs"]),"Pending state/health mismatch"
                for item in pending:
                    assert isinstance(item,dict) and item.get("video_delivered"),"Undelivered video still pending"
                    p=Path(str(item.get("file_path") or item.get("source_path") or ""))
                    assert p.is_file() and p.stat().st_size>0,"Pending recovery source missing"
                print("PREVIOUS_VIDEO_DELIVERIES_DURABLY_PRESERVED",len(pending))
            for attempt in range(27):
                busy=[]
                for p in (9124,9126):
                    with urllib.request.urlopen("http://127.0.0.1:"+str(p)+"/capacity",timeout=8) as r:d=json.load(r)
                    busy.append(int((d.get("data") or d).get("runningJobs") or 0))
                if busy==[0,0]:break
                if attempt==26:raise AssertionError("Recorder still active; no service changes")
                time.sleep(8)
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","--format","{{.State.Health.Status}}",name],text=True).strip()=="healthy"
            print("MINUTE_CREDIT_RELEASE_PRECHECK_PASS")
            PY
            backup="/opt/beonmeet/.minute-credit-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 700 "$backup"
            cp -p app/main.py "$backup/main.py"
            cp -p app/i18n.py "$backup/i18n.py"
            cp -p .env "$backup/controller-env.before"
            if [ -s data/state.json ]; then cp -p data/state.json "$backup/state.before"; fi
            python3 - "$backup" <<'PY'
            import sqlite3,sys,os
            from pathlib import Path
            db=Path("/opt/beonmeet/data/beonmeet.db")
            if db.exists():
                src=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True)
                destpath=Path(sys.argv[1])/"wallet-db.before"
                dest=sqlite3.connect(str(destpath))
                src.backup(dest);dest.close();src.close()
                os.chmod(destpath,0o600)
            print("MINUTE_CREDIT_BACKUPS_COMPLETE")
            PY
            changed=0
            succeeded=0
            rollback() {
              if [ "$changed" = 1 ] && [ "$succeeded" != 1 ]; then
                echo RESTORE_PREVIOUS_CONTROLLER_VERSION
                cp -p "$backup/main.py" app/main.py
                cp -p "$backup/i18n.py" app/i18n.py
                systemctl restart beonmeet-controller || true
              fi
              rm -rf "$stage"
            }
            trap rollback EXIT
            changed=1
            install -m 644 "$stage/main.py" app/main.py
            install -m 644 "$stage/i18n.py" app/i18n.py
            systemctl restart beonmeet-controller
            ready=0
            for i in $(seq 1 25); do
              if curl -fsS --max-time 3 http://127.0.0.1:8109/health >/dev/null 2>&1; then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1 || { echo CONTROLLER_NOT_HEALTHY;exit 1; }
            cmp -s app/main.py "$stage/main.py"
            cmp -s app/i18n.py "$stage/i18n.py"
            curl -fsS --max-time 10 https://beonmeet.smarbiz.sbs/health >/dev/null
            for name in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy
            done
            succeeded=1
            trap - EXIT
            rm -rf "$stage"
            echo DIVISIBLE_FREE_MINUTES_AND_JOIN_STATUS_RELEASE_SUCCESS
            echo CAMCAM_HEALTHY_NO_WORKER_RESTART
