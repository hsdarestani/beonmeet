name: Guarded release modern Google Meet in-call recognition
on:
  push:
    branches: [ops/release-modern-meet-incall-20261121]
    paths: [.github/workflows/release-modern-incall-once.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Confirm idle, safely patch exact compiled worker, test CDP and CamCam
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 7m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST;exit 1;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 75 9
            cd /opt/beonmeet
            release=22ba69ffe770291954101efe8fec559beffb70bd
            git fetch -q origin main
            git merge-base --is-ancestor "$release" FETCH_HEAD
            worker=beonmeet-worker-five
            overlay=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}' "$worker")
            case "$overlay" in /opt/beonmeet/*) : ;; *) echo UNKNOWN_WORKER_OVERLAY;exit 1;; esac
            test -f "$overlay"
            grep -q GOOGLE_MEET_TRUSTED_JOIN_PATCH "$overlay"
            ! grep -q BEONMEET_MODERN_IN_CALL_PROOF_V1 "$overlay"
            stage=$(mktemp -d /opt/beonmeet/.modern-meet-stage.XXXXXXXX)
            git show "$release:patches/patch_modern_incall_proof.py" > "$stage/patch.py"
            python3 -m py_compile "$stage/patch.py"
            python3 "$stage/patch.py" "$overlay" "$stage/GoogleMeetBot.fixed.js"
            image=$(docker inspect -f '{{.Config.Image}}' "$worker")
            docker run --rm --network none --cpus=.4 --memory=250m --entrypoint node -v "$stage/GoogleMeetBot.fixed.js:/tmp/checked.js:ro" "$image" --check /tmp/checked.js
            echo MODERN_MEET_PATCH_MATCH_AND_NODE_SYNTAX_PASS
            python3 - <<'PY'
            import time,json,subprocess,urllib.request
            def idle():
                with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=6) as r:h=json.load(r)
                if not h.get("ok"):raise RuntimeError("Controller unhealthy")
                for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                    if int(h.get(k) or 0):return False
                for port in (9124,9126):
                    with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:d=json.load(r)
                    if int((d.get("data")or d).get("runningJobs") or 0):return False
                return True
            for n in range(30):
                if idle():break
                if n==29:raise RuntimeError("Customer job still active; no worker restart")
                time.sleep(6)
            for n in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","-f","{{.State.Health.Status}}",n],text=True).strip()=="healthy",n
            print("RECORDERS_IDLE_AND_CAMCAM_PRECHECK_GREEN")
            PY
            backup=$(mktemp -d /opt/beonmeet/.modern-meet-backup.XXXXXXXX)
            cp -p "$overlay" "$backup/GoogleMeetBot.before.js"
            test -s "$backup/GoogleMeetBot.before.js"
            modified=0
            complete=0
            cleanup(){
              if [ "$modified" = 1 ] && [ "$complete" = 0 ];then
                echo RESTORING_PREVIOUS_MEET_WORKER
                cat "$backup/GoogleMeetBot.before.js" > "$overlay"
                docker restart --time 20 "$worker" >/dev/null || true
              fi
              rm -rf "$stage"
            }
            trap cleanup EXIT
            python3 - <<'PY'
            import urllib.request,json
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=5) as r:d=json.load(r)
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(d.get(k) or 0)==0,"Controller became busy"
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as r:d=json.load(r)
                assert int((d.get("data")or d).get("runningJobs") or 0)==0,"Recorder became busy"
            print("IMMEDIATE_PRE_CHANGE_IDLE_RECHECK_PASS")
            PY
            modified=1
            cat "$stage/GoogleMeetBot.fixed.js" > "$overlay"
            docker restart --time 20 "$worker" >/dev/null
            ready=0
            for i in $(seq 1 23);do
              if curl -fsS --max-time 3 http://127.0.0.1:9126/capacity >/dev/null 2>&1;then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1
            docker exec "$worker" node --check /usr/src/app/dist/bots/GoogleMeetBot.js
            docker exec "$worker" grep -q BEONMEET_MODERN_IN_CALL_PROOF_V1 /usr/src/app/dist/bots/GoogleMeetBot.js
            cmp -s "$overlay" "$stage/GoogleMeetBot.fixed.js"
            echo MODERN_MEET_PROOF_PRODUCTION_INSTALLED
            docker exec "$worker" node -e '
              (async()=>{
                const {chromium}=require("playwright-extra");
                const timeout=setTimeout(()=>process.exit(4),14500);
                try{
                  const b=await chromium.connectOverCDP(process.env.GOOGLE_CHROME_CDP_URL,{timeout:10000});
                  const c=b.contexts()[0];
                  if(!c)process.exit(5);
                  const cookies=await c.cookies("https://accounts.google.com");
                  const keys=new Set(cookies.map(x=>x.name));
                  if(!keys.has("SID")||!keys.has("SAPISID"))process.exit(6);
                  clearTimeout(timeout);
                  console.log("AUTHENTICATED_GOOGLE_CHROME_STILL_CONNECTED");
                  process.exit(0);
                }catch(e){clearTimeout(timeout);process.exit(7)}
              })();
            '
            curl -fsS --max-time 8 https://beonmeet.smarbiz.sbs/health >/dev/null
            for n in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1;do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$n")" = healthy
            done
            complete=1
            trap - EXIT
            rm -rf "$stage"
            echo MODERN_MEET_INCALL_PATCH_DEPLOY_SUCCESS
            echo CUSTOMER_RECORDINGS_NOT_INTERRUPTED
            echo CAMCAM_UNCHANGED
