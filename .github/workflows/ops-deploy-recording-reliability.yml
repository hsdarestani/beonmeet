name: Validate and deploy BeOnMeet recording reliability
on:
  push:
    branches: [fix/production-reliability-20261128]
    paths: [.github/workflows/ops-deploy-recording-reliability.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beonmeet-shared-controller
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for A/V handoff regression
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Validate controller, auth and media recovery
        run: |
          python3 -m py_compile app/main.py app/admin_panel.py scripts/deploy_recording_reliability.py scripts/worker_auth_monitor.py
          node --check scripts/probe_recorder_auth.js
          python3 tests/worker_auth_monitor_timing_test.py
          python3 tests/worker_auth_guard_test.py
          python3 tests/five_isolated_workers_dispatch_test.py
          python3 tests/shared_chrome_admission_gate_test.py
          python3 tests/concurrent_handoff_test.py
          python3 tests/concurrent_credit_reservation_test.py
          python3 tests/compiled_uploader_handoff_test.py
          python3 tests/recording_finalization_overlay_test.py
      - name: Stage the merged production source and deploy when all recorders are idle
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.PASS }}
          timeout: 25s
          command_timeout: 7m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            cd /opt/beonmeet
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 150 9
            release=${{ github.sha }}
            git fetch -q origin "$release" e6d408949c59066ced7ed5219ef16aa6013185ff
            script=$(mktemp)
            trap 'rm -f "$script"' EXIT
            git show "$release:scripts/deploy_recording_reliability.py" > "$script"
            python3 "$script" "$release"
            flock -u 9
            systemctl start beonmeet-auth-watch.service
            python3 - <<'PY'
            import json
            from pathlib import Path
            from urllib.request import urlopen

            readiness = json.loads(Path('/opt/beonmeet/data/worker-auth-readiness.json').read_text())
            for lane, row in enumerate(readiness['workers'].values(), 1):
                print('PROD_LANE', lane, row.get('status'), row.get('reason'), row.get('last_verified_at'))
            with urlopen('http://127.0.0.1:8109/health', timeout=8) as response:
                health = json.load(response)
            keys = ('ok', 'healthy_free_workers', 'authenticated_free_workers',
                    'active_recording_jobs', 'pending_delivery_jobs', 'failed_delivery_jobs')
            print('PROD_RELIABILITY_HEALTH', {key: health.get(key) for key in keys})
            assert health['ok'] and health['healthy_free_workers'] == 5
            assert health['auth_guard_enabled']
            PY
