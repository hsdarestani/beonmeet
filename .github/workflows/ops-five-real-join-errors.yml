name: Five real Meet workers — sanitized live join diagnosis (read-only)
on:
  push:
    branches: [feat/five-isolated-local-recorders-20261122]
    paths: [.github/workflows/ops-five-real-join-errors.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Classify per-worker join errors without revealing URLs, tokens, names, messages
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.PASS }}
          timeout: 20s
          command_timeout: 2m
          script: |
            python3 - <<'PY'
            import subprocess,re,collections,datetime
            print('FIVE_JOIN_DIAGNOSTIC_TIME',datetime.datetime.now(datetime.timezone.utc).isoformat())
            pattern={
              'JOIN_START':r'starting.*meet|joining.*meet|join.*meeting|join request',
              'RECORDING_STARTED':r'recording.start|recording started|started recording',
              'RECORDING_STOPPED':r'recording.stop|recording stopped',
              'HOST_ADMISSION':r'ask to join|waiting.for.admission|waiting to join|not accepted',
              'PREJOIN_UI':r'pre.join|prejoin|join now|ask to join',
              'GOOGLE_AUTH':r'auth|login|sign.in|signin',
              'NO_GOOGLE_MEET_UI':r'not.*meet|cannot find.*button|waiting.*button|timeout.*join|join.*timeout',
              'BROWSER_ERROR':r'target closed|browser closed|cdp|disconnected|page crash',
              'ERROR':r'error|exception|failed',
              'EXIT':r'leaving.*meet|exiting.*meet|meeting ended'
            }
            for i in range(2,7):
              name=f'beonmeet-qa-five-worker-{i}'
              p=subprocess.run(['docker','logs','--since','10m',name],capture_output=True,text=True,timeout=12)
              if p.returncode!=0:
                print('FIVE_JOIN_LOG_STATUS',i,'not_found')
                continue
              lines=(p.stdout+'\\n'+p.stderr).splitlines()
              counts={k:sum(bool(re.search(v,l,re.I)) for l in lines) for k,v in pattern.items()}
              print('FIVE_JOIN_LOG_CLASSIFICATIONS',i,'log_lines',len(lines),counts)
            PY
