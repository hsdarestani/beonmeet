name: Verify five direct Meet prejoin pages without altering Google sign-in
on:
  push:
    branches: [fix/meet-direct-url-diagnostic-20261122]
    paths: [.github/workflows/qa-restore-five-google-sessions.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate direct-room QA script
        run: node --check tests/qa_all_five_direct_meet_room_preflight.js
      - name: Preflight five Chrome Meet test rooms with zero credential mutations
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.PASS }}
          timeout: 20s
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/beonmeet
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 100 9
            python3 - <<'PY'
            import urllib.request,json,subprocess
            from pathlib import Path
            assert Path('.five-isolated-runtime/qa_meet_links.json').is_file()
            def j(url):
                with urllib.request.urlopen(url,timeout=8) as r:return json.load(r)
            h=j('http://127.0.0.1:8109/health')
            assert h.get('ok')
            assert all(int(h.get(k) or 0)==0 for k in ('free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs'))
            for port in (9126,9132,9133,9134,9135):
                d=j('http://127.0.0.1:%d/capacity'%port);d=d.get('data') or d
                assert int(d.get('runningJobs') or 0)==0
            for name in ('camcam-shared-api-1','camcam-shared-pet-1','camcam-shared-archive-1','camcam-shared-petarchive-1'):
                assert subprocess.check_output(['docker','inspect','-f','{{.State.Health.Status}}',name],text=True).strip()=='healthy'
            print('FIVE_MEET_DIRECT_PREFLIGHT_HEALTHY_AND_IDLE')
            PY
            git fetch -q origin fix/meet-direct-url-diagnostic-20261122
            script=$(mktemp /tmp/qa-direct-five.XXXXXXXX.js)
            trap 'rm -f "$script"' EXIT
            git show "${{ github.sha }}:tests/qa_all_five_direct_meet_room_preflight.js" > "$script"
            chmod 644 "$script"
            docker run --rm --user 0 --network beonmeet-single --memory=550m --cpus=.5 --pids-limit=160 \
              -e NODE_PATH=/usr/src/app/node_modules \
              -v "$script:/qa-test.js:ro" \
              -v "/opt/beonmeet/.five-isolated-runtime/qa_meet_links.json:/qa-existing-links.json:ro" \
              --entrypoint node beonmeet-worker-audiofix:latest /qa-test.js
            echo FIVE_MEET_DIRECT_PREFLIGHT_COMPLETE_NO_SIGNIN_CHANGE

# Latest direct-room canary includes per-lane transient navigation retries.
