name: One-time release verified recorder upload acknowledgements

on:
  push:
    branches: [ops/guarded-recorder-ack-release-20261121]
    paths:
      - .github/workflows/guarded-recording-ack-release.yml

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy only reviewed controller logic with live idle and rollback checks
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST; exit 1 ;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 80 9
            cd /opt/beonmeet
            test -s .env && test -s app/main.py && test -s data/beonmeet.db
            test "$(readlink -f /recordings)" = /dev/shm/beonmeet
            test "$(stat -c '%u:%g:%a' /dev/shm/beonmeet)" = "1001:987:2770"
            python3 - <<'PY'
            import json,subprocess,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=8) as r:h=json.load(r)
            assert h.get("ok")
            assert int(h.get("max_concurrent_meetings") or 0)==5,"Unexpected recording topology"
            assert not h.get("autoscaler_enabled")
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0,k+" not idle"
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=8) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0,"Worker busy"
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","--format","{{.State.Health.Status}}",name],text=True).strip()=="healthy",name
            print("IDLE_AND_CAMCAM_PRECHECK_PASS")
            PY
            git fetch -q origin main
            release=883c48da261d1f037b51124a6938f3bfe5c75e12
            git merge-base --is-ancestor "$release" FETCH_HEAD
            stage=$(mktemp /opt/beonmeet/.stage-recording-ack-XXXXXXXX.py)
            git show "$release:app/main.py" > "$stage"
            python3 -m py_compile "$stage"
            source_ok=0
            for baseline in 247433c3701a28ae14fedd577836716494726e02 3e2cfab224b2590215de0349ffccf789798627f8 b22c372e9741c38edc27f228cadf298d6147d21a; do
              if cmp -s app/main.py <(git show "$baseline:app/main.py"); then
                source_ok=1
                echo REVIEWED_LIVE_BASELINE_MATCH
                break
              fi
            done
            if cmp -s app/main.py "$stage"; then
              rm -f "$stage"
              echo REVIEWED_RELEASE_ALREADY_INSTALLED
              exit 0
            fi
            test "$source_ok" = 1 || { echo UNSUPPORTED_LIVE_SOURCE_DO_NOT_OVERWRITE; rm -f "$stage"; exit 1; }
            backup="/opt/beonmeet/.recording-ack-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 700 "$backup"
            cp -p app/main.py "$backup/main.py.before"
            cp -p .env "$backup/env.before"
            if [ -s data/state.json ]; then cp -p data/state.json "$backup/state.before"; fi
            python3 - "$backup" <<'PY'
            import os,sqlite3,sys
            from pathlib import Path
            db=Path("/opt/beonmeet/data/beonmeet.db")
            source=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True)
            target=Path(sys.argv[1])/"db.before"
            dest=sqlite3.connect(str(target))
            source.backup(dest)
            dest.close();source.close()
            os.chmod(target,0o600)
            print("BACKUPS_COMPLETE")
            PY
            changed=0
            complete=0
            rollback() {
              if [ "$changed" = 1 ] && [ "$complete" = 0 ]; then
                echo RESTORE_PREVIOUS_CONTROLLER_CODE
                cp -p "$backup/main.py.before" app/main.py
                systemctl restart beonmeet-controller || true
              fi
              rm -f "$stage"
            }
            trap rollback EXIT
            # The worker and queue must remain idle immediately before the restart.
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=8) as r:h=json.load(r)
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0,k
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=8) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0
            PY
            changed=1
            install -m 644 "$stage" app/main.py
            systemctl restart beonmeet-controller
            ready=0
            for i in $(seq 1 25); do
              if curl -fsS --max-time 3 http://127.0.0.1:8109/health >/dev/null 2>&1; then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1 || { echo CONTROLLER_HEALTH_FAILED; exit 1; }
            test "$(readlink -f /recordings)" = /dev/shm/beonmeet
            grep -q 'Recording source missing: no verified delivery receipt' app/main.py
            curl -fsS --max-time 8 https://beonmeet.smarbiz.sbs/health >/dev/null
            python3 - <<'PY'
            import json,subprocess,urllib.request,urllib.error,uuid
            from pathlib import Path
            pid=subprocess.check_output(["systemctl","show","-p","MainPID","--value","beonmeet-controller"],text=True).strip()
            entries=[e.split(b"=",1) for e in Path("/proc/"+pid+"/environ").read_bytes().split(b"\\x00") if b"=" in e]
            env={k.decode():v.decode() for k,v in entries}
            token=env.get("INTERNAL_SECRET")
            assert token, "Controller must have an internal secret"
            uid=uuid.uuid4().hex
            missing="/recordings/.missing-recorder-probe-"+uid+".webm"
            assert not Path(missing).exists()
            payload={"userId":"diagnostic-only","botId":"diagnostic-"+uid,"filename":"missing.webm","filePath":missing}
            request=urllib.request.Request("http://127.0.0.1:8109/internal/recording-ready",
                 data=json.dumps(payload).encode(),headers={"content-type":"application/json","x-beonmeet-secret":token},method="POST")
            try:
                urllib.request.urlopen(request,timeout=12)
            except urllib.error.HTTPError as error:
                assert error.code==404, "Missing recorder source must receive 404"
                print("NO_FALSE_200_FOR_MISSING_FILE_PASS")
            else:
                raise AssertionError("Dangerous: missing recording got false 200")
            PY
            for name in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$name")" = healthy
            done
            complete=1
            trap - EXIT
            rm -f "$stage"
            echo BEONMEET_RECORDED_DELIVERY_ACK_FIX_DEPLOY_SUCCESS
            echo CAMCAM_HEALTHY_NO_OTHER_SERVICE_RESTART
