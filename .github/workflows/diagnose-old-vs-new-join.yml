name: Read-only compare original BeOnMeet profile against new recorder
on:
  push:
    branches: [ops/read-only-historical-join-regression-20261121]
    paths: [.github/workflows/diagnose-old-vs-new-join.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only Chrome profile and historical join diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,subprocess,shlex,re
            name="beonmeet-chrome-single"
            p=subprocess.run(["docker","inspect","-f","{{json .Config.Entrypoint}}|{{json .Config.Cmd}}",name],capture_output=True,text=True,timeout=8)
            if p.returncode!=0:raise RuntimeError("Chrome container unavailable")
            entry,cmd=p.stdout.strip().split("|",1)
            e=json.loads(entry) or []
            c=json.loads(cmd) or []
            print("CHROME_LAUNCH_EXEC_BASENAMES",[str(x).split("/")[-1] for x in e])
            print("CHROME_CMD_BASENAMES",[str(x).split("/")[-1] for x in c if x and not str(x).startswith("-")])
            p=subprocess.run(["docker","exec",name,"ps","-e","-o","args="],capture_output=True,text=True,timeout=10)
            lines=p.stdout.splitlines()
            chrome=[x for x in lines if "--remote-debugging-port" in x and ("chrome" in x or "chromium" in x)]
            dirs=[]
            for line in chrome[:8]:
                m=re.search(r"--user-data-dir(?:=|\s+)(\S+)",line)
                dirs.append({"present":bool(m),"matches_persisted_mount":bool(m and m.group(1).strip("'\"")=="/tmp/chrome-profile")})
            print("LIVE_CHROME_PROFILE_FLAGS",json.dumps(dirs))
            entrypaths=[x for x in e+c if isinstance(x,str) and x.startswith("/") and x.endswith((".sh",".py"))]
            for script in entrypaths:
                p=subprocess.run(["docker","exec",name,"sh","-c","test -r \"$1\" && cat \"$1\"","-",script],capture_output=True,text=True,timeout=8)
                if p.returncode:continue
                lower=p.stdout.lower()
                print("STARTUP_SCRIPT_PROFILE_BEHAVIOR",json.dumps({"basename":script.rsplit("/",1)[-1],"wipes_user_data_dir":any(x in lower for x in ("rm -rf /tmp/chrome-profile","rm -rf \"$chrome_profile\"","rm -rf \"$user_data_dir\"","rm -rf $chrome_profile")),"uses_mktemp":("mktemp" in lower),"mentions_persisted_profile":("/tmp/chrome-profile" in lower)}))
            print("CHROME_PROFILE_LAUNCH_PATH_AUDIT_DONE")
            PY
