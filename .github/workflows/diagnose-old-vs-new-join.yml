name: Read-only compare original BeOnMeet profile against new recorder
on:
  push:
    branches: [ops/read-only-historical-join-regression-20261121]
    paths: [.github/workflows/diagnose-old-vs-new-join.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only Chrome profile and historical join diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,os,stat,subprocess,datetime
            from pathlib import Path
            print("PROFILE_AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            p=subprocess.run(["docker","inspect","-f","{{json .Mounts}}","beonmeet-chrome-single"],capture_output=True,text=True,timeout=8)
            assert p.returncode==0
            mounts=json.loads(p.stdout)
            m=next(x for x in mounts if x.get("Destination")=="/tmp/chrome-profile")
            source=Path(m["Source"])
            print("CHROME_PROFILE_MOUNT",json.dumps({"bind_type":m.get("Type"),"read_write":m.get("RW"),"host_path_under_tmp":str(source).startswith("/tmp/"),"host_path_under_beonmeet":str(source).startswith("/opt/beonmeet/"),"host_source_exists":source.is_dir()}))
            for item in (source,source/"Default",source/"Default"/"Network",source/"Default"/"Network"/"Cookies",source/"Default"/"Cookies",source/"Local State",source/"Default"/"Preferences"):
                if item.exists():
                    st=item.stat()
                    age_hr=(datetime.datetime.now(datetime.timezone.utc).timestamp()-st.st_mtime)/3600
                    print("PROFILE_PATH_METADATA",json.dumps({"basename":item.name,"is_directory":item.is_dir(),"size_bytes":st.st_size if item.is_file() else None,"mtime_hours_ago":round(age_hr,2),"mode":oct(stat.S_IMODE(st.st_mode))}))
            p=subprocess.run(["docker","inspect","-f","{{json .Config.Cmd}}","beonmeet-chrome-single"],capture_output=True,text=True,timeout=8)
            cmds=json.loads(p.stdout) if p.returncode==0 else []
            flags=[x.split("=",1)[0] for x in cmds if isinstance(x,str) and x.startswith("--")]
            print("CHROME_STARTUP_FLAG_NAMES",flags[:40])
            p=subprocess.run(["docker","inspect","-f","{{json .Config.Env}}","beonmeet-chrome-single"],capture_output=True,text=True,timeout=8)
            env=json.loads(p.stdout) if p.returncode==0 else []
            keys=[v.split("=",1)[0] for v in env if "=" in v]
            print("CHROME_PROFILE_ENV_KEY_PRESENCE",json.dumps({k:k in keys for k in ("CHROME_USER_DATA_DIR","CHROME_PROFILE_DIR","CHROME_URL","GOOGLE_EMAIL","GOOGLE_PASSWORD","CHROME_REMOTE_DEBUGGING_PORT")}))
            print("PROFILE_METADATA_AUDIT_COMPLETE")
            PY
