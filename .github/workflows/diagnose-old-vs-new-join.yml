name: Read-only compare original BeOnMeet profile against new recorder
on:
  push:
    branches: [ops/read-only-historical-join-regression-20261121]
    paths: [.github/workflows/diagnose-old-vs-new-join.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only Chrome profile and historical join diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,hashlib,os,json
            container="beonmeet-chrome-single"
            p=subprocess.run(["docker","exec",container,"sh","-c","command -v start-chrome-cdp"],capture_output=True,text=True,timeout=7)
            print("START_CHROME_SCRIPT_FOUND",p.returncode==0)
            if p.returncode!=0:raise SystemExit(0)
            name=p.stdout.strip()
            p=subprocess.run(["docker","exec",container,"cat",name],capture_output=True,text=True,timeout=8)
            assert p.returncode==0
            text=p.stdout.lower()
            checks={
              "clears_profile_with_rm":("rm -rf" in text and ("chrome-profile" in text or "user-data-dir" in text)),
              "replaces_profile_with_mktemp":("mktemp" in text and ("chrome-profile" in text or "user-data-dir" in text)),
              "uses_chrome_profile_path":"--user-data-dir" in text,
              "incognito_flag":"--incognito" in text,
              "guest_flag":"--guest" in text,
              "headless_flag":"--headless" in text,
              "disables_auth_cookies":"--disable-features=accountconsistency" in text,
              "persistent_cookie_cleanup":"cookies" in text and ("rm " in text or "truncate" in text),
            }
            print("CHROME_STARTUP_BEHAVIOR",json.dumps(checks))
            print("STARTUP_PROFILE_AUDIT_COMPLETE")
            PY
