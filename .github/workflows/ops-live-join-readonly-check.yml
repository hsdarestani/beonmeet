name: Live BeOnMeet join/admission safety verification
on:
  push:
    branches: [ops/live-join-readonly-check-20261121]
    paths: [.github/workflows/ops-live-join-readonly-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect running controller and Google Meet worker (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 3m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1;; esac
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,urllib.request,subprocess,re
            from pathlib import Path
            def get(url):
                with urllib.request.urlopen(url,timeout=8) as r:return json.load(r)
            h=get('http://127.0.0.1:8109/health')
            assert h.get('ok') is True, 'controller health failed'
            print('CONTROLLER_HEALTH_OK',True)
            print('CONTROLLER_QUEUE_COUNTS',{key:int(h.get(key) or 0) for key in ('free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs')})
            for port in (9124,9126):
                c=get(f'http://127.0.0.1:{port}/capacity')
                d=c.get('data') or c
                print('WORKER_CAPACITY',port,{k:d.get(k) for k in ('runningJobs','maxConcurrentJobs','availableSlots')})
            live=Path('app/main.py').read_text(encoding='utf8')
            checks={'controller_shared_chrome_guard':'SHARED_CHROME_MAX_ACTIVE' in live and '_dispatch_meeting_serialized' in live,
                    'waiting_callback':'/internal/waiting-for-admission' in live,
                    'recording_started_callback':'/internal/recording-started' in live,
                    'progress_loop':'async def join_progress_loop' in live}
            worker='beonmeet-worker-five'
            found=subprocess.check_output(['docker','inspect','-f','{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}',worker],text=True).strip()
            assert found.startswith('/opt/beonmeet/'), 'worker overlay path not recognized'
            overlay=Path(found).read_text(encoding='utf8')
            checks.update({'trusted_join_playwright_patch':'GOOGLE_MEET_TRUSTED_JOIN_PATCH' in overlay,
                           'strict_incall_proof_patch':'BEONMEET_MODERN_IN_CALL_PROOF_V1' in overlay})
            print('JOIN_CODE_MARKERS',json.dumps(checks))
            assert all(checks.values()), 'missing live join fix'
            service=subprocess.run(['systemctl','is-active','beonmeet-controller'],text=True,capture_output=True,timeout=5)
            print('CONTROLLER_SYSTEMD_ACTIVE',service.stdout.strip()=='active')
            assert service.stdout.strip()=='active'
            for name in ('camcam-shared-api-1','camcam-shared-pet-1','camcam-shared-archive-1','camcam-shared-petarchive-1'):
                p=subprocess.run(['docker','inspect','-f','{{.State.Health.Status}}',name],capture_output=True,text=True,timeout=5)
                print('CAMCAM_HEALTH',name,p.stdout.strip())
                assert p.stdout.strip()=='healthy'
            for origin,cmd in [('controller',['journalctl','-u','beonmeet-controller','--since','2026-11-21 16:58:00 UTC','--no-pager','-o','cat']),('recorder',['docker','logs','--since','2026-11-21T16:58:00Z',worker])]:
                p=subprocess.run(cmd,capture_output=True,text=True,timeout=12)
                raw=(p.stdout+'\n'+p.stderr)[-200000:]
                patterns={'target_crashed':r'target crashed',
                          'cdp_disconnect':r'ECONNREFUSED|WebSocket.*closed',
                          'join_timeout':r'prejoin.*timeout|waiting.*timeout',
                          'callback_failure':r'(recording-started|waiting-for-admission).*?(40[013]|50[0123])',
                          'uncaught':r'unhandledrejection|uncaughtexception'}
                print('RECENT_ERROR_COUNTS',origin,{k:len(re.findall(v,raw,re.I)) for k,v in patterns.items()})
            print('READONLY_JOIN_RUNTIME_VERIFICATION_PASS')
            PY
            docker exec beonmeet-worker-five node -e '
              (async()=>{
                let timer=setTimeout(()=>process.exit(19),15500);
                try{
                  const {chromium}=require("playwright-extra");
                  const browser=await chromium.connectOverCDP(process.env.GOOGLE_CHROME_CDP_URL,{timeout:10000});
                  const contexts=browser.contexts();
                  if(!contexts.length)process.exit(5);
                  const cookies=await contexts[0].cookies("https://accounts.google.com");
                  const names=new Set(cookies.map(c=>c.name));
                  const authenticated=names.has("SID")&&names.has("SAPISID");
                  console.log("GOOGLE_CHROME_AUTH_COOKIE_MARKERS",authenticated);
                  console.log("CHROME_CONTEXTS",contexts.length);
                  console.log("MEET_OPEN_TABS",contexts.flatMap(c=>c.pages()).filter(p=>p.url().startsWith("https://meet.google.com/")).length);
                  clearTimeout(timer);
                  process.exit(authenticated?0:6);
                }catch(e){console.log("GOOGLE_CHROME_READ_ONLY_CHECK_FAILED",e.name);clearTimeout(timer);process.exit(7);}
              })();'
            curl -fsS --max-time 8 https://beonmeet.smarbiz.sbs/health >/dev/null
            python3 - <<'PY'
            import subprocess,re,json,datetime
            from pathlib import Path
            now=datetime.datetime.now(datetime.timezone.utc)
            print("JOIN_TRIAGE_TIME_UTC",now.isoformat())
            terms=re.compile(r'join|leave|left|inactiv|alone|participant|meeting.*end|end.*meeting|record|capture|duration|timeout|error|fail|disconnect|admission|page.*clos|browser|websocket|session|stop|terminate|mute',re.I)
            def redact(s):
                s=re.sub(r'https?://[^\\s]+','[URL]',s)
                s=re.sub(r'(?i)[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}','[EMAIL]',s)
                s=re.sub(r'(?i)(bearer|token|secret|password|authorization)[=: ]+[^,} \\t]+',r'\\1=[REDACTED]',s)
                s=re.sub(r'(?<![a-z0-9])[0-9]{7,}(?![a-z0-9])','[ID]',s)
                s=re.sub(r'(?i)(userId|chat_id|eventId|botId|meetingId|calendarId|meetingCode)["\\s:=-]+[^,} ]+',r'\\1=[REDACTED]',s)
                return s[:420]
            sources=[('recorder', ['docker','logs','--since','40m','beonmeet-worker-five']),
                     ('controller',['journalctl','-u','beonmeet-controller','--since','40 minutes ago','--no-pager','-o','short-iso'])]
            for name,cmd in sources:
                p=subprocess.run(cmd,capture_output=True,text=True,timeout=15)
                lines=(p.stdout+'\\n'+p.stderr).splitlines()
                relevant=[redact(l) for l in lines if terms.search(l)]
                print("JOIN_TRIAGE_LOG",name,"total_lines",len(lines),"relevant_lines",len(relevant),"return_code",p.returncode)
                for line in relevant[-85:]:print("EVENT",name,line)
            for base in ('/opt/beonmeet/data/state.json','/opt/beonmeet/controller_state/state.json'):
                fp=Path(base)
                if not fp.is_file():continue
                try:
                    st=json.loads(fp.read_text())
                    launched=st.get('launched_events') or {}
                    recent=sorted((v for v in launched.values() if isinstance(v,dict)),key=lambda x:x.get('launched_at',''),reverse=True)[:8]
                    for i,v in enumerate(recent):
                        print("LAST_LAUNCH",i,{k:v.get(k) for k in ('status','launched_at','recording_started_at','waiting_since','error') if k in v})
                    print("LAUNCHED_COUNT",len(launched))
                except Exception as e:print("STATE_SUMMARY_ERROR",type(e).__name__)
                break
            p=subprocess.run(['docker','inspect','beonmeet-worker-five'],capture_output=True,text=True,timeout=7)
            if p.returncode==0:
                x=json.loads(p.stdout)[0]
                env=x.get('Config',{}).get('Env') or []
                for prefix in ('LONE_PARTICIPANT_EXIT_DELAY_SECONDS=','MEETING_INACTIVITY_MINUTES=','INACTIVITY_DETECTION_START_DELAY_MINUTES=','JOIN_WAIT_TIME_MINUTES=','MAX_RECORDING_DURATION_MINUTES='):
                    vals=[v for v in env if v.startswith(prefix)]
                    print("WORKER_DURATION_SETTING",vals[0] if vals else prefix+'<unset>')
            print("JOIN_TRIAGE_READ_ONLY_COMPLETE")
            PY
            python3 - <<'PY'
            from pathlib import Path
            import subprocess
            container='beonmeet-worker-five'
            path=subprocess.check_output(['docker','inspect','-f','{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}',container],text=True).strip()
            lines=Path(path).read_text().splitlines()
            print('JOIN_COMPILED_FILE_LINES',len(lines))
            patterns=['External browser page closed in join finally','Begin recording...','finally {','Closing the browser on error','this.page.close','await this.page.close','recordMeeting','isJoining','startRecording']
            hits=[(i,p) for i,l in enumerate(lines) for p in patterns if p in l]
            print('JOIN_COMPILED_HITS',[(i+1,p) for i,p in hits][-60:])
            anchors=[i for i,p in hits if p in ('External browser page closed in join finally','Begin recording...')]
            selected=set()
            for i in anchors:
                selected.update(range(max(0,i-105),min(len(lines),i+120)))
            for i in sorted(selected):
                ln=lines[i]
                if any(key in ln.lower() for key in ('authorization','apikey','password','secret','bearer','token=')):ln='[REDACTED]'
                print('JOIN_COMPILED_CODE',i+1,ln[:360])
            PY
            python3 - <<'PY'
            import subprocess
            from pathlib import Path
            path=subprocess.check_output(['docker','inspect','-f','{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}','beonmeet-worker-five'],text=True).strip()
            lines=Path(path).read_text().splitlines()
            for a,b in [(830,950),(1200,1338)]:
                print('RECORD_FLOW_REGION',a,b)
                for i in range(a-1,min(b,len(lines))):
                    line=lines[i]
                    if any(q in line.lower() for q in ('authorization','apikey','password','secret','bearer','token=')):line='[REDACTED]'
                    print('RECORD_FLOW_LINE',i+1,line[:450])
            PY
            python3 - <<'PY'
            import subprocess,re
            from pathlib import Path
            path=subprocess.check_output(['docker','inspect','-f','{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}','beonmeet-worker-five'],text=True).strip()
            lines=Path(path).read_text().splitlines()
            print('EVALUATE_SIGNATURE',lines[763].strip())
            print('EVALUATE_ARGS_KEYS',[(i+1,lines[i].strip()) for i in range(1303,1314) if not any(x in lines[i].lower() for x in ('secret','token','password','bearer'))])
            p=subprocess.run(['docker','logs','--since','25m','beonmeet-worker-five'],text=True,capture_output=True,timeout=10)
            for pat in ('process is not defined','ReferenceError','page.evaluate','error recording','recording failed','MediaRecorder actual mime type','Waiting for recording duration','recording-start'):
                hits=[re.sub(r'https?://[^\\s]+','[URL]',x)[:250] for x in (p.stdout+'\\n'+p.stderr).splitlines() if pat.lower() in x.lower()]
                print('RECORDER_LOG_PHRASE',pat,'COUNT',len(hits))
                if hits and pat.lower() in ('process is not defined','referenceerror'):print('RECORDER_LOG_SAMPLE',hits[-1])
            print('CAPTURE_ENV_VALUES',subprocess.run(['docker','exec','beonmeet-worker-five','sh','-c','printf "%s" "${BEONMEET_CAPTURE_QUALITY:-UNSET}"'],text=True,capture_output=True,timeout=6).stdout.strip()[:32])
            PY
            echo LIVE_BEONMEET_LOGIN_READ_ONLY_SMOKE_PASS

# Recovery rollout observation: read-only service and queue snapshot.
