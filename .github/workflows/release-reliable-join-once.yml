name: One-time guarded BeOnMeet real-join reliability rollout

on:
  push:
    branches: [ops/release-reliable-join-and-admission-20261121]
    paths:
      - .github/workflows/release-reliable-join-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Stage tested controller and compiled recorder patch, release only while idle
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 8m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST; exit 1;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 60 9
            cd /opt/beonmeet
            test -s .env && test -s app/main.py && test -s app/i18n.py
            test "$(readlink -f /recordings)" = /dev/shm/beonmeet
            main_release=f5386c5e4d54ddc24c14a1496218bf49c5ea3550
            baseline=883c48da261d1f037b51124a6938f3bfe5c75e12
            git fetch -q origin main
            git merge-base --is-ancestor "$main_release" FETCH_HEAD || { echo REVIEWED_PATCH_NOT_ON_MAIN; exit 1; }
            stage=$(mktemp -d /opt/beonmeet/.stage-join-fix.XXXXXXXX)
            for file in app/main.py app/i18n.py patches/patch_live_admission_notice.py; do
              git show "$main_release:$file" > "$stage/$(basename "$file")"
            done
            for file in app/main.py app/i18n.py; do
              git show "$baseline:$file" > "$stage/before-$(basename "$file")"
              cmp -s "$file" "$stage/before-$(basename "$file")" || {
                echo UNEXPECTED_LIVE_SOURCE_NOT_PATCHING; rm -rf "$stage"; exit 1;
              }
            done
            .venv/bin/python -m py_compile "$stage/main.py" "$stage/i18n.py" "$stage/patch_live_admission_notice.py"
            worker=beonmeet-worker-five
            overlay=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}' "$worker")
            case "$overlay" in /opt/beonmeet/*) : ;; *) echo UNKNOWN_COMPILED_WORKER_MOUNT; rm -rf "$stage"; exit 1 ;; esac
            test -f "$overlay" && test ! -L "$overlay"
            .venv/bin/python "$stage/patch_live_admission_notice.py" "$overlay" "$stage/GoogleMeetBot.patched.js"
            worker_image=$(docker inspect -f '{{.Config.Image}}' "$worker")
            docker run --rm --network none --memory=300m --cpus=.3 -v "$stage/GoogleMeetBot.patched.js:/tmp/worker.js:ro" --entrypoint node "$worker_image" --check /tmp/worker.js
            echo SOURCE_AND_COMPILED_NODE_SYNTAX_PASS
            python3 - <<'PY'
            import json,subprocess,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=8) as r:h=json.load(r)
            assert h.get("ok") and int(h.get("max_concurrent_meetings") or 0)==5
            assert not h.get("autoscaler_enabled")
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0,k+" busy"
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=8) as r:v=json.load(r)
                assert int((v.get("data") or v).get("runningJobs") or 0)==0,"recorder active"
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","--format","{{.State.Health.Status}}",name],text=True).strip()=="healthy",name
            print("SHARED_VPS_IDLE_AND_CAMCAM_HEALTH_PASS")
            PY
            backup="/opt/beonmeet/.join-reliability-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 700 "$backup"
            cp -p app/main.py "$backup/main.py"
            cp -p app/i18n.py "$backup/i18n.py"
            cp -p "$overlay" "$backup/GoogleMeetBot.overlay.js"
            cp -p .env "$backup/env.before"
            if [ -s data/state.json ]; then cp -p data/state.json "$backup/state.before"; fi
            python3 - "$backup" <<'PY'
            import os,sqlite3,sys
            from pathlib import Path
            db=Path("/opt/beonmeet/data/beonmeet.db")
            if db.exists():
                src=sqlite3.connect("file:"+str(db)+"?mode=ro",uri=True)
                dstpath=Path(sys.argv[1])/"db.before"
                dst=sqlite3.connect(str(dstpath))
                src.backup(dst)
                dst.close();src.close()
                os.chmod(dstpath,0o600)
            print("ROLLBACK_BACKUP_COMPLETE")
            PY
            # Repeat the actual busy check immediately before touching source.
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=8) as r:h=json.load(r)
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0,k
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=8) as r:j=json.load(r)
                assert int((j.get("data") or j).get("runningJobs") or 0)==0
            PY
            changed=0
            succeeded=0
            rollback() {
              if [ "$changed" = 1 ] && [ "$succeeded" = 0 ]; then
                echo RESTORING_REVIEWED_CONTROLLER_AND_RECORDER_CODE
                cp -p "$backup/main.py" app/main.py
                cp -p "$backup/i18n.py" app/i18n.py
                cat "$backup/GoogleMeetBot.overlay.js" > "$overlay"
                systemctl restart beonmeet-controller || true
                docker restart -t 20 beonmeet-worker-five >/dev/null || true
              fi
              rm -rf "$stage"
            }
            trap rollback EXIT
            changed=1
            install -m 644 "$stage/main.py" app/main.py
            install -m 644 "$stage/i18n.py" app/i18n.py
            cat "$stage/GoogleMeetBot.patched.js" > "$overlay"
            systemctl restart beonmeet-controller
            docker restart -t 20 beonmeet-worker-five >/dev/null
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 http://127.0.0.1:8109/health >/dev/null 2>&1 && curl -fsS --max-time 3 http://127.0.0.1:9126/capacity >/dev/null 2>&1;then
                ready=1;break
              fi
              sleep 2
            done
            test "$ready" = 1 || { echo CONTROLLER_OR_WORKER_UNHEALTHY;exit 1; }
            cmp -s app/main.py "$stage/main.py"
            cmp -s app/i18n.py "$stage/i18n.py"
            docker exec beonmeet-worker-five sh -c 'grep -q "let beOnMeetAskedToJoin = false" /usr/src/app/dist/bots/GoogleMeetBot.js'
            docker exec beonmeet-worker-five node --check /usr/src/app/dist/bots/GoogleMeetBot.js
            curl -fsS --max-time 10 https://beonmeet.smarbiz.sbs/health >/dev/null
            for name in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$name")" = healthy
            done
            succeeded=1
            trap - EXIT
            rm -rf "$stage"
            echo JOIN_RELIABILITY_AND_ADMISSION_PATCH_RELEASE_SUCCESS
            echo CONTROLLER_WORKER_HEALTHY_CAMCAM_UNCHANGED
