name: Probe new standby Chrome Google Meet homepage after stress QA
on:
  push:
    branches: [feat/five-isolated-local-recorders-20261122]
    paths: [.github/workflows/qa-standby-google-meet-homepage.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: node --check tests/meet_homepage_standby_ui_probe.js
      - name: Wait for stress lock then verify Google Meet home in one standby lane
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 12m
          timeout: 20s
          script: |
            set -eu
            cd /opt/beonmeet
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 600 9
            python3 - <<'PY'
            import urllib.request,json
            with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=7) as r:d=json.load(r)
            assert d.get('ok')
            for k in ('free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs'):
                assert not int(d.get(k) or 0),'User work active'
            for port in (9126,9132,9133,9134,9135):
                with urllib.request.urlopen('http://127.0.0.1:%d/capacity'%port,timeout=6) as r:x=json.load(r)
                assert not int((x.get('data') or x).get('runningJobs') or 0)
            print('MEET_HOME_PROBE_SAFE_IDLE')
            PY
            SHA=${{ github.sha }}
            git fetch -q origin feat/five-isolated-local-recorders-20261122
            t=$(mktemp /tmp/meet-home-probe.XXXXXXXX.js)
            trap 'rm -f "$t"' EXIT
            git show "$SHA:tests/meet_homepage_standby_ui_probe.js" > "$t"
            docker exec -i beonmeet-worker-five node - < "$t"
