name: Read-only shared VPS secret presence audit
on:
  push:
    branches: [ops/shared-vps-source-audit-20261022]
    paths: [.github/workflows/shared-vps-secret-presence.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence only, never the secret values
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMINUSER: ${{ secrets.ADMINUSER }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          SHARED_VPS_PASS: ${{ secrets.SHARED_VPS_PASS }}
        run: |
          python3 - <<'PY'
          import os
          for key in ["HOST","PASS","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","TELEGRAM_BOT_TOKEN","ADMINUSER","HETZNER_API_TOKEN","SHARED_VPS_PASS"]:
              print(f'{key}: ' + ('PRESENT' if os.environ.get(key) else 'NOT_CONFIGURED'))
          PY
