name: Isolated five-stream balanced AV capacity smoke

on:
  push:
    branches: [ops/qa-five-balanced-av-20261121]
    paths:
      - .github/workflows/qa-five-balanced-av.yml

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Five 480p synthetic streams in disposable Chrome with fail-closed host guard
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 7m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST; exit 1 ;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 30 9
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,subprocess,urllib.request
            from pathlib import Path
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=6) as r:h=json.load(r)
            assert h.get("ok"),"Controller unhealthy"
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0,"Controller busy "+k
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:w=json.load(r)
                assert int((w.get("data") or w).get("runningJobs") or 0)==0,"Customer recording active"
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","--format","{{.State.Health.Status}}",name],text=True).strip()=="healthy"
            available=int(next(line.split()[1] for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemAvailable:")))
            print("HOST_AVAILABLE_MEM_BEFORE_KIB",available)
            assert available>=2400000,"Insufficient memory headroom to safely test five concurrent 480p encoders"
            print("SYNTHETIC_FIVE_SLOT_PRECHECK_PASS")
            PY
            qa=beonmeet-five-qa-chrome
            ! docker ps -a --format '{{.Names}}' | grep -Fxq "$qa" || { echo QA_CHROME_ALREADY_EXISTS; exit 1; }
            worker=beonmeet-worker-five
            dest=/tmp/beonmeet-five-balanced-qa.js
            out=/tmp/beonmeet-five-balanced-20261121
            abort=/tmp/beonmeet-five-sustained-abort-20261119
            # Remove only the exact stale QA script left root-owned by a prior
            # failed docker-cp run; never inspect or remove any customer files.
            docker exec -u 0 "$worker" rm -f "$dest"
            docker exec "$worker" test ! -e "$dest"
            docker exec "$worker" test ! -e "$out"
            docker exec "$worker" test ! -e "$abort"
            stage=$(mktemp -d /opt/beonmeet/.stage-five-balanced.XXXXXXXX)
            cleanup() {
              docker exec -u 0 "$worker" rm -f "$dest" "$abort" >/dev/null 2>&1 || true
              docker exec "$worker" rm -rf "$out" >/dev/null 2>&1 || true
              docker rm -f "$qa" >/dev/null 2>&1 || true
              rm -rf "$stage"
              echo "SYNTHETIC_QA_RESOURCES_CLEANED"
            }
            trap cleanup EXIT
            test "$(docker inspect -f '{{.State.Running}}' "$worker")" = true
            chrome_image=$(docker inspect -f '{{.Config.Image}}' beonmeet-chrome-single)
            docker run -d --name "$qa" --network beonmeet-single               --memory=1650m --memory-swap=1800m --cpus=1.25 --pids-limit=220               --shm-size=256m --restart=no               -e CHROME_URL=about:blank -e CHROME_WINDOW_SIZE=1024,768               "$chrome_image" >/dev/null
            git fetch -q origin main
            release=70c9a51bb0818b1fb807e1fca4270ce4565e2ce6
            git merge-base --is-ancestor "$release" FETCH_HEAD
            git show "$release:tests/five_sustained_av_smoke.js" > "$stage/qa.js"
            chmod 0644 "$stage/qa.js"
            docker cp "$stage/qa.js" "$worker:$dest"
            docker exec "$worker" node --check "$dest"
            connected=0
            for i in $(seq 1 25);do
              if docker exec "$worker" node -e "fetch('http://beonmeet-five-qa-chrome:9223/json/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(2))" >/dev/null 2>&1;then connected=1;break;fi
              sleep 2
            done
            test "$connected" = 1 || { echo QA_ISOLATED_CHROME_NOT_READY; exit 1; }
            echo "ISOLATED_QA_CHROME_READY"
            docker exec -e NODE_PATH=/usr/src/app/node_modules               -e QA_SECONDS=90 -e QA_WIDTH=854 -e QA_HEIGHT=480 -e QA_FPS=10               -e QA_VIDEO_BPS=650000 -e QA_AUDIO_BPS=96000               -e QA_OUTDIR="$out" "$worker" node "$dest" >"$stage/qa.log" 2>&1 &
            qa_pid=$!
            aborted=0
            for i in $(seq 1 24);do
              if ! kill -0 "$qa_pid" 2>/dev/null;then break;fi
              sleep 5
              if ! python3 - <<'PY'
            import json,subprocess,urllib.request
            from pathlib import Path
            available=int(next(line.split()[1] for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemAvailable:")))
            assert available>=1000000,"Host low RAM"
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=3) as r:h=json.load(r)
            for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(k) or 0)==0,"Customer traffic or delivery active"
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=3) as r:w=json.load(r)
                assert int((w.get("data") or w).get("runningJobs") or 0)==0,"Customer recording started"
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","--format","{{.State.Health.Status}}",name],text=True,timeout=4).strip()=="healthy","CamCam health loss"
            PY
              then
                docker exec "$worker" touch "$abort"
                aborted=1
                echo "QA_HOST_GUARD_REQUESTED_ABORT"
                break
              fi
            done
            qa_status=0
            wait "$qa_pid" || qa_status=$?
            grep -E 'QA_AV_START|QA_ALL_FIVE_RECORDERS_STARTED|QA_RECORDER_INTERNAL_META|QA_AV_RESULTS|QA_FIVE_AV_STREAMS_PASS|QA_FIVE_AV_STREAMS_FAILED' "$stage/qa.log" | tail -n 9 || true
            test "$aborted" = 0 && test "$qa_status" = 0
            grep -q 'QA_FIVE_AV_STREAMS_PASS' "$stage/qa.log"
            docker exec "$worker" sh -c "for f in $out/stream-*.webm; do ffprobe -v error -show_entries stream=codec_type -of csv=p=0 \"\$f\"; done" | sort | uniq -c
            echo "FIVE_SYNTHETIC_480P_RECORDERS_PASS_NOT_REAL_GOOGLE_MEETS"
            for name in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$name")" = healthy
            done
            echo "CAMCAM_HEALTHY_AFTER_FIVE_AV_QA"
