name: Controller Readonly Diagnostic

on:
  push:
    branches:
      - ops/recovery-mri4760-20260929
    paths:
      - ".github/workflows/controller-readonly-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read controller runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          script: |
            cd /opt/beonmeet
            echo "=== STATS ==="
            docker stats --no-stream beonmeet-controller-1 || true
            echo "=== PROCESSES ==="
            docker compose exec -T controller sh -lc 'ps -eo pid,pcpu,pmem,etime,comm,args | grep -E "python|ffmpeg" | grep -v grep' || true
            echo "=== RECENT LOGS ==="
            docker compose logs --tail=120 controller | grep -E "premium|transcrib|recovery|Whisper|error" || true
            echo "=== INCOMPLETE RECOVERY MEDIA ==="
            docker compose exec -T controller python - <<'PY'
            import json, os, subprocess
            from pathlib import Path
            import redis
            r=redis.Redis.from_url(os.environ.get("REDIS_URL","redis://redis:6379/0"),decode_responses=True)
            st=json.loads(r.get(os.environ.get("REDIS_STATE_KEY","beonmeet:controller:state")) or "{}")
            downloads=st.get("recording_downloads") or {}
            recoveries=st.get("premium_recoveries") or {}
            out=[]
            for token, rec in recoveries.items():
                if not rec.get("audio_delivered") or rec.get("transcript_delivered"):
                    continue
                item=downloads.get(token) or {}
                p=Path(str(item.get("file_path") or ""))
                if not p.exists():
                    continue
                try:
                    cp=subprocess.run(
                        ["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(p)],
                        capture_output=True,text=True,check=True,timeout=20
                    )
                    dur=float((cp.stdout or "0").strip() or 0)
                except Exception:
                    dur=0.0
                temp_audio=Path("/data/recording-downloads") / f".premium-recovery-{token[:16]}.mp3"
                audio_size=0
                audio_duration=0.0
                if temp_audio.exists():
                    audio_size=temp_audio.stat().st_size
                    try:
                        cp2=subprocess.run(
                            ["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(temp_audio)],
                            capture_output=True,text=True,check=True,timeout=20
                        )
                        audio_duration=float((cp2.stdout or "0").strip() or 0)
                    except Exception:
                        audio_duration=0.0
                out.append({
                    "size_bytes":p.stat().st_size,
                    "duration_seconds":round(dur,1),
                    "temp_audio_size_bytes":audio_size,
                    "temp_audio_duration_seconds":round(audio_duration,1),
                })
            print(json.dumps(out,separators=(",",":")))
            PY
