name: BeOnMeet 5 x 480p synthetic AV stress (safe production isolation)
on:
  push:
    branches: [qa/five-stream-480p-stress-20261121]
    paths: [.github/workflows/qa-five-stream-480p-20261121.yml]
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Five independent 480p10 VP8+Opus encoders for 4 minutes and verify outputs
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 12m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST; exit 1 ;; esac
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 30 9
            cd /opt/beonmeet
            TEST=beonmeet-five-qa-chrome
            TEMP=$(mktemp -d /opt/beonmeet/.qa-five-av.XXXXXXXX)
            ABORT=/tmp/beonmeet-five-sustained-abort-20261121
            OUT=/tmp/beonmeet-five-sustained-20261121
            PID=""
            cleanup() {
              if [ -n "$PID" ]; then
                docker exec beonmeet-worker-single touch "$ABORT" >/dev/null 2>&1 || true
                kill "$PID" >/dev/null 2>&1 || true
                wait "$PID" >/dev/null 2>&1 || true
              fi
              docker rm -f "$TEST" >/dev/null 2>&1 || true
              docker exec beonmeet-worker-single rm -rf "$OUT" "$ABORT" >/dev/null 2>&1 || true
              rm -rf "$TEMP"
            }
            trap cleanup EXIT
            docker ps -a --format '{{.Names}}' | grep -Fxq "$TEST" && { echo QA_CONTAINER_ALREADY_EXISTS; exit 1; } || true
            echo QA_PRECHECK_480P
            for s in beonmeet-worker-single beonmeet-worker-five beonmeet-chrome-single; do docker inspect "$s" >/dev/null; done
            for p in ffprobe ffmpeg; do command -v "$p" >/dev/null; done
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=8) as r:d=json.load(r)
            assert d.get('ok') and int(d.get('max_concurrent_meetings') or 0)==5
            assert not d.get('autoscaler_enabled')
            for key in ('free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs'):
                assert int(d.get(key) or 0)==0, 'Customer load active: '+key
            for port in (9124,9126):
                with urllib.request.urlopen('http://127.0.0.1:'+str(port)+'/capacity',timeout=8) as r:v=json.load(r)
                assert int((v.get('data') or v).get('runningJobs') or 0)==0, 'Recorder is in use'
            import pathlib
            mem=int(next(x.split()[1] for x in open('/proc/meminfo') if x.startswith('MemAvailable:')))
            disk=__import__('shutil').disk_usage('/')
            assert mem>2400000 and disk.free>3*1024**3, 'Host has inadequate spare resources'
            print('QA_HOST_BASELINE_RAM_MB='+str(round(mem/1024)))
            print('QA_HOST_BASELINE_DISK_GB='+str(round(disk.free/1024**3,2)))
            PY
            for s in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$s")" = healthy ] || {
                echo QA_CAMCAM_UNHEALTHY_BEFORE_TEST; exit 1;
              }
            done
            git fetch --quiet origin refs/heads/qa/five-stream-480p-stress-20261121
            git show "${{ github.sha }}:tests/five_sustained_av_smoke.js" > "$TEMP/stress.js"
            sed -i "s/20261119/20261121/g" "$TEMP/stress.js"
            node --check "$TEMP/stress.js"
            docker exec beonmeet-worker-single rm -rf "$OUT" "$ABORT"
            echo QA_VP8_OPUS_START_480P_10FPS_FIVE_STREAMS
            docker run -d --name "$TEST" --network beonmeet-single --memory=2050m --memory-swap=2300m --cpus=1.55 --pids-limit=300 --shm-size=384m --tmpfs /tmp/chrome-profile:rw,size=512m,mode=0777 -e CHROME_WINDOW_SIZE=854,480 beonmeet-chrome-cdp:latest >/dev/null
            READY=0
            for i in $(seq 1 30); do
              if docker exec beonmeet-worker-single node -e 'fetch("http://beonmeet-five-qa-chrome:9223/json/version",{signal:AbortSignal.timeout(1100)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))' >/dev/null 2>&1;then READY=1; break; fi
              sleep 1
            done
            [ "$READY" = 1 ] || { echo QA_EPHEMERAL_CHROME_BOOT_FAILED; docker logs "$TEST" --tail 18 || true; exit 1; }
            docker exec -i -e QA_SECONDS=240 -e QA_WIDTH=854 -e QA_HEIGHT=480 -e QA_FPS=10 -e QA_VIDEO_BPS=650000 -e QA_AUDIO_BPS=96000 beonmeet-worker-single node - < "$TEMP/stress.js" > "$TEMP/test.log" 2>&1 &
            PID=$!
            SAFETY_ABORT=0
            for i in $(seq 1 28); do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              available=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
              rootfree=$(df -Pk / | awk 'NR==2 {print $4}')
              load=$(awk '{print $1}' /proc/loadavg)
              printf 'QA_HOST_SAMPLE %02d avail_mb=%s disk_mb=%s load1=%s\n' "$i" "$((available/1024))" "$((rootfree/1024))" "$load"
              if [ "$available" -lt 1500000 ] || [ "$rootfree" -lt 1500000 ]; then
                echo QA_SAFETY_ABORT_LOW_MEM_OR_DISK
                SAFETY_ABORT=1
              fi
              for s in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
                health=$(docker inspect -f '{{.State.Health.Status}}' "$s" 2>/dev/null || echo missing)
                if [ "$health" != healthy ]; then
                  echo "QA_SAFETY_ABORT_CAMCAM=$s:$health"
                  SAFETY_ABORT=1
                fi
              done
              if ! python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=5) as r:h=json.load(r)
            assert h.get('ok'), 'controller unhealthy'
            assert all(int(h.get(k) or 0)==0 for k in ('free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs')), 'real user work detected'
            for port in (9124,9126):
              with urllib.request.urlopen('http://127.0.0.1:'+str(port)+'/capacity',timeout=5) as r:c=json.load(r)
              assert int((c.get('data') or c).get('runningJobs') or 0)==0, 'live recorder started'
            PY
              then echo QA_SAFETY_ABORT_LIVE_CUSTOMER_ACTIVITY; SAFETY_ABORT=1; fi
              if [ $((i%3)) -eq 0 ]; then
                docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' "$TEST" beonmeet-chrome-single beonmeet-worker-five 2>/dev/null || true
              fi
              if [ "$SAFETY_ABORT" = 1 ]; then
                docker exec beonmeet-worker-single touch "$ABORT" || true
                break
              fi
              sleep 10
            done
            STATUS=0
            wait "$PID" || STATUS=$?
            PID=""
            cat "$TEMP/test.log"
            [ "$SAFETY_ABORT" = 0 ] || { echo QA_ABORTED_FOR_HOST_SAFETY; exit 1; }
            [ "$STATUS" = 0 ] || { echo "QA_AV_STREAMS_EXIT=$STATUS"; exit 1; }
            grep -q 'QA_FIVE_AV_STREAMS_PASS' "$TEMP/test.log" || { echo QA_RESULT_MARKER_MISSING; exit 1; }
            echo QA_VERIFY_FILE_TRACKS_AND_TONES
            mkdir -p "$TEMP/outputs"
            for i in 1 2 3 4 5; do
              docker cp "beonmeet-worker-single:$OUT/stream-$i.webm" "$TEMP/outputs/stream-$i.webm"
            done
            QA_OUTPUT_DIR="$TEMP/outputs" python3 - <<'PY'
            import os,json,subprocess,math,array
            from pathlib import Path
            basedir=Path(os.environ['QA_OUTPUT_DIR'])
            tones=(220,330,440,550,660)
            for i,frequency in enumerate(tones,1):
                path=basedir/('stream-'+str(i)+'.webm')
                probe=json.loads(subprocess.check_output([
                    'ffprobe','-v','error','-show_streams','-show_format','-of','json',str(path)
                ],timeout=20))
                streams=probe['streams']
                types={s['codec_type'] for s in streams}
                assert {'audio','video'}.issubset(types),(i,types)
                duration=probe.get('format',{}).get('duration')
                if duration is not None:
                    assert float(duration)>=210,(i,duration)
                audio=subprocess.check_output([
                    'ffmpeg','-nostdin','-loglevel','error','-ss','8','-i',str(path),
                    '-t','3','-vn','-ac','1','-ar','8000','-f','s16le','pipe:1'
                ],timeout=35)
                samples=array.array('h');samples.frombytes(audio)
                assert len(samples)>10000,(i,len(samples))
                def goertzel(freq):
                    coeff=2*math.cos(2*math.pi*freq/8000.0)
                    q1=q2=0.0
                    for s in samples:
                        q0=s+coeff*q1-q2
                        q2,q1=q1,q0
                    return q1*q1+q2*q2-coeff*q1*q2
                scores=[goertzel(f) for f in tones]
                peak=max(range(5),key=lambda k:scores[k])
                print('QA_FILE_AUDIO_VIDEO_'+str(i)+' size_kb='+str(round(path.stat().st_size/1024))+
                      ' duration='+str(duration)+' expected_hz='+str(frequency)+
                      ' dominant_hz='+str(tones[peak])+' audio_video_types='+str(sorted(types)))
                assert peak==i-1,'Audio from another stream or silent: '+str(i)
                assert scores[peak]>5*max([scores[j] for j in range(5) if j!=peak]+[1]),'Audio crosstalk: '+str(i)
            print('QA_FIVE_AV_FILES_INDEPENDENT_PASS')
            PY
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=8) as r:d=json.load(r)
            assert int(d.get('max_concurrent_meetings') or 0)==5
            assert not d.get('autoscaler_enabled')
            with urllib.request.urlopen('http://127.0.0.1:9126/capacity',timeout=8) as r:d=json.load(r)
            assert int((d.get('data') or d).get('availableSlots') or 0)==5
            print('QA_PRODUCTION_WORKERS_STILL_HEALTHY')
            PY
            for s in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$s")" = healthy ] || { echo QA_POST_CAMCAM_FAILED;exit 1; }
            done
            echo QA_CAMCAM_HEALTHY_AFTER_STRESS
            echo QA_FIVE_SUSTAINED_AV_STRESS_480P_PASS
