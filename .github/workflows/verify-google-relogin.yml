name: Verify BeOnMeet Google server Chrome reauthentication
on:
  push:
    branches: [ops/verify-google-relogin-20261121]
    paths: [.github/workflows/verify-google-relogin.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only verify Google login and recorder availability
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,urllib.request
            for name,filename in (
              ("chromium","/usr/src/app/dist/lib/chromium.js"),
              ("meetbot","/usr/src/app/dist/bots/GoogleMeetBot.js")):
                p=subprocess.run(["docker","exec","beonmeet-worker-five","cat",filename],capture_output=True,text=True,timeout=15)
                if p.returncode:
                    print("RUNTIME_SOURCE_ABSENT",name)
                    continue
                code=p.stdout
                for marker in (
                    "connectOverCDP","browser.newContext(","browser.contexts()",
                    ".newContext(","this.browser.newPage(","this.browserContext.newPage(",
                    "this.page =","this._page =","context.newPage(","newPage(",
                    "Launching browser","Navigating to Google Meet URL",
                    "Guest pre-join detected","Join now","Ask to join"):
                    indices=[i for i in range(len(code)) if code.startswith(marker,i)]
                    if indices:
                        print("RUNTIME_BROWSER_CONTEXT_CODE",name,marker,len(indices),
                            json.dumps([code[max(0,i-100):i+150].replace("\\n"," ") for i in indices[:2]]))
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as r:d=json.load(r)
                print("ACTIVE_RECORDER_JOBS",port,int((d.get("data") or d).get("runningJobs") or 0))
            print("RECORDER_CONTEXT_READONLY_AUDIT_DONE")
            PY
