name: Verify BeOnMeet Google server Chrome reauthentication
on:
  push:
    branches: [ops/verify-google-relogin-20261121]
    paths: [.github/workflows/verify-google-relogin.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only verify Google login and recorder availability
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,urllib.request
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:d=json.load(r)
                assert int((d.get("data")or d).get("runningJobs") or 0)==0, "Customer meeting active: skip prejoin"
            js=r"""
            (async()=>{
              const {chromium}=require('playwright-extra');
              let page=null;
              const alarm=setTimeout(()=>{console.log('SIGNEDIN_MEET_PREJOIN_TIMEOUT');process.exit(17)},27000);
              try{
                const b=await chromium.connectOverCDP(process.env.GOOGLE_CHROME_CDP_URL,{timeout:12000});
                const ctx=b.contexts()[0];
                if(!ctx)throw Error('No persistent Chrome context');
                const names=new Set((await ctx.cookies('https://accounts.google.com')).map(c=>c.name));
                console.log('AUTHENTICATED_CONTEXT',names.has('SID') && names.has('SAPISID'));
                page=await ctx.newPage();
                const response=await page.goto('https://meet.google.com/cru-ggpe-nwi',{waitUntil:'domcontentloaded',timeout:14000});
                await page.waitForTimeout(3500);
                const status=await page.evaluate(()=>{
                  const t=(document.body?.innerText||'').toLowerCase();
                  const buttons=Array.from(document.querySelectorAll('button')).map(x=>String(x.innerText||x.getAttribute('aria-label')||'').toLowerCase());
                  const url=location.hostname;
                  const input=document.querySelector('input[placeholder*="name" i],input[aria-label*="name" i]');
                  return {
                    host_category:(url==='meet.google.com'?'meet':url==='accounts.google.com'?'accounts':url==='workspace.google.com'?'workspace':'other'),
                    guest_name_prompt:!!input,
                    ask_to_join:buttons.some(x=>x.includes('ask to join')||x.includes('teilnahme erbitten')),
                    join_now:buttons.some(x=>x.includes('join now')||x.includes('jetzt teilnehmen')),
                    joining_allowed_notice:t.includes('join now'),
                    sign_in_offer:t.includes('sign in')||t.includes('anmelden'),
                    invalid_code:t.includes('invalid')||t.includes('couldn’t find')||t.includes('not found'),
                    button_count:buttons.length,
                    content_present:t.length>50
                  };
                });
                console.log('SIGNEDIN_MEET_PREJOIN',JSON.stringify({httpStatus:response?.status(),...status}));
                console.log('NO_JOIN_OR_RECORDING_ATTEMPTED',true);
              }catch(e){console.log('SIGNEDIN_MEET_PREJOIN_ERROR_CLASS',e.name)}
              finally{
                try{if(page)await page.close({runBeforeUnload:false})}catch{}
                clearTimeout(alarm);
                process.exit(0);
              }
            })();
            """
            p=subprocess.run(["docker","exec","beonmeet-worker-five","node","-e",js],capture_output=True,text=True,timeout=34)
            print("MEET_PREJOIN_TEST_PROCESS_EXIT",p.returncode)
            for line in p.stdout.splitlines():
                if line.startswith(("AUTHENTICATED_CONTEXT","SIGNEDIN_MEET_PREJOIN","NO_JOIN_OR_RECORDING_ATTEMPTED")):print(line[:1000])
            print("SIGNEDIN_BROWSER_PREJOIN_READONLY_TEST_DONE")
            PY
