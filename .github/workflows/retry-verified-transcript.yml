name: One-time resume one preserved Premium transcript after Whisper repair

on:
  push:
    branches: [ops/retry-whisper-pending-after-model-ready-20261121]
    paths:
      - .github/workflows/retry-verified-transcript.yml

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Guardedly release bounded transcript recovery without rebilling or resending video
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 5m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 45 9
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,subprocess,urllib.request,os
            from pathlib import Path
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=6) as r:h=json.load(r)
            assert h.get("ok") and int(h.get("active_delivery_jobs") or 0)==0
            for key in ("free_queue","premium_queue"):
                assert int(h.get(key) or 0)==0
            for p in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(p)+"/capacity",timeout=6) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0,"A meeting is being recorded"
            st=json.loads(Path("data/state.json").read_text())
            items=list((st.get("pending_deliveries") or {}).values())
            assert len(items)==1,"Expected exactly one unfinished Premium session"
            p=items[0]
            assert p.get("video_delivered") and p.get("audio_delivered") and not p.get("transcript_delivered")
            assert int(p.get("attempts") or 0)==16,"Unexpected recovery history"
            src=Path(str(p.get("file_path") or p.get("source_path") or ""))
            assert src.is_file() and src.stat().st_size>0
            keys={line.split("=",1)[0].strip():line.split("=",1)[1].strip() for line in Path(".env").read_text().splitlines() if "=" in line and not line.lstrip().startswith("#")}
            assert "PENDING_DELIVERY_MAX_ATTEMPTS" not in keys,"Unexpected custom retry override"
            assert keys.get("WHISPER_MODEL")=="small"
            imp=subprocess.run(["runuser","-u","beonmeet","--",".venv/bin/python","-c","from faster_whisper import WhisperModel;import av"],capture_output=True,text=True,timeout=20)
            assert imp.returncode==0,"Nonroot Whisper still broken"
            for name in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","-f","{{.State.Health.Status}}",name],text=True).strip()=="healthy"
            print("TRANSCRIPT_RETRY_SAFETY_AND_MODEL_IMPORT_PASS")
            PY
            backup="/opt/beonmeet/.transcript-retry-env-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 700 "$backup"
            cp -p .env "$backup/env.before"
            cp -p data/state.json "$backup/state.before"
            changed=0
            completed=0
            rollback() {
              if [ "$changed" = 1 ] && [ "$completed" = 0 ];then
                cp -p "$backup/env.before" .env
                systemctl restart beonmeet-controller || true
                echo "TRANSCRIPT_RETRY_ENV_ROLLED_BACK"
              fi
            }
            trap rollback EXIT
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=5) as r:h=json.load(r)
            assert int(h.get("active_delivery_jobs") or 0)==0
            for k in ("free_queue","premium_queue"):assert int(h.get(k) or 0)==0
            for p in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(p)+"/capacity",timeout=5) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0
            PY
            changed=1
            printf '\nPENDING_DELIVERY_MAX_ATTEMPTS=20\n' >> .env
            systemctl restart beonmeet-controller
            ready=0
            for i in $(seq 1 23); do
              if curl -fsS --max-time 3 http://127.0.0.1:8109/health >/dev/null 2>&1;then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1
            curl -fsS --max-time 8 https://beonmeet.smarbiz.sbs/health >/dev/null
            for name in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1; do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$name")" = healthy
            done
            completed=1
            trap - EXIT
            echo "EXACT_PENDING_TRANSCRIPT_RECOVERY_REENABLED_WITH_4_EXTRA_ATTEMPTS"
            echo "PREVIOUS_VIDEO_AUDIO_AND_WALLET_PRESERVED"
