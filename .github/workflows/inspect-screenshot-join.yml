name: Read-only BeOnMeet screenshot incident audit

on:
  push:
    branches: [ops/inspect-screenshot-meet-failure-20261121]
    paths:
      - .github/workflows/inspect-screenshot-join.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Correlate recent join errors safely without recording or personal data
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,re,datetime,urllib.request
            def exec_cmd(args,timeout=25):
                p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=timeout)
                return p.stdout if p.returncode==0 else ""
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            name="beonmeet-worker-five"
            matches=exec_cmd(["docker","exec",name,"sh","-c","find /usr/src/app/dist -type f -iname '*chromium*' -o -iname '*browser*' | head -35"])
            print("CHROMIUM_SOURCE_PATHS",[p for p in matches.splitlines() if p.startswith("/usr/src/app/dist/")][:35])
            paths=[p for p in matches.splitlines() if p.startswith("/usr/src/app/dist/") and "chromium" in p.lower()]
            for p in paths[:3]:
                raw=exec_cmd(["docker","exec",name,"cat",p],20)
                print("COMPILED_BROWSER_HELPER",p,"BYTES",len(raw))
                if raw:
                    # Source code only; no env values, passwords, cookies or user info.
                    lines=raw.splitlines()
                    for i,line in enumerate(lines):
                        if any(w in line for w in ("connectOverCDP","launchPersistentContext","CHROME_CDP_URL","chromium.connect","newPage(","newContext(","connectOptions","browserWSEndpoint")):
                            print("COMPILED_BROWSER_CALL",i+1,repr("\n".join(lines[max(0,i-3):min(len(lines),i+5)]))[:900])
            state=json.loads(exec_cmd(["docker","inspect","--format","{{json .Config.Env}}",name]))
            keys={item.split("=",1)[0] for item in state if "=" in item}
            print("WORKER_CONNECTION_ENV_KEYS",{k:k in keys for k in ("CHROME_CDP_URL","CHROME_REMOTE_DEBUGGING_URL","CHROME_URL","BROWSER_WS_ENDPOINT","CHROME_WS_ENDPOINT","USE_EXTERNAL_CHROME","GOOGLE_CHROME_CDP_URL")})
            for container in ("beonmeet-worker-five","beonmeet-chrome-single"):
                raw=exec_cmd(["docker","inspect","--format","{{json .State}}",container])
                if raw:
                    st=json.loads(raw)
                    print("CONTAINER_STATE",container,{k:st.get(k) for k in ("Status","Running","OOMKilled","RestartCount")})
            cap={}
            for port in (9126,9124):
                try:
                    with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=4) as response: dat=json.load(response)
                    cap[port]=dat.get("data",dat).get("runningJobs")
                except Exception:cap[port]="unavailable"
            print("RUNNING_JOBS",cap)
            print("COMPILED_BROWSER_AUDIT_FINISHED")
            PY
