name: Read-only BeOnMeet screenshot incident audit

on:
  push:
    branches: [ops/inspect-screenshot-meet-failure-20261121]
    paths:
      - .github/workflows/inspect-screenshot-join.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Correlate recent join errors safely without recording or personal data
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import datetime,subprocess,json,re,collections
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            r=subprocess.run(["docker","logs","--since","2026-11-21T11:17:30Z","beonmeet-worker-five"],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=25)
            ids={}
            for line in r.stdout.splitlines():
                if not line.startswith("[2026-11-21T"):continue
                stamp=line[1:24]
                if "[correlationId: " in line:
                    ident=line.split("[correlationId: ",1)[1].split("]",1)[0]
                    if ident not in ids:ids[ident]="job"+str(len(ids)+1)
                    job=ids[ident]
                else:job="system"
                message=line.split("] ",4)[-1].split(" {",1)[0].strip()
                # Never print links, user identifiers, HTML, cookies or raw metadata.
                message=re.sub(r"https?://[^\s\"']+","[URL]",message)
                message=re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}","[EMAIL]",message)
                message=re.sub(r"\b[a-z]{3}-[a-z]{4}-[a-z]{3}\b","[MEET]",message,flags=re.I)
                message=re.sub(r"\b\d{5,}\b","[ID]",message)
                message=re.sub(r"(?i)(token|cookie|authorization|password|secret)[=: ]+[^ ,;}]+","[SECRET]",message)
                if len(message)>200:message=message[:200]+"[TRUNCATED]"
                extra=[]
                if " {" in line:
                    try:
                        data=json.loads(line.split(" {",1)[1].join(["{", ""]))
                        for k in ("error","errorType","reason"):
                            val=data.get(k)
                            if isinstance(val,dict):
                                name=str(val.get("name") or val.get("type") or "")
                                detail=str(val.get("message") or "")
                                types=[p for p in ("TimeoutError","TargetClosedError","ECONNREFUSED","ETIMEDOUT","EACCES","ERR_CONNECTION_RESET","ERR_NAME_NOT_RESOLVED","ERR_CERT","ERR_ABORTED","net::ERR_","No such file","Navigation timeout","protocol","Target closed") if p.lower() in detail.lower()]
                                extra.append({"name":name[:48],"types":types})
                            elif isinstance(val,str):
                                types=[p for p in ("TimeoutError","TargetClosedError","ECONNREFUSED","ETIMEDOUT","EACCES","ERR_CONNECTION_RESET","ERR_NAME_NOT_RESOLVED","ERR_CERT","ERR_ABORTED","net::ERR_","No such file","Navigation timeout","protocol","Target closed") if p.lower() in val.lower()]
                                extra.append({"key":k,"types":types,"type":val.split(":")[0][:42]})
                    except Exception:pass
                print("WORKER_MESSAGE",stamp,job,repr(message),json.dumps(extra))
            print("LATEST_WORKER_MESSAGES_FINISHED")
            PY
