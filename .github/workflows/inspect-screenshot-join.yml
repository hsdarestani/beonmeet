name: Read-only BeOnMeet screenshot incident audit

on:
  push:
    branches: [ops/inspect-screenshot-meet-failure-20261121]
    paths:
      - .github/workflows/inspect-screenshot-join.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Correlate recent join errors safely without recording or personal data
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import datetime,json,subprocess,urllib.request
            from pathlib import Path
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0,"User recorder currently busy; skip"
            state=json.loads(Path("data/state.json").read_text())
            candidates=[v for v in state.get("launched_events",{}).values()
                        if isinstance(v,dict) and str(v.get("launched_at","")).startswith("2026-11-21T11:18:35")]
            print("MATCHING_TEST_SESSION_COUNT",len(candidates))
            if len(candidates)!=1:raise SystemExit("Could not safely select exact consented session")
            url=str(candidates[0].get("meet_url",""))
            assert url.startswith("https://meet.google.com/"),"Not a Google Meet URL"
            js=r'''
            (async()=>{
              let phase="connect",page;
              try{
                const {chromium}=require("playwright-extra");
                const browser=await chromium.connectOverCDP(process.env.GOOGLE_CHROME_CDP_URL,{timeout:12000});
                phase="context";
                const ctx=browser.contexts()[0]??await browser.newContext();
                ctx.setDefaultTimeout(9000);
                phase="new_page";
                page=await ctx.newPage();
                phase="navigate";
                const res=await page.goto(process.argv[1],{waitUntil:"domcontentloaded",timeout:22000});
                console.log("MEET_NAVIGATION_HTTP_CLASS",res?Math.floor(res.status()/100)+"xx":"null");
                await page.waitForTimeout(5000);
                const current=page.url();
                console.log("MEET_REDIRECT_TO_GOOGLE_LOGIN",current.includes("accounts.google.com"));
                console.log("MEET_STAYED_ON_MEET_DOMAIN",current.includes("meet.google.com"));
                const visible=await page.locator("button").filter({hasText:/Ask to join|Join now|Join anyway|Teilnahme erbitten|Jetzt teilnehmen|Trotzdem teilnehmen/i}).first().isVisible().catch(()=>false);
                const name=await page.locator('input[type="text"]').first().isVisible().catch(()=>false);
                console.log("MEET_VISIBLE_JOIN_BUTTON",visible);
                console.log("MEET_VISIBLE_GUEST_NAME_FIELD",name);
                console.log("MEET_PREJOIN_UI_READY",visible||name);
                console.log("MEET_PREJOIN_TEST_RESULT","COMPLETE_NO_JOIN_CLICK");
              }catch(e){
                console.log("MEET_PREJOIN_TEST_RESULT","FAIL","PHASE",phase,"ERROR_CLASS",e.name);
              }finally{
                if(page)await page.close({timeout:8000}).catch(()=>{});
                process.exit(0);
              }
            })();
            '''
            p=subprocess.run(["docker","exec","beonmeet-worker-five","node","-e",js,url],
                stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=55)
            print("TEST_PROCESS_EXIT",p.returncode)
            for line in p.stdout.splitlines():
                if line.startswith("MEET_"):print(line[:250])
            print("NON_JOINING_BROWSER_TEST_DONE")
            PY
