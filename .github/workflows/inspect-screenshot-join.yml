name: Read-only BeOnMeet screenshot incident audit

on:
  push:
    branches: [ops/inspect-screenshot-meet-failure-20261121]
    paths:
      - .github/workflows/inspect-screenshot-join.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Correlate recent join errors safely without recording or personal data
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,re,datetime
            def run(*a):
                p=subprocess.run(a,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=30)
                return p.stdout
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            raw=run("docker","exec","beonmeet-worker-five","cat","/usr/src/app/dist/bots/GoogleMeetBot.js")
            for needle in ("Launching browser...", "Google Meet Bot is entering", "Waiting for Google Meet pre-join controls...", "this.page.goto(", "connectOverCDP", "CONTROLLER_WAITING_FOR_ADMISSION_URL"):
                pos=raw.find(needle)
                print("CODE_NEEDLE",needle,"POS",pos,"COUNT",raw.count(needle))
                if pos>=0:
                    start=max(0,pos-1200);end=min(len(raw),pos+800)
                    snippet=raw[start:end]
                    snippet=re.sub(r"https?://[^\\s\\\"']+","[URL]",snippet)
                    print("CODE_CONTEXT",needle,repr(snippet[:2100]))
            try:
                live=run("docker","exec","beonmeet-chrome-single","sh","-c","curl -fsS --max-time 4 http://127.0.0.1:9222/json/list")
                tabs=json.loads(live)
                for tab in tabs:
                    u=str(tab.get("url") or "")
                    title=str(tab.get("title") or "")
                    if "meet.google.com" in u:cls="MEET"
                    elif "accounts.google.com" in u:cls="GOOGLE_ACCOUNT"
                    else:cls="OTHER"
                    if cls!="OTHER":
                        print("CHROME_TAB",cls,"TITLE_CATEGORY",("SIGN_IN" if "sign in" in title.lower() or "sign-in" in title.lower() else "OTHER"))
            except Exception as e:print("BROWSER_TABS_ERROR",type(e).__name__)
            for name in ("beonmeet-worker-five","beonmeet-chrome-single"):
                raw=run("docker","inspect","--format","{{json .State}}",name)
                state=json.loads(raw)
                print("CONTAINER",name,"UP",state.get("Running"),"OOM",state.get("OOMKilled"))
            raw=run("docker","logs","--since","2026-11-21T11:18:00Z","beonmeet-worker-five")
            for line in raw.splitlines()[-45:]:
                if "{" in line:line=line.split(" {",1)[0]
                if line.startswith("[2026-11-21T"):
                    phrase=line.split("] ",4)[-1]
                    if "http" not in phrase and "@" not in phrase and len(phrase)<145:
                        print("NEW_WORKER_EVENT",line[1:24],phrase.strip()[:110])
            print("STATIC_BROWSER_AND_RECENT_LOG_INSPECTION_DONE")
            PY
