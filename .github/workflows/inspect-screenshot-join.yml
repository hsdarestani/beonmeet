name: Read-only BeOnMeet screenshot incident audit

on:
  push:
    branches: [ops/inspect-screenshot-meet-failure-20261121]
    paths:
      - .github/workflows/inspect-screenshot-join.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Correlate recent join errors safely without recording or personal data
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,subprocess,urllib.request,datetime
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=6) as res:d=json.load(res)
                n=int((d.get("data",d)).get("runningJobs") or 0)
                print("RUNNING_JOBS",port,n)
                assert n==0,"Skip browser test: customer work running"
            js=r"""
            (async function(){
             let phase="module";
             try{
               const m=require('playwright-extra');
               const chromium=m.chromium;
               const raw=process.env.GOOGLE_CHROME_CDP_URL;
               if(!raw)throw Error("CDP_URL_MISSING");
               phase="cdp_connect";
               console.log("BROWSER_STAGE",phase,"begin");
               const browser=await chromium.connectOverCDP(raw,{timeout:12000});
               console.log("BROWSER_STAGE",phase,"success");
               phase="context";
               const all=browser.contexts();
               const ctx=all[0] ?? await browser.newContext();
               console.log("BROWSER_STAGE",phase,"success","existing_contexts",all.length);
               ctx.setDefaultTimeout(9000);
               phase="new_page";
               const page=await ctx.newPage();
               console.log("BROWSER_STAGE",phase,"success");
               phase="close_page";
               await page.close({timeout:9000});
               console.log("BROWSER_STAGE",phase,"success");
               console.log("BROWSER_PROBE_RESULT","SUCCESS");
             }catch(e){
               const msg=String(e?.message||"");
               const markers=["Timeout","Protocol error","Target closed","ECONNREFUSED","ETIMEDOUT","WebSocket","Browser closed","Connection closed","Failed to launch","ERR_CONNECTION_RESET"];
               console.log("BROWSER_PROBE_RESULT","FAIL","phase",phase,"error_class",e?.name||"Unknown","markers",JSON.stringify(markers.filter(t=>msg.includes(t))));
             }
             process.exit(0);
            })();
            """
            p=subprocess.run(["docker","exec","beonmeet-worker-five","node","-e",js],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=39)
            print("NODE_DIAGNOSTIC_EXIT",p.returncode)
            for l in p.stdout.splitlines():
                if l.startswith("BROWSER_"):print(l[:400])
            print("SAFE_CDP_PLAYWRIGHT_TEST_COMPLETE")
            PY
