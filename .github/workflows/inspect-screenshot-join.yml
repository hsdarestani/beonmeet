name: Read-only BeOnMeet screenshot incident audit

on:
  push:
    branches: [ops/inspect-screenshot-meet-failure-20261121]
    paths:
      - .github/workflows/inspect-screenshot-join.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Correlate recent join errors safely without recording or personal data
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 6m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,datetime,json,urllib.request
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as res:d=json.load(res)
                print("RUNNING_JOBS",port,(d.get("data",d)).get("runningJobs"))
            js=r'''
            (async()=>{
              const raw=process.env.GOOGLE_CHROME_CDP_URL;
              if(!raw){console.log("CDP_ENV_MISSING");return;}
              let url;
              try{url=new URL(raw);}catch{console.log("CDP_URL_PARSE_FAILED");return;}
              const host=url.hostname;
              console.log("CDP_SCHEME",url.protocol);
              console.log("CDP_HOST_KIND",host==="localhost"||host.startsWith("127.")?"localhost":(host.includes("docker")||host.includes("chrome")?"container": "other"));
              console.log("CDP_HOST_PORT",url.port||"default");
              let wsUrl;
              try{
                const req=new AbortController();
                const timeout=setTimeout(()=>req.abort(),7000);
                const response=await fetch(raw.replace(/\/$/,"")+"/json/version",{signal:req.signal});
                clearTimeout(timeout);
                console.log("CDP_HTTP_STATUS",response.status);
                const value=await response.json();
                wsUrl=value.webSocketDebuggerUrl;
                console.log("CDP_BROWSER_PRODUCT",String(value.Browser||"").split("/")[0]);
                if(wsUrl){
                  const ws=new URL(wsUrl);
                  console.log("CDP_WS_HOST_EQUALS_HTTP",ws.hostname===url.hostname);
                  console.log("CDP_WS_PORT_EQUALS_HTTP",ws.port===url.port);
                }else console.log("CDP_WS_URL_MISSING");
              }catch(e){console.log("CDP_FETCH_ERROR_CLASS",e.name);return;}
              const wsClass=typeof WebSocket;
              console.log("WEBSOCKET_GLOBAL_KIND",wsClass);
              if(wsUrl&&wsClass==="function"){
                await new Promise(resolve=>{
                  let done=false;
                  const finish=(msg)=>{if(done)return;done=true;console.log("CDP_WS_HANDSHAKE",msg);resolve()};
                  const timer=setTimeout(()=>{try{sock.close()}catch{};finish("timeout")},7000);
                  let sock;
                  try{
                    sock=new WebSocket(wsUrl);
                    sock.onopen=()=>{clearTimeout(timer);try{sock.close()}catch{};finish("open")};
                    sock.onerror=()=>{clearTimeout(timer);finish("error")};
                    sock.onclose=()=>{clearTimeout(timer);finish("closed")};
                  }catch(e){clearTimeout(timer);finish("exception_"+e.name)}
                });
              }
            })().catch(e=>console.log("DIAGNOSTIC_JS_ERROR_CLASS",e.name));
            '''
            p=subprocess.run(["docker","exec","beonmeet-worker-five","node","-e",js],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=32)
            print("WORKER_CDP_PROBE_EXIT",p.returncode)
            for line in p.stdout.splitlines():
                if any(line.startswith(k) for k in ("CDP_","WEBSOCKET_","DIAGNOSTIC_")):
                    print(line[:150])
            print("WORKER_CDP_NETWORK_AUDIT_DONE")
            PY
