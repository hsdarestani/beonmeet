name: One-time guarded trusted Google Meet admission release

on:
  push:
    branches: [ops/guarded-trusted-google-meet-join-20261121]
    paths:
      - .github/workflows/release-trusted-meet-join-once.yml

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify, back up and deploy trusted join only when all customer sessions are idle
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 9m
          script: |
            set -eu
            umask 077
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST; exit 1;; esac
            test "$(id -u)" = 0
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 70 9
            cd /opt/beonmeet
            release=2124086f9a8b60171b402ac75e715204d1819286
            git fetch -q origin main
            git merge-base --is-ancestor "$release" FETCH_HEAD
            worker=beonmeet-worker-five
            browser=beonmeet-chrome-single
            overlay=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/usr/src/app/dist/bots/GoogleMeetBot.js"}}{{.Source}}{{end}}{{end}}' "$worker")
            case "$overlay" in /opt/beonmeet/*) : ;; *) echo UNKNOWN_SOURCE_OVERLAY;exit 1;; esac
            test -f "$overlay" && test ! -L "$overlay"
            grep -q 'const recordingQuality =' "$overlay"
            grep -q 'beOnMeetAskedToJoin' "$overlay"
            stage=$(mktemp -d /opt/beonmeet/.trusted-join-stage.XXXXXXXX)
            git show "$release:patches/patch_trusted_meet_join.py" > "$stage/patch.py"
            python3 -m py_compile "$stage/patch.py"
            python3 "$stage/patch.py" "$overlay" "$stage/GoogleMeetBot.fixed.js"
            image=$(docker inspect -f '{{.Config.Image}}' "$worker")
            docker run --rm --network none --memory=300m --cpus=.3 --entrypoint node               -v "$stage/GoogleMeetBot.fixed.js:/tmp/checked.js:ro" "$image" --check /tmp/checked.js
            echo VERIFIED_TRUSTED_JOIN_PATCH_AND_NODE_SYNTAX
            python3 - <<'PY'
            import json,subprocess,time,urllib.request
            from pathlib import Path
            def check():
                with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=7) as r:h=json.load(r)
                if not h.get("ok") or int(h.get("max_concurrent_meetings") or 0)!=5:
                    raise AssertionError("Controller is not healthy")
                for k in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                    if int(h.get(k) or 0):return False
                for p in (9124,9126):
                    with urllib.request.urlopen("http://127.0.0.1:"+str(p)+"/capacity",timeout=7) as r:d=json.load(r)
                    if int((d.get("data") or d).get("runningJobs") or 0):return False
                return True
            for i in range(43):
                if check():break
                if i==42:raise AssertionError("Customer meeting or delivery still active; no changes made")
                time.sleep(6)
            for n in ("camcam-shared-api-1","camcam-shared-pet-1","camcam-shared-archive-1","camcam-shared-petarchive-1"):
                assert subprocess.check_output(["docker","inspect","-f","{{.State.Health.Status}}",n],text=True).strip()=="healthy",n
            mem=int(next(x.split()[1] for x in Path("/proc/meminfo").read_text().splitlines() if x.startswith("MemAvailable:")))
            assert mem>=900000,"Host lacks memory headroom"
            print("TRUSTED_JOIN_DEPLOY_IDLE_AND_CAMCAM_PRECHECK_PASS")
            PY
            backup="/opt/beonmeet/.trusted-join-backup-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 700 "$backup"
            cp -p "$overlay" "$backup/GoogleMeetBot.before.js"
            test -s "$backup/GoogleMeetBot.before.js"
            changed=0
            complete=0
            rollback() {
              if [ "$changed" = 1 ] && [ "$complete" = 0 ];then
                echo ROLLING_BACK_TRUSTED_JOIN_WORKER
                cp -p "$backup/GoogleMeetBot.before.js" "$overlay"
                docker restart --time 20 "$worker" >/dev/null || true
              fi
              rm -rf "$stage"
            }
            trap rollback EXIT
            python3 - <<'PY'
            import json,urllib.request
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=5) as r:h=json.load(r)
            for key in ("free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs"):
                assert int(h.get(key) or 0)==0,"Controller became busy"
            for p in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(p)+"/capacity",timeout=5) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0,"Recorder became busy"
            print("IMMEDIATE_PRE_CHANGE_IDLE_RECHECK_PASS")
            PY
            changed=1
            cat "$stage/GoogleMeetBot.fixed.js" > "$overlay"
            docker restart --time 20 "$worker" >/dev/null
            ready=0
            for i in $(seq 1 25);do
              if curl -fsS --max-time 3 http://127.0.0.1:9126/capacity >/dev/null 2>&1;then ready=1;break;fi
              sleep 2
            done
            test "$ready" = 1
            docker exec "$worker" node --check /usr/src/app/dist/bots/GoogleMeetBot.js
            docker exec "$worker" sh -c 'grep -q GOOGLE_MEET_TRUSTED_JOIN_PATCH /usr/src/app/dist/bots/GoogleMeetBot.js'
            docker exec "$worker" sh -c 'grep -q "const knockConfirmed =" /usr/src/app/dist/bots/GoogleMeetBot.js'
            cmp -s "$overlay" "$stage/GoogleMeetBot.fixed.js"
            echo TRUSTED_PLAYWRIGHT_JOIN_PRODUCTION_CODE_VERIFIED
            # Real CDP protocol is tested, not just HTTP. Only when all jobs
            # are idle may we recover stalled dedicated Chrome.
            probe() {
              docker exec "$worker" node -e '
                (async()=>{
                  const {chromium}=require("playwright-extra");
                  const t=setTimeout(()=>process.exit(3),15500);
                  try{
                    const b=await chromium.connectOverCDP(process.env.GOOGLE_CHROME_CDP_URL,{timeout:12000});
                    clearTimeout(t);
                    process.exit(b.contexts().length>0?0:2);
                  }catch(e){clearTimeout(t);process.exit(4)}
                })();
              ' >/dev/null 2>&1
            }
            if probe; then
              echo PLAYWRIGHT_CDP_VERIFIED_NO_BROWSER_RESTART
            else
              python3 - <<'PY'
            import json,urllib.request
            for p in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(p)+"/capacity",timeout=5) as r:d=json.load(r)
                assert int((d.get("data") or d).get("runningJobs") or 0)==0
            PY
              echo CHROME_CDP_STALLED_RECOVERING_WHILE_IDLE
              docker restart --time 20 "$browser" >/dev/null
              for i in $(seq 1 17);do
                if probe;then
                  echo PLAYWRIGHT_CDP_VERIFIED_AFTER_CHROME_RECOVERY
                  break
                fi
                if [ "$i" -eq 17 ];then echo CDP_RECOVERY_NOT_VERIFIED; exit 1;fi
                sleep 4
              done
            fi
            curl -fsS --max-time 10 https://beonmeet.smarbiz.sbs/health >/dev/null
            for n in camcam-shared-api-1 camcam-shared-pet-1 camcam-shared-archive-1 camcam-shared-petarchive-1;do
              test "$(docker inspect -f '{{.State.Health.Status}}' "$n")" = healthy
            done
            complete=1
            trap - EXIT
            rm -rf "$stage"
            echo BEONMEET_TRUSTED_MEET_JOIN_PATCH_DEPLOY_SUCCESS
            echo CAMCAM_UNCHANGED_NO_CUSTOMER_RECORDINGS_INTERRUPTED
