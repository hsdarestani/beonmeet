name: Read-only BeOnMeet join incident audit

on:
  push:
    branches: [ops/read-only-live-join-audit-20261121]
    paths:
      - .github/workflows/read-only-join-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check worker and controller runtime without changing anything
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,urllib.request,json,datetime,collections
            now=datetime.datetime.now(datetime.timezone.utc)
            print("AUDIT_UTC",now.isoformat())
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=8) as r:d=json.load(r)
                print("WORKER_CAPACITY",port,json.dumps(d.get("data",d)))
            p=subprocess.run(["docker","logs","--since","2026-11-21T10:49:00Z","beonmeet-worker-five"],capture_output=True,text=True,timeout=20)
            terms=("Retry count:","Meeting job permanently failed","Meeting slot released","recording","joining","waiting","TimeoutError","Launching browser","Ask to join","meeting job finished","out of the meeting","Join request")
            events=[]
            for line in (p.stdout+p.stderr).splitlines():
                if not line.startswith("[2026-11-21T"):continue
                msg=line.split("] ",4)[-1].split(" {",1)[0]
                if any(t.lower() in msg.lower() for t in terms):
                    if "http" in msg or "@" in msg or len(msg)>130:msg="[REDACTED]"
                    events.append([line[1:24],msg])
            print("RECENT_WORKER_EVENTS",json.dumps(events[-75:]))
            print("CURRENT_IDLE_CHECK_DONE")
            PY
