name: Read-only BeOnMeet join incident audit

on:
  push:
    branches: [ops/read-only-live-join-audit-20261121]
    paths:
      - .github/workflows/read-only-join-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check worker and controller runtime without changing anything
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            echo "AUDIT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HOST_RECORDING_DIR:"
            stat -c 'mode=%a owner=%u group=%g type=%F' /dev/shm/beonmeet || true
            echo "HOST_SHM_CAPACITY:"
            df -h /dev/shm | tail -n 1
            for name in beonmeet-worker-five beonmeet-worker-single; do
              echo "WORKER=$name"
              docker inspect --format 'configured_user={{.Config.User}}' "$name" || true
              docker inspect --format '{{range .Mounts}}mount_type={{.Type}} target={{.Destination}} readwrite={{.RW}} source_type=host_bind{{println}}{{end}}' "$name" || true
              docker exec "$name" sh -c 'id; stat -c "recordings_mode=%a owner=%u group=%g type=%F" /recordings; test -w /recordings && echo writable=yes || echo writable=no' || true
            done
            echo "PERMISSIONS_AUDIT_FINISHED"
