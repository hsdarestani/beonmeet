name: Read-only BeOnMeet join incident audit

on:
  push:
    branches: [ops/read-only-live-join-audit-20261121]
    paths:
      - .github/workflows/read-only-join-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check worker and controller runtime without changing anything
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess
            src=subprocess.check_output(["docker","exec","beonmeet-worker-five","cat","/usr/src/app/dist/bots/GoogleMeetBot.js"],timeout=22).decode()
            for marker,before,after in [
                ("Clicking ask to join button",200,2200),
                ("Success clicked using",800,1600),
                ("const notifyBeOnMeetWaitingForAdmission",80,1400),
                ("await notifyBeOnMeetWaitingForAdmission()",650,450)]:
                at=src.find(marker)
                print("MARKER",marker,"FOUND",at)
                if at>=0:print("JS_SNIPPET_START",marker,"\n",src[max(0,at-before):at+after],"\nJS_SNIPPET_END")
            print("WORKER_JOIN_HOOK_CONTEXT_DONE")
            PY
