name: Read-only BeOnMeet join incident audit

on:
  push:
    branches: [ops/read-only-live-join-audit-20261121]
    paths:
      - .github/workflows/read-only-join-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check worker and controller runtime without changing anything
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,datetime,collections,json
            def run(args):
                p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=42)
                return p.stdout
            now=datetime.datetime.now(datetime.timezone.utc).isoformat()
            print("AUDIT_UTC",now)
            raw=run(["docker","logs","--since","2026-11-21T10:39:00Z","beonmeet-worker-five"])
            names={}
            events=[]
            for line in raw.splitlines():
                if not line.startswith("[2026-11-21T"):continue
                at=line[1:24]
                if "[correlationId: " in line:
                    ident=line.split("[correlationId: ",1)[1].split("]",1)[0]
                    if ident not in names:names[ident]="job"+str(len(names)+1)
                    job=names[ident]
                else:job="shared"
                message=line.split("] ",4)[-1].split(" {",1)[0].strip()
                if len(message)>130 or "http://" in message or "https://" in message or "@" in message:
                    message="[REDACTED_MESSAGE]"
                key=message.lower()
                if any(s in key for s in ("meeting","join","chrome","page","record","attempt","error","fail","retry","wait","input","button","enter","admit","start","launch","playwright","session","browser","modal","profile","selector")):
                    err_type=""
                    for code in ("TimeoutError","TargetClosedError","EACCES","ECONNREFUSED","ENOSPC","NotFoundError","ERR_NAME_NOT_RESOLVED","ERR_CONNECTION"):
                        if code in line:err_type=" "+code
                    events.append([at,job,message+err_type])
            print("WORKER_JOBS",len(names))
            print("WORKER_EVENTS",json.dumps(events[-100:],ensure_ascii=True))
            ctl=run(["journalctl","-u","beonmeet-controller","--since","2026-11-21 10:38:00 UTC","--no-pager","-o","short-iso"])
            for line in ctl.splitlines()[-80:]:
                at=line[:25]
                for endpoint in ("/internal/recording-started","/internal/waiting-for-admission","/internal/recording-ready","/internal/recording-upload"):
                    if endpoint in line:
                        code="200" if '" 200 ' in line else ("4xx/5xx" if '" 4' in line or '" 5' in line else "unknown")
                        print("CONTROLLER_CALLBACK",at,endpoint,code)
                for reason in ("meeting dispatch error","meeting dispatch rejected","telegram loop error","queue loop error","delivery error"):
                    if reason in line.lower():print("CONTROLLER_ERROR",at,reason)
            print("JOIN_TIMELINE_READ_ONLY_DONE")
            PY
