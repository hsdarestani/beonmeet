name: Read-only BeOnMeet join incident audit

on:
  push:
    branches: [ops/read-only-live-join-audit-20261121]
    paths:
      - .github/workflows/read-only-join-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check worker and controller runtime without changing anything
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) exit 1 ;; esac
            cd /opt/beonmeet
            python3 - <<'PY'
            import os,json,pathlib,subprocess,sqlite3
            from pathlib import Path
            def safe(s):
                return s if s in ("/recordings","/dev/shm/beonmeet","/tmp/beonmeet-recordings") else ("[OTHER_PATH]" if s else "[UNSET]")
            pid=subprocess.check_output(["systemctl","show","-p","MainPID","--value","beonmeet-controller"],text=True).strip()
            raw=Path("/proc/"+pid+"/environ").read_bytes().split(b"\\x00")
            env=dict((x.split(b"=",1)[0].decode(errors="replace"),x.split(b"=",1)[1].decode(errors="replace")) for x in raw if b"=" in x)
            root=env.get("RECORDING_TMP_DIR","/recordings")
            print("CONTROLLER_RECORDING_ROOT",safe(root))
            for pth in ("/recordings","/dev/shm/beonmeet"):
                p=Path(pth)
                print("HOST_MOUNT",safe(pth),"exists",p.exists(),"symlink",p.is_symlink(),
                      "is_dir",p.is_dir(),"realpath",safe(os.path.realpath(pth)) if p.exists() else "[MISSING]")
            for name in ("beonmeet-worker-five","beonmeet-worker-single"):
                out=subprocess.check_output(["docker","inspect","--format","{{json .Config.Env}}",name],text=True)
                parts=dict(v.split("=",1) for v in json.loads(out) if "=" in v)
                print("WORKER",name,"ROOT",safe(parts.get("RECORDING_TMP_DIR","/recordings")))
            live=Path("app/main.py").read_text()
            print("LIVE_GHOST_SUCCESS_BRANCH_PRESENT","if not raw_path.exists() and pending_id not in state.setdefault" in live)
            print("LIVE_UPLOAD_RECEIVER_PRESENT",'@app.post("/internal/recording-ready")' in live)
            if Path("data/beonmeet.db").exists():
                db=sqlite3.connect("file:/opt/beonmeet/data/beonmeet.db?mode=ro",uri=True)
                n=db.execute("SELECT COUNT(*) FROM recordings WHERE created_at >= ? AND created_at <= ?",("2026-11-21T10:02:00","2026-11-21T10:08:00")).fetchone()[0]
                print("RECORDINGS_DB_AT_SESSION",n)
            print("READONLY_CONTROLLER_FILE_MAPPING_CHECK_DONE")
            PY
