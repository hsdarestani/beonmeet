name: Read-only BeOnMeet join incident audit

on:
  push:
    branches: [ops/read-only-live-join-audit-20261121]
    paths:
      - .github/workflows/read-only-join-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check worker and controller runtime without changing anything
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess
            js="/usr/src/app/dist/bots/GoogleMeetBot.js"
            source=subprocess.check_output(["docker","exec","beonmeet-worker-five","cat",js],timeout=20).decode()
            print("COMPILED_JS_BYTES",len(source))
            needles=["Success clicked using", "notifyBeOnMeetWaitingForAdmission", "WAITING_FOR_HOST_TO_ADMIT_BOT", "Google Meet pre-join controls are not ready yet", "Join now", "Ask to join"]
            for word in needles:
                pos=source.find(word)
                print("NEEDLE",word,"COUNT",source.count(word),"POS",pos)
                if pos>=0:
                    snippet=source[max(0,pos-560):pos+460]
                    print("STATIC_SOURCE_CONTEXT_START",word)
                    print(snippet)
                    print("STATIC_SOURCE_CONTEXT_END")
            print("COMPILED_RECORDER_STATIC_INSPECTION_PASS")
            PY
