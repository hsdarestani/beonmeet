name: Read-only BeOnMeet join incident audit

on:
  push:
    branches: [ops/read-only-live-join-audit-20261121]
    paths:
      - .github/workflows/read-only-join-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check worker and controller runtime without changing anything
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import datetime,subprocess,json,collections,urllib.request
            from pathlib import Path
            print("VERIFY_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            state=json.loads(Path("data/state.json").read_text())
            counts=collections.Counter(str(v.get("status","unknown")) for v in state.get("launched_events",{}).values() if isinstance(v,dict))
            print("STATE_COUNTS",json.dumps(dict(counts)))
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as r:v=json.load(r)
                print("CAPACITY",port,json.dumps(v.get("data",v)))
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=5) as r:h=json.load(r)
            print("CONTROLLER_HEALTH",json.dumps({k:h.get(k) for k in ("ok","free_queue","premium_queue","pending_delivery_jobs","healthy_free_workers")}))
            page=subprocess.run(["docker","exec","beonmeet-chrome-single","sh","-c","curl -fsS --max-time 3 http://127.0.0.1:9222/json/list"],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=8)
            if page.returncode==0:
                targets=json.loads(page.stdout)
                categories=collections.Counter()
                for x in targets:
                    u=str(x.get("url","")).lower();title=str(x.get("title","")).lower()
                    if "meet.google.com" in u:cat="google_meet_tab"
                    elif "accounts.google.com" in u:
                        cat="accounts_sign_in_screen" if "sign in" in title or "sign-in" in title else "google_accounts_page"
                    elif "chrome://" in u:cat="chrome_internal"
                    else:cat="other_page"
                    categories[cat]+=1
                print("CHROME_PAGE_TYPES",json.dumps(dict(categories)))
            else:print("CHROME_PAGE_TYPES","unavailable")
            print("POST_DEPLOY_READONLY_VERIFICATION_COMPLETE")
            PY
