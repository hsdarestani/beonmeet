name: Read-only audit of BeOnMeet 16:28 Tehran test
on:
  push:
    branches: [ops/audit-1628-join-20261121]
    paths: [.github/workflows/inspect-1628-join.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect exact 12:58 UTC admission lifecycle
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,re,urllib.parse
            p=subprocess.run(["docker","logs","--since","2026-11-21T12:57:00Z","--until","2026-11-21T13:12:00Z","beonmeet-worker-five"],capture_output=True,text=True,timeout=24)
            lines=(p.stdout+"\n"+p.stderr).splitlines()
            targets=("Google Meet Bot was redirected away","Cant finish wait at the lobby check","Meet lobby state unconfirmed","Closing the browser on error")
            for idx,line in enumerate(lines):
                if not any(x in line for x in targets):continue
                window="\n".join(lines[idx:idx+24])
                ts=line[1:24] if line.startswith("[2026") else "unknown"
                urlmatch=re.search(r'(?:currentUrl|redirectedFromMeetUrl)[^"\n]*["\x27]\s*:\s*["\x27]([^"\x27\n]+)',window)
                url=urlmatch.group(1) if urlmatch else ""
                parsed=urllib.parse.urlparse(url)
                hostname=parsed.hostname or ""
                if hostname.endswith("accounts.google.com"):cat="google_account"
                elif hostname.endswith("meet.google.com"):cat="google_meet"
                elif hostname.endswith("google.com"):cat="other_google"
                elif url.startswith("chrome-error:"):cat="chrome_error"
                elif url.startswith("about:"):cat="about"
                elif url.startswith("https:"):cat="other_https"
                elif url:cat="unknown_scheme"
                else:cat="not_in_24_lines"
                bodymatch=re.search(r'(?:bodyText|redirectedFromMeetBodyText)[^"\n]*["\x27]\s*:\s*["\x27]([^"\x27\n]*)',window)
                body=bodymatch.group(1) if bodymatch else ""
                markers=[m for m in ("sign in","you cannot join","can't join","not allowed","something went wrong","sorry","request to join","pending","Google Meet","meeting","refresh","rejoin","error","log in","access","can't connect","contact the meeting host") if m.lower() in body.lower()]
                print("REDIRECT_LOG_STRUCT",json.dumps({"at":ts,"event":("redirect" if "redirected away" in line else "other"),"window_lines":len(lines[idx:idx+24]),"line_len":len(line),"leading_brace":line.find("{"),"current_url_category":cat,"path_category":("auth" if any(t in parsed.path.lower() for t in ("login","signin","auth")) else ("sorry" if "sorry" in parsed.path.lower() else ("other" if parsed.path else "none"))),"body_markers":markers,"body_chars_sample":len(body),"keys_found":list(dict.fromkeys(re.findall(r'["]([A-Za-z][A-Za-z0-9_]+)["]\s*:',window)))[:25]}))
            print("REDIRECT_LOG_INSPECTION_COMPLETE")
            PY
