name: Read-only audit of BeOnMeet 16:28 Tehran test
on:
  push:
    branches: [ops/audit-1628-join-20261121]
    paths: [.github/workflows/inspect-1628-join.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect exact 12:58 UTC admission lifecycle
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,urllib.parse
            p=subprocess.run(["docker","logs","--since","2026-11-21T12:59:00Z","--until","2026-11-21T13:06:00Z","beonmeet-worker-five"],capture_output=True,text=True,timeout=25)
            for line in (p.stdout+"\n"+p.stderr).splitlines():
                if "Google Meet Bot was redirected away from the meeting while waiting for admission" not in line:continue
                ix=line.find("{")
                data=json.loads(line[ix:]) if ix>=0 else {}
                parsed=urllib.parse.urlparse(str(data.get("currentUrl") or ""))
                print("REDIRECT_HOST_CLASS",parsed.hostname or "unknown")
                print("REDIRECT_PATH_CATEGORY","auth" if any(x in parsed.path.lower() for x in ("signin","login","auth")) else ("meet" if "meet" in parsed.path.lower() else ("other" if parsed.path else "root")))
                print("REDIRECT_BODY_LENGTH",len(str(data.get("bodyText") or "")))
            print("REDIRECT_HOST_CLASSIFICATION_DONE")
            PY
