name: Read-only audit of BeOnMeet 16:28 Tehran test
on:
  push:
    branches: [ops/audit-1628-join-20261121]
    paths: [.github/workflows/inspect-1628-join.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect exact 12:58 UTC admission lifecycle
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json
            p=subprocess.run(["docker","logs","--since","2026-11-21T12:57:00Z","--until","2026-11-21T13:05:30Z","beonmeet-worker-five"],capture_output=True,text=True,timeout=25)
            msgs=[]
            for line in (p.stdout+"\n"+p.stderr).splitlines():
                if not line.startswith("[2026-11-21T"):continue
                msg=line.split("] ",4)[-1].split(" {",1)[0].strip()
                if "http" not in msg and "@" not in msg and len(msg)<170:msgs.append([line[1:24],msg])
            print("WORKER_MESSAGES",json.dumps(msgs[-100:]))
            code=subprocess.run(["docker","exec","beonmeet-worker-five","cat","/usr/src/app/dist/bots/GoogleMeetBot.js"],capture_output=True,text=True,timeout=20).stdout
            i=code.find("let waitTimeout;")
            if i<0:raise RuntimeError("Join loop not found")
            print("JOIN_LOOP_SOURCE",code[i:i+9000])
            print("JOIN_DIAG_COMPLETE")
            PY
