name: BeOnMeet VPS 24GB independent credential verification
on:
  push:
    branches: [ops/check-vps-after-upgrade-alt-credential-20261122]
    paths: [.github/workflows/ops-check-vps-alternative-credential.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read RAM CPU and controller only using existing deployment password
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.PASS }}
          timeout: 20s
          command_timeout: 90s
          script: |
            set -eu
            case " $(hostname -I) " in *" 143.20.60.195 "*) : ;; *) echo WRONG_HOST;exit 1;; esac
            python3 - <<'PY'
            import os,json,urllib.request,subprocess
            from pathlib import Path
            m={}
            for x in Path('/proc/meminfo').read_text().splitlines():
                if x.startswith(('MemTotal:','MemAvailable:','SwapTotal:')):
                    a,b=x.split(':',1);m[a]=int(b.split()[0])
            print('REAL_VPS_RAM_GIB',round(m['MemTotal']/1048576,2))
            print('REAL_VPS_RAM_FREE_GIB',round(m['MemAvailable']/1048576,2))
            print('REAL_VPS_24GB_CLASS',m['MemTotal']>=22*1048576)
            print('REAL_VPS_VCPU',os.cpu_count())
            print('REAL_VPS_ROOT_DISK',subprocess.check_output(['df','-h','/'],text=True).splitlines()[-1].split()[1:4])
            print('REAL_VPS_LOAD',Path('/proc/loadavg').read_text().split()[:3])
            try:
                with urllib.request.urlopen('http://127.0.0.1:8109/health',timeout=7) as r:h=json.load(r)
                print('REAL_VPS_CONTROLLER',json.dumps({k:h.get(k) for k in ('ok','free_queue','premium_queue','active_delivery_jobs','pending_delivery_jobs','max_concurrent_meetings')}))
            except Exception as exc:print('REAL_VPS_CONTROLLER_ERROR',type(exc).__name__)
            print('REAL_VPS_CHECK_COMPLETE')
            PY

# New push to load current PASS after credential rotation on 2026-11-22.
