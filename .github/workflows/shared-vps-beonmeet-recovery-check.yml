name: Read-only BeOnMeet shared VPS recovery check
on:
  push:
    branches: [ops/shared-vps-source-audit-20261022]
    paths: [.github/workflows/shared-vps-beonmeet-recovery-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read server health without modifying services or secrets
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 3m
          script: |
            set -u
            echo '=== RESOURCE STATUS ==='
            uptime
            free -m
            df -h /
            df -i /
            echo '=== SYSTEM SERVICES ==='
            for s in beonmeet-controller camcam rednotedownloader nginx docker; do printf '%s=' "$s";systemctl is-active "$s" || true;done
            echo '=== BEONMEET CONFIG FLAGS ==='
            cd /opt/beonmeet || exit 0
            python3 - <<'PY'
            from pathlib import Path
            p=Path('.env')
            if not p.exists(): print('env_file=MISSING')
            else:
                values=dict(line.split('=',1) for line in p.read_text().splitlines() if '=' in line and not line.startswith('#'))
                for k in ('BEONMEET_STAGING_NO_POLL','FREE_MEETING_SLOTS','PREMIUM_MEETING_SLOTS','AUTOSCALE_ENABLED','GOOGLE_REDIRECT_URI'):
                    print(k+'='+values.get(k,'NOT_SET'))
                for k in ('TELEGRAM_BOT_TOKEN','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','ADMINUSER'):
                    print(k+'='+('PRESENT' if values.get(k) else 'MISSING'))
            print('sqlite_exists='+str(Path('data/beonmeet.db').exists()))
            PY
            echo '=== LOCAL CHECKS (HTTP CODES ONLY) ==='
            for u in http://127.0.0.1:8109/health http://127.0.0.1:9124/health http://127.0.0.1:9124/capacity https://beonmeet.smarbiz.sbs/health; do printf '%s ' "$u"; curl -L -sS --max-time 8 -o /dev/null -w '%{http_code}\n' "$u" || true; done
            echo '=== RELEVANT CONTAINERS ==='
            docker ps --format '{{.Names}} {{.Status}}' 2>/dev/null | grep -Ei 'beonmeet|camcam|redis' | head -25 || true
            echo '=== DNS ==='
            getent ahostsv4 beonmeet.smarbiz.sbs | head -2 || true
            echo '=== NGINX ==='
            nginx -t 2>&1 | tail -3 || true

            echo '=== DISK BREAKDOWN ==='
            for p in /var/lib/docker /var/log /var/log/journal /opt /root /tmp /var/cache/apt /opt/beonmeet/data; do test -e "$p" && du -shx "$p" 2>/dev/null || true; done
            echo '=== DOCKER DISK ==='
            docker system df 2>/dev/null || true
            echo '=== SHARED MEMORY ==='
            df -h /dev/shm
            echo '=== HEALTH FLAGS (NO TOKENS/USER INFO) ==='
            python3 - <<'PY'
            import json,urllib.request
            for u in ('http://127.0.0.1:8109/health','http://127.0.0.1:9124/capacity'):
                try:
                    d=json.load(urllib.request.urlopen(u,timeout=5))
                    allow=('ok','calendar_connected','redis_state','database_backend','free_meeting_slots','premium_reserved_slots','healthy_free_workers','healthy_premium_workers','recorder_account_profiles','active_recordings','runningJobs','maxConcurrentJobs','availableSlots','status','autoscaler_enabled','telegram_enabled')
                    if 'capacity' in u: d=d.get('data') or d
                    print(u, {k:d[k] for k in allow if k in d})
                except Exception as e: print(u,type(e).__name__)
            PY
            echo '=== TELEGRAM TOKEN VALIDITY (NO TOKEN OUTPUT) ==='
            python3 - <<'PY'
            from pathlib import Path
            import json,urllib.request
            d=dict(l.split('=',1) for l in Path('.env').read_text().splitlines() if '=' in l and not l.startswith('#'))
            t=d.get('TELEGRAM_BOT_TOKEN')
            try:
                ans=json.load(urllib.request.urlopen('https://api.telegram.org/bot'+t+'/getMe',timeout=8))
                print('getMe_ok='+str(ans.get('ok')),'username='+str((ans.get('result') or {}).get('username')))
            except Exception as e: print('getMe_failed='+type(e).__name__)
            PY
            echo '=== SQLITE COUNTS ONLY ==='
            python3 - <<'PY'
            import sqlite3
            from pathlib import Path
            p=Path('data/beonmeet.db')
            if p.exists():
                con=sqlite3.connect(str(p))
                tables=[r[0] for r in con.execute("select name from sqlite_master where type='table' and name not like 'sqlite_%'")]
                for t in tables:
                    try: print('table',t,'rows',con.execute('select count(*) from "'+t.replace('"','""')+'"').fetchone()[0])
                    except Exception: pass
            PY

            echo '=== VAR LIB SUBDIRECTORIES MB ==='
            du -xm --max-depth=1 /var/lib 2>/dev/null | sort -n | tail -20 || true
            echo '=== SRV SUBDIRECTORIES MB ==='
            du -xm --max-depth=1 /srv 2>/dev/null | sort -n | tail -20 || true
            echo '=== CONTAINERD SUBDIRECTORIES MB ==='
            du -xm --max-depth=1 /var/lib/containerd 2>/dev/null | sort -n | tail -20 || true
