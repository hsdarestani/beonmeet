name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,urllib.request,subprocess
            from pathlib import Path
            state=json.loads(Path("data/state.json").read_text())
            p=list((state.get("pending_deliveries") or {}).values())
            print("PENDING_COUNT",len(p))
            for item in p:
                if not isinstance(item,dict):continue
                print("PENDING_FLAGS",json.dumps({"attempts":item.get("attempts"),"video":item.get("video_delivered"),"audio":item.get("audio_delivered"),"transcript":item.get("transcript_delivered")}))
            r=subprocess.run(["/opt/beonmeet/.venv/bin/python","-c","from faster_whisper import WhisperModel; import av,ctranslate2; print('runtime_deps_healthy')"],capture_output=True,text=True,timeout=18)
            print("WHISPER_IMPORT_HEALTH",r.returncode==0)
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as resp:d=json.load(resp)
                print("RUNNING_JOBS",port,(d.get("data",d)).get("runningJobs"))
            print("POST_DEPENDENCY_RECOVERY_STATUS_DONE")
            PY
