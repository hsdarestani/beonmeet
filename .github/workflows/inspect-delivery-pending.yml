name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,os,subprocess,stat
            from pathlib import Path
            state=json.loads(Path("data/state.json").read_text())
            for x in list((state.get("pending_deliveries") or {}).values())[-5:]:
                if not isinstance(x,dict):continue
                v=str(x.get("file_path") or x.get("source_path") or x.get("raw_path") or "")
                p=Path(v) if v else None
                if not p or not p.is_file():continue
                print("MEDIA_OWNER_UID",p.stat().st_uid,"MEDIA_OWNER_GID",p.stat().st_gid)
                for label,part in (("recording_root",Path("/recordings")),("source_parent",p.parent)):
                    st=part.stat()
                    probe=subprocess.run(["runuser","-u","beonmeet","--","test","-w",str(part)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=6)
                    print("DIR_PERMISSIONS",label,{"mode":oct(stat.S_IMODE(st.st_mode)),"uid":st.st_uid,"gid":st.st_gid,"controller_can_write":probe.returncode==0})
                out=p.with_suffix(".mp3")
                print("DERIVED_MP3_EXISTS",out.exists())
                if out.exists():
                    st=out.stat()
                    print("DERIVED_MP3_META",{"bytes":st.st_size,"mode":oct(stat.S_IMODE(st.st_mode)),"uid":st.st_uid,"gid":st.st_gid})
            print("PENDING_OUTPUT_DIRECTORY_PERMISSIONS_CHECK_DONE")
            PY
