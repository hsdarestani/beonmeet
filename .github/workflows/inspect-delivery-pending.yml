name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,datetime
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            js=r"""
            const wsMod=(()=>{
              try{return require('ws');}catch(e){console.log('PAGE_CDP_WS_MODULE_MISSING',e.name);return null;}
            })();
            (async()=>{
              if(!wsMod)return;
              let timer,socket,done=false;
              function finish(type,data=''){
                if(done)return;done=true;
                console.log('DIRECT_PAGE_CDP_RESULT',type,typeof data==='string'?data.slice(0,1500):JSON.stringify(data).slice(0,1500));
                try{socket?.close()}catch{}
                clearTimeout(timer);
              }
              const base=new URL(process.env.GOOGLE_CHROME_CDP_URL);
              try{
                const response=await fetch(base.href.replace(/\/$/,'')+'/json/list');
                const targets=await response.json();
                const target=targets.find(x=>String(x.url||'').includes('cru-ggpe-nwi') && x.type==='page');
                if(!target){console.log('DIRECT_PAGE_CDP_NO_MATCHED_TAB');return;}
                const ws=new URL(target.webSocketDebuggerUrl);
                ws.hostname=base.hostname;ws.port=base.port;
                console.log('DIRECT_PAGE_CDP_TARGET_FOUND',true);
                timer=setTimeout(()=>finish('timeout'),8500);
                socket=new wsMod(ws.href,{handshakeTimeout:6000});
                socket.on('open',()=>{
                   const evaluator=function(){
                     const txt=(document.body?.innerText||'').toLowerCase();
                     const labels=Array.from(document.querySelectorAll('button')).map(b=>String(b.getAttribute('aria-label')||b.innerText||'').toLowerCase());
                     const markers={
                       ask_to_join:txt.includes('ask to join'),
                       waiting_to_be_let_in:txt.includes('waiting to be let in'),
                       waiting_for_someone:txt.includes('someone in the call'),
                       wait_to_join:txt.includes('waiting to join'),
                       asking_to_join:txt.includes('asking to join'),
                       asked_to_join:txt.includes('asked to join'),
                       someone_will_let_you_in:txt.includes('let you in'),
                       approval:txt.includes('approval'),
                       request_sent:txt.includes('request sent'),
                       cant_join:txt.includes("can't join"),
                       denied:txt.includes('denied'),
                       rejoin:txt.includes('rejoin'),
                       waiting:txt.includes('waiting'),
                       try_again:txt.includes('try again'),
                       host:txt.includes('host'),
                       join_now:txt.includes('join now'),
                       disconnect:txt.includes('disconnected'),
                       meeting_end:txt.includes('meeting has ended'),
                       still_joining:txt.includes('still joining'),
                       not_allowed:txt.includes('not allowed')
                     };
                     const buttons={
                       ask_to_join:labels.some(t=>t.includes('ask to join')),
                       cancel_request:labels.some(t=>t.includes('cancel request')),
                       leave_call:labels.some(t=>t.includes('leave call')),
                       join_now:labels.some(t=>t.includes('join now')),
                       retry:labels.some(t=>t.includes('retry'))
                     };
                     return {markers,buttons,document_visibility:document.visibilityState,document_ready:document.readyState,body_length:txt.length,button_count:labels.length};
                   };
                   socket.send(JSON.stringify({id:42,method:'Runtime.evaluate',params:{expression:'('+evaluator.toString()+')()',returnByValue:true}}));
                });
                socket.on('message',v=>{
                  try{
                    const data=JSON.parse(String(v));
                    if(data.id!==42)return;
                    const payload=data.result?.result?.value || null;
                    finish(payload?'success':'empty',payload);
                  }catch(e){finish('parse_error',e.name)}
                });
                socket.on('error',e=>finish('socket_error_class',e.name));
                socket.on('close',()=>{if(!done)finish('closed')});
              }catch(e){finish('setup_error_class',e.name)}
            })().then(()=>{});
            """
            p=subprocess.run(["docker","exec","beonmeet-worker-five","node","-e",js],capture_output=True,text=True,timeout=24)
            print("CDP_PAGE_QUERY_EXIT",p.returncode)
            for line in p.stdout.splitlines():
                if line.startswith(("DIRECT_PAGE_CDP_","PAGE_CDP_WS_")):print(line[:1800])
            print("DIRECT_PAGE_CDP_AUDIT_COMPLETE")
            PY
