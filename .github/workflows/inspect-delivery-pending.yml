name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import collections,datetime,json,subprocess,urllib.request
            from pathlib import Path
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            state=json.loads(Path("data/state.json").read_text())
            pending=state.get("pending_deliveries") or {}
            print("PENDING_COUNT",len(pending))
            for val in list(pending.values())[-4:]:
                entry=str(val.get("file_path") or val.get("source_path") or val.get("raw_path") or "")
                p=Path(entry) if entry else None
                if not p or not p.is_file():continue
                cmd=["ffprobe","-hide_banner","-v","error","-show_entries","format=duration,bit_rate,format_name:stream=codec_type,codec_name,width,height,r_frame_rate,channels,sample_rate","-of","json",str(p)]
                res=subprocess.run(cmd,capture_output=True,text=True,timeout=20)
                if res.returncode==0:
                    dat=json.loads(res.stdout)
                    print("PENDING_MEDIA_FORMAT",json.dumps(dat))
                else:
                    print("PENDING_MEDIA_FORMAT","ffprobe_failed","returncode",res.returncode)
            h=urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=5)
            d=json.load(h)
            print("PENDING_ACTIVE_COUNTERS",json.dumps({k:d.get(k) for k in ("pending_delivery_jobs","active_delivery_jobs","ok")}))
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as r:x=json.load(r)
                print("ACTIVE_RECORDER",port,int((x.get("data",x)).get("runningJobs") or 0))
            print("PENDING_MEDIA_AUDIT_FINISHED")
            PY
