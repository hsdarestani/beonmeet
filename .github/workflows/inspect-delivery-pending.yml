name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import os,subprocess,json,urllib.request,datetime,re
            from pathlib import Path
            lock=Path("/var/lock/pars-vds-bot-deploy.lock")
            print("LOCK_DIAG_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            st=lock.stat()
            print("LOCK_FILE_INODE",st.st_ino)
            owners=[]
            for proc in Path("/proc").iterdir():
                if not proc.name.isdecimal():continue
                fd_dir=proc/"fd"
                try:
                    descriptors=fd_dir.iterdir()
                except (OSError,PermissionError):continue
                for fd in descriptors:
                    try:
                        target=fd.resolve(strict=False)
                        if str(target)==str(lock.resolve()):
                            com=(proc/"comm").read_text().strip()
                            status=(proc/"status").read_text()
                            ppid=re.search(r"PPid:\s*(\d+)",status)
                            owners.append({"pid":int(proc.name),"ppid":int(ppid.group(1)) if ppid else -1,"comm":com,"fd":fd.name})
                    except (OSError,PermissionError):continue
            print("LOCK_OPEN_PROCESS_DESCRIPTORS",json.dumps(owners[:60]))
            for line in Path("/proc/locks").read_text().splitlines():
                if str(st.st_ino) in line:
                    print("KERNEL_LOCK_SUMMARY",line[:140])
            p=subprocess.run(["docker","ps","-a","--format","{{.Names}}|{{.Status}}"],capture_output=True,text=True,timeout=12)
            print("QA_CONTAINERS",[x for x in p.stdout.splitlines() if "beonmeet-five-qa" in x])
            for port in (9124,9126):
                try:
                    with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as r:x=json.load(r)
                    print("WORKER_RUNNING",port,int((x.get("data") or x).get("runningJobs") or 0))
                except Exception as e:print("WORKER_STATUS_ERROR",port,type(e).__name__)
            print("LOCK_OWNER_READONLY_AUDIT_DONE")
            PY
