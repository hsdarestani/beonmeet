name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,sys,site,stat,os,glob
            from pathlib import Path
            # Derive exact venv site-packages path, never show personal paths.
            p=subprocess.run([".venv/bin/python","-c","import sysconfig;print(sysconfig.get_paths()['purelib'])"],capture_output=True,text=True)
            root=Path(p.stdout.strip())
            print("PYENV_SITEPKG_EXISTS",root.is_dir())
            for name in ("faster_whisper","av","ctranslate2","tokenizers","huggingface_hub","onnxruntime","coloredlogs","humanfriendly","flatbuffers"):
                matches=[x for x in root.iterdir() if x.name==name or x.name.startswith(name.replace("_","-")+"-")]
                for x in matches[:3]:
                    st=x.stat()
                    print("INSTALLED_PACKAGE_PERMISSIONS",name,"dir" if x.is_dir() else "file",oct(stat.S_IMODE(st.st_mode)),"uid",st.st_uid,"gid",st.st_gid)
            for name in ("faster_whisper","ctranslate2"):
                path=root/name
                if path.is_dir():
                    for child in list(path.iterdir())[:3]:
                        st=child.stat()
                        print("PACKAGE_CHILD_MODE",name,oct(stat.S_IMODE(st.st_mode)),"uid",st.st_uid,"type","dir" if child.is_dir() else "file")
            result=subprocess.run(["runuser","-u","beonmeet","--",".venv/bin/python","-c","import faster_whisper,sys;print('module_file',faster_whisper.__file__,'path_count',len(faster_whisper.__path__))"],capture_output=True,text=True)
            print("SERVICE_IMPORT_EXIT",result.returncode)
            print("SERVICE_IMPORT_STDERR_CLASS",result.stderr.splitlines()[-1][:120] if result.stderr else "none")
            print("WHISPER_PACKAGE_ACL_DIAG_DONE")
            PY
