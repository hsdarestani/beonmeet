name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import os,subprocess,json
            from pathlib import Path
            markers=("beonmeet-five-balanced","beonmeet-five-qa-chrome","qa-five-balanced-av","five_sustained_av_smoke")
            for pid in (2655475,2655478,2656085):
                p=Path("/proc")/str(pid)
                if not p.exists():print("HOST_PID",pid,"GONE");continue
                b=(p/"cmdline").read_bytes().replace(b"\x00",b" ").decode(errors="replace")
                st=(p/"status").read_text()
                info={}
                for key in ("Name","State","PPid"):
                    for line in st.splitlines():
                        if line.startswith(key+":"):
                            info[key]=line.split(":",1)[1].strip()
                info["qa_marker"]=any(x in b for x in markers)
                info["docker_exec"]=("docker exec" in b)
                print("HOST_PID",pid,json.dumps(info))
            p=subprocess.run(["docker","ps","-a","--filter","name=beonmeet-five-qa-chrome","--format","{{.Names}}|{{.State}}|{{.Status}}"],capture_output=True,text=True,timeout=10)
            print("QA_CONTAINER",p.stdout.strip().splitlines())
            r=subprocess.run(["docker","exec","beonmeet-worker-five","sh","-c","for p in /proc/[0-9]*/cmdline; do grep -q 'beonmeet-five-balanced-qa.js' \u0022$p\u0022 2>/dev/null && echo \u0022$p\u0022; done"],capture_output=True,text=True,timeout=12)
            print("QA_WORKER_PROC_MATCHES_COUNT",len(r.stdout.splitlines()))
            print("EXACT_QA_ORPHAN_AUDIT_COMPLETE")
            PY
