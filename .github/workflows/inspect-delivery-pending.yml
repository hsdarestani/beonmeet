name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess
            p=subprocess.run(["docker","exec","beonmeet-worker-five","cat","/usr/src/app/dist/bots/GoogleMeetBot.js"],capture_output=True,text=True,timeout=22)
            assert p.returncode==0
            s=p.stdout
            markers=[
             ("prejoin_click","Success clicked using"),
             ("lobby_helper","const notifyBeOnMeetWaitingForAdmission"),
             ("admission_notice","if (beOnMeetAskedToJoin)"),
             ("waiting_loop","let waitTimeout;"),
             ("unable_to_join","Meeting join failed"),
             ("cancel_wait","waiting for the host to admit"),
             ("prejoin_wait","Waiting for Google Meet pre-join controls"),
             ("join_true","hasJoined"),
             ("is_in_meeting","isInMeeting")
            ]
            for name,needle in markers:
                i=s.find(needle)
                print("COMPILED_JOIN_MARKER",name,i)
                if i>=0:
                    left=260 if name not in ("lobby_helper","waiting_loop","prejoin_click") else 1200
                    right=1500 if name not in ("lobby_helper","waiting_loop","prejoin_click") else 3100
                    print("SOURCE_BEGIN",name)
                    print(s[max(0,i-left):i+right])
                    print("SOURCE_END",name)
            print("COMPILED_JOIN_LOGIC_INSPECTION_COMPLETE")
            PY
