name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import os,fcntl,subprocess,json,urllib.request,datetime
            print("CHECK_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            with open("/var/lock/pars-vds-bot-deploy.lock","a+") as f:
                try:
                    fcntl.flock(f.fileno(),fcntl.LOCK_EX|fcntl.LOCK_NB)
                    print("DEPLOY_LOCK_AVAILABLE",True)
                    fcntl.flock(f.fileno(),fcntl.LOCK_UN)
                except BlockingIOError:print("DEPLOY_LOCK_AVAILABLE",False)
            p=subprocess.run(["docker","ps","-a","--filter","name=beonmeet-five-qa-chrome","--format","{{.Names}}"],capture_output=True,text=True,timeout=7)
            print("ABANDONED_QA_CONTAINER_PRESENT",bool(p.stdout.strip()))
            for port in (9124,9126):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+"/capacity",timeout=5) as res:d=json.load(res)
                print("ACTIVE_RECORDER_JOBS",port,int((d.get("data")or d).get("runningJobs") or 0))
            print("PRE_DEPLOY_GUARD_CHECK_COMPLETE")
            PY
