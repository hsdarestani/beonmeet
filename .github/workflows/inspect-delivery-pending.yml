name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json,os,shutil
            from pathlib import Path
            def cmd(a,timeout=20):
                p=subprocess.run(a,capture_output=True,text=True,timeout=timeout)
                return p.returncode,p.stdout.strip(),p.stderr.strip()
            status,out,_=cmd(["systemctl","show","-p","ExecStart","--value","beonmeet-controller"])
            print("SERVICE_ENTRY_INTERPRETER_KIND","venv" if "/.venv/" in out else ("system" if "/usr/bin/python" in out else "unknown"))
            for py in ("/opt/beonmeet/.venv/bin/python","/usr/bin/python3"):
                if not Path(py).exists():continue
                c,stdout,stderr=cmd([py,"-c","import importlib.util; print('faster_whisper',bool(importlib.util.find_spec('faster_whisper')));print('av',bool(importlib.util.find_spec('av'))); print('ctranslate2',bool(importlib.util.find_spec('ctranslate2')))"])
                print("PY_ENV",("venv" if "/.venv/" in py else "system"),"exit",c,stdout.replace("\n",";"))
            print("PY_PIP_VERSION",cmd(["/opt/beonmeet/.venv/bin/python","-m","pip","--version"])[0])
            c,out,err=cmd(["df","-h","/opt/beonmeet"])
            print("HOST_DISK",out.splitlines()[-1].split()[1:5] if c==0 else "unavailable")
            conf=Path("/opt/beonmeet/.env").read_text()
            keys={line.split("=",1)[0].strip():line.split("=",1)[1].strip() for line in conf.splitlines() if "=" in line and not line.lstrip().startswith("#")}
            print("TRANSCRIPTION_SETTINGS",json.dumps({k:keys.get(k,"[DEFAULT]") for k in ("WHISPER_MODEL","RECOVERY_WHISPER_MODEL","WHISPER_CPU_THREADS","TRANSCRIPTION_CONCURRENCY")}))
            print("WHISPER_RUNTIME_READONLY_AUDIT_COMPLETE")
            PY
