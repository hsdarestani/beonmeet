name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json
            from pathlib import Path
            state=json.loads(Path("data/state.json").read_text())
            pending=state.get("pending_deliveries") or {}
            for item in list(pending.values())[-2:]:
                if not isinstance(item,dict):continue
                name=str(item.get("file_path") or item.get("source_path") or item.get("raw_path") or "")
                source=Path(name) if name else None
                if not source or not source.is_file():continue
                tests=[
                  ("video_decode",["ffmpeg","-hide_banner","-nostdin","-v","error","-t","3","-i",str(source),"-an","-f","null","-"]),
                  ("audio_decode",["ffmpeg","-hide_banner","-nostdin","-v","error","-t","3","-i",str(source),"-vn","-f","null","-"]),
                  ("mp3_encode_null",["ffmpeg","-hide_banner","-nostdin","-v","error","-t","3","-i",str(source),"-vn","-ac","1","-ar","44100","-c:a","libmp3lame","-b:a","64k","-f","mp3","-y","/dev/null"])
                ]
                signatures=("Invalid data found","Error","failed","No such file","Unknown encoder","Header missing","Invalid argument","Packet corrupt","Could not","Conversion failed","Codec","not found","Too many","timed out","End of file","Non-monotonous")
                for label,cmd in tests:
                    try:
                        p=subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True,timeout=12)
                        matches=sorted(set(key for key in signatures if key.lower() in p.stderr.lower()))
                        print("PENDING_FFMPEG_PROBE",label,"exit",p.returncode,"signal_types",matches[:15])
                    except Exception as ex:print("PENDING_FFMPEG_PROBE",label,"exception",type(ex).__name__)
            print("PENDING_MEDIA_DECODABILITY_PROBE_FINISHED")
            PY
