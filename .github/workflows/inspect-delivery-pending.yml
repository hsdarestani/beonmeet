name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,json
            cmd=["docker","exec","beonmeet-worker-five","sh","-c","find /usr/src/app/dist -type f \\( -iname '*uploader*' -o -iname '*upload*' \\) | head -30"]
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=18)
            paths=p.stdout.splitlines()
            print("UPLOADER_COMPILED_FILE_COUNT",len(paths))
            for path in paths:
                if not path.endswith(".js"):continue
                p=subprocess.run(["docker","exec","beonmeet-worker-five","cat",path],capture_output=True,text=True,timeout=18)
                lines=p.stdout.splitlines()
                matches=[i for i,line in enumerate(lines) if ("mkdir(" in line or "mkdirSync(" in line) and ("folderPath" in line or "recursive" in line)]
                if not matches:continue
                print("COMPILED_UPLOADER_PATH",path)
                for i in matches[:5]:
                    print("COMPILED_MKDIR_LINES",i+1,repr("\n".join(lines[max(0,i-4):i+6])[:1000]))
            print("UPLOADER_COMPILED_STATIC_AUDIT_COMPLETE")
            PY
