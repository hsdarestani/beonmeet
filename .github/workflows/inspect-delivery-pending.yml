name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,urllib.request,subprocess,datetime
            from pathlib import Path
            print("LIVE_VERIFY_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            p=subprocess.run(["docker","exec","beonmeet-worker-five","sh","-c","grep -q GOOGLE_MEET_TRUSTED_JOIN_PATCH /usr/src/app/dist/bots/GoogleMeetBot.js"],capture_output=True,text=True,timeout=8)
            print("TRUSTED_CLICK_PATCH_RUNNING",p.returncode==0)
            p=subprocess.run(["docker","exec","beonmeet-worker-five","sh","-c","grep -q 'const knockConfirmed =' /usr/src/app/dist/bots/GoogleMeetBot.js"],capture_output=True,text=True,timeout=8)
            print("LOBBY_CONFIRMATION_PATCH_RUNNING",p.returncode==0)
            for name,port,endpoint in (("controller",8109,"/health"),("five",9126,"/capacity"),("single",9124,"/capacity")):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+endpoint,timeout=6) as r:data=json.load(r)
                d=data.get("data",data)
                print("LIVE_STAGES",name,json.dumps({k:d.get(k) for k in ("ok","runningJobs","availableSlots","free_queue","premium_queue","active_delivery_jobs","pending_delivery_jobs") if k in d}))
            print("TRUSTED_JOIN_LIVE_AUDIT_COMPLETE")
            PY
