name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import os,json,subprocess,re
            from pathlib import Path
            x=json.loads(Path("data/state.json").read_text())
            a=list((x.get("pending_deliveries") or {}).values())
            for p in a:
                if not isinstance(p,dict):continue
                s=str(p.get("last_error") or "")
                tr=s.split("transcript=",1)[-1]
                signatures=("RuntimeError","OSError","FileNotFoundError","MemoryError","Whisper","model","Download","HuggingFace","Connection","HTTP","401","403","429","500","503","Timeout","CTranslate2","int8","CPU","thread","corrupt","allocator","OpenMP","ct2","out of memory","Killed","permission denied","EACCES","not found","missing","unavailable","HTTPSConnectionPool")
                print("TRANSCRIPT_ERROR_FINGERPRINT",json.dumps({"type_prefix":tr.split("(",1)[0][:90],"markers":[t for t in signatures if t.lower() in tr.lower()],"chars":len(tr),"attempts":p.get("attempts"),"audio_delivered":p.get("audio_delivered")}))
            modelroot=Path("/opt/beonmeet/data/whisper-models")
            print("WHISPER_CACHE_EXISTS",modelroot.is_dir())
            if modelroot.is_dir():
                print("WHISPER_CACHE_TOPLEVEL_ENTRIES",len(list(modelroot.iterdir())))
                print("WHISPER_CACHE_TOTAL_MB",round(sum(p.stat().st_size for p in modelroot.rglob("*") if p.is_file())/1048576,1))
            p=subprocess.run(["systemctl","show","beonmeet-controller","-p","MemoryCurrent","-p","CPUUsageNSec"],capture_output=True,text=True)
            print("CONTROLLER_RESOURCES",p.stdout.strip().replace("\n"," | "))
            print("TRANSCRIPT_ERROR_FINGERPRINT_DONE")
            PY
