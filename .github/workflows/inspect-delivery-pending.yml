name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,urllib.request,datetime
            from pathlib import Path
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            for name,port,path in (("controller",8109,"/health"),("worker_one",9124,"/capacity"),("worker_five",9126,"/capacity")):
                with urllib.request.urlopen("http://127.0.0.1:"+str(port)+path,timeout=5) as r:d=json.load(r)
                d=d.get("data",d)
                keys=("ok","free_queue","premium_queue","pending_delivery_jobs","active_delivery_jobs","runningJobs","availableSlots","maxConcurrentJobs")
                print("LIVE_COUNTERS",name,json.dumps({k:d.get(k) for k in keys if k in d},sort_keys=True))
            state=json.loads(Path("data/state.json").read_text())
            print("PENDING_DURABLE_COUNT",len(state.get("pending_deliveries") or {}))
            print("PENDING_RECOVERY_FLAGS",[{"video":bool(x.get("video_delivered")),"audio":bool(x.get("audio_delivered")),"transcript":bool(x.get("transcript_delivered"))} for x in (state.get("pending_deliveries") or {}).values() if isinstance(x,dict)])
            print("SAFETY_COUNTERS_CURRENT")
            PY
