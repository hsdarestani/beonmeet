name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,datetime,sqlite3,subprocess,urllib.request
            from pathlib import Path
            now=datetime.datetime.now(datetime.timezone.utc)
            print("AUDIT_UTC",now.isoformat())
            state=json.loads(Path("data/state.json").read_text())
            pending=state.get("pending_deliveries") or {}
            completed=state.get("completed_deliveries") or {}
            print("FINAL_PENDING_COUNT",len(pending))
            matched=[]
            for val in completed.values():
                if not isinstance(val,dict):continue
                try:ago=(now-datetime.datetime.fromisoformat(str(val.get("completed_at") or ""))).total_seconds()
                except Exception:continue
                if -120<ago<3600:
                    src=Path(str(val.get("source_path") or ""))
                    matched.append({"minutes_ago":round(ago/60,1),"source_absent":not src.exists(),"has_receipt":bool(val.get("completed_at"))})
            print("RECENT_CONFIRMED_DELIVERY_RECEIPTS",json.dumps(sorted(matched,key=lambda x:x["minutes_ago"])[:8]))
            db=sqlite3.connect("file:/opt/beonmeet/data/beonmeet.db?mode=ro",uri=True)
            req=(state.get("requests") or {}).get("https://meet.google.com/krq-dnch-odn") or {}
            uid=str(req.get("chat_id") or "")
            if uid:
                rows=db.execute("SELECT kind,seconds_delta FROM credit_entries WHERE telegram_id=?",(uid,)).fetchall()
                net=sum(int(val) for _,val in rows)
                consumed=-sum(int(val) for kind,val in rows if kind=="recording")
                recording_count=db.execute("SELECT COUNT(*) FROM recordings WHERE telegram_id=?",(uid,)).fetchone()[0]
                print("ACCOUNT_RECONCILIATION",json.dumps({"wallet_seconds":net,"debited_seconds":consumed,"recording_count":recording_count}))
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=6) as res:h=json.load(res)
            print("FINAL_HEALTH",{k:h.get(k) for k in ("ok","pending_delivery_jobs","active_delivery_jobs","free_queue","premium_queue","max_concurrent_meetings")})
            print("FINAL_PREVIOUS_RECORDING_RECONCILIATION_COMPLETE")
            PY
