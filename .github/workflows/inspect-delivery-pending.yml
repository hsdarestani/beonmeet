name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,datetime,subprocess
            from pathlib import Path
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            state=json.loads(Path("data/state.json").read_text())
            pending=state.get("pending_deliveries") or {}
            print("PENDING_COUNT",len(pending))
            signatures=("RuntimeError","OSError","FileNotFoundError","MemoryError","Model","model","Whisper","whisper","NotImplementedError","CTranslate2","does not support","No such file","out of memory","RuntimeError","PermissionError","Killed","download","HTTPStatusError","CUDA","Allocation","KeyError","AssertionError","AttributeError","TypeError","ValueError","ConnectionError","traceback","ffmpeg","unknown")
            for p in list(pending.values())[-4:]:
                if not isinstance(p,dict):continue
                msg=str(p.get("last_error") or "")
                last=msg.split("transcript=",1)[1] if "transcript=" in msg else msg
                found=[x for x in signatures if x.lower() in last.lower()]
                print("TRANSCRIPT_ERROR_MARKERS",json.dumps({"attempts":int(p.get("attempts") or 0),
                  "audio_delivered":bool(p.get("audio_delivered")),
                  "transcript_delivered":bool(p.get("transcript_delivered")),"markers":sorted(set(found))}))
            logs=subprocess.run(["journalctl","-u","beonmeet-controller","--since","2026-11-21 11:50:00 UTC","--no-pager","-o","cat"],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=25).stdout
            n=sum("transcription error:" in line for line in logs.splitlines())
            start=sum("primary transcription failed" in line for line in logs.splitlines())
            print("TRANSCRIPTION_LOG_SUMMARY",json.dumps({"errors":n,"primary_failed":start}))
            print("TRANSCRIPT_RECOVERY_ERROR_CLASS_AUDIT_DONE")
            PY
