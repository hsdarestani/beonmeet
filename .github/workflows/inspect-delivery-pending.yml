name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,datetime,subprocess,urllib.request
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            js=r"""
            (async()=>{
              let browser,phase="cdp";
              try{
                const {chromium}=require("playwright-extra");
                browser=await chromium.connectOverCDP(process.env.GOOGLE_CHROME_CDP_URL,{timeout:10000});
                const all=browser.contexts().flatMap(c=>c.pages());
                console.log("JOIN_BROWSER_TAB_COUNT",all.length);
                let found=0;
                for(const page of all){
                  if(!page.url().includes("cru-ggpe-nwi"))continue;
                  found++;
                  phase="read_page";
                  const details=await page.evaluate(()=>{
                    const text=(document.body?.innerText||"").toLowerCase();
                    const targets={
                      ask_to_join:"ask to join",asking_to_join:"asking to join",
                      waiting_to_be_let_in:"waiting to be let in",
                      someone_let_you_in:"someone in the call",youll_join:"you'll join when",
                      request_to_join:"request to join",waiting_for_host:"waiting for host",
                      denied:"denied",cant_join:"can't join",cannot_join:"cannot join",
                      host_to_admit:"admit",removed:"removed from this call",
                      still_in_lobby:"waiting room",not_allowed:"not allowed",
                      enter_name:"enter your name",you_are_asking:"you are asking",
                      try_again:"try again",something_went_wrong:"something went wrong",
                      rejoin:"rejoin",join_now:"join now",leave_call:"leave call",
                      asking:"asking",host:"host"
                    };
                    const visible={};
                    for(const [k,v] of Object.entries(targets))visible[k]=text.includes(v);
                    const buttons=Array.from(document.querySelectorAll('button')).map(x=>(x.innerText||x.getAttribute('aria-label')||"").trim().toLowerCase());
                    const b={
                      ask_to_join:buttons.some(t=>t.includes("ask to join")),
                      join_now:buttons.some(t=>t.includes("join now")),
                      cancel_request:buttons.some(t=>t.includes("cancel request")),
                      leave:buttons.some(t=>t.includes("leave call")),
                      retry:buttons.some(t=>t.includes("retry"))
                    };
                    return {visible,buttons:b,button_count:buttons.length,body_char_count:text.length};
                  });
                  console.log("MATCHED_MEET_TAB_STATE",JSON.stringify(details));
                }
                console.log("MATCHED_MEET_TABS",found);
                console.log("READONLY_CDP_LOBBY_AUDIT_DONE");
              }catch(e){console.log("READONLY_CDP_LOBBY_AUDIT_ERROR",phase,e.name)}
              process.exit(0);
            })();
            """
            p=subprocess.run(["docker","exec","beonmeet-worker-five","node","-e",js],capture_output=True,text=True,timeout=26)
            print("CHROME_DIAGNOSTIC_PROCESS_EXIT",p.returncode)
            for line in p.stdout.splitlines():
                if line.startswith(("JOIN_BROWSER_","MATCHED_MEET_","READONLY_CDP_LOBBY_")):print(line[:1000])
            print("MEET_LOBBY_READONLY_AUDIT_COMPLETE")
            PY
