name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import subprocess,os
            targets=["/opt/beonmeet/.venv","/opt/beonmeet/.venv/bin","/opt/beonmeet/.venv/lib","/opt/beonmeet/.venv/lib/python3.12","/opt/beonmeet/.venv/lib/python3.12/site-packages"]
            for p in targets:
                print("VENV_DIR",os.path.basename(p),oct(os.stat(p).st_mode & 0o777))
            for mod in ("faster_whisper","av","ctranslate2","onnxruntime"):
                c="import "+mod
                r=subprocess.run(["runuser","-u","beonmeet","--",".venv/bin/python","-c",c],capture_output=True,text=True,timeout=20)
                last=r.stderr.splitlines()[-1] if r.stderr else "none"
                print("MODULE_IMPORT",mod,"exit",r.returncode,"error_kind",last.split(":",1)[0][:80])
            print("IMPORT_DIAGNOSTIC_COMPLETE")
            PY
