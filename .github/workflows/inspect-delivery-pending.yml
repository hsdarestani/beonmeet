name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,subprocess
            from pathlib import Path
            st=json.loads(Path("data/state.json").read_text())
            for x in list((st.get("pending_deliveries") or {}).values())[-3:]:
                if not isinstance(x,dict):continue
                raw=str(x.get("file_path") or x.get("source_path") or x.get("raw_path") or "")
                p=Path(raw) if raw else None
                if not p or not p.is_file():continue
                commands=[
                    ("full_audio_decode",["ffmpeg","-hide_banner","-nostdin","-v","error","-i",str(p),"-vn","-f","null","-"]),
                    ("full_mp3_null",["ffmpeg","-hide_banner","-nostdin","-v","error","-i",str(p),"-vn","-ac","1","-ar","44100","-c:a","libmp3lame","-b:a","64k","-f","mp3","-y","/dev/null"])]
                for label,cmd in commands:
                    try:
                        r=subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True,timeout=25)
                        phrases=("Invalid data found","Error","failed","No such file","Unknown encoder","Header missing","Invalid argument","Packet corrupt","Could not","Conversion failed","not found","Too many","End of file","Non-monotonous")
                        print("FULL_PERSISTED_AUDIO_DECODE",label,"exit",r.returncode,"signatures",sorted(set(k for k in phrases if k.lower() in r.stderr.lower())))
                    except Exception as exc:
                        print("FULL_PERSISTED_AUDIO_DECODE",label,"exception",type(exc).__name__)
            print("FULL_MEDIA_DECODE_PROBE_COMPLETE")
            PY
