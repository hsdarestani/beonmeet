name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import json,datetime,urllib.request,re
            from pathlib import Path
            print("AUDIT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
            state=json.loads(Path("data/state.json").read_text())
            pending=state.get("pending_deliveries") or {}
            print("PENDING_COUNT",len(pending))
            for p in list(pending.values())[-5:]:
                if not isinstance(p,dict):continue
                s=str(p.get("last_error") or "")
                signals=[x for x in ("Permission denied","EACCES","No such file","ffmpeg","Command","transcription","audio","No space","CUDA","MemoryError","HTTPException","RuntimeError","OSError") if x.lower() in s.lower()]
                print("PENDING_DELIVERY_STAGE",json.dumps({"attempts":int(p.get("attempts") or 0),
                    "video":bool(p.get("video_delivered")),"audio":bool(p.get("audio_delivered")),
                    "transcript":bool(p.get("transcript_delivered")),"last_error_signals":signals}))
            with urllib.request.urlopen("http://127.0.0.1:8109/health",timeout=5) as r:h=json.load(r)
            print("LIVE_DELIVERY_STATUS",json.dumps({k:h.get(k) for k in ("ok","active_delivery_jobs","pending_delivery_jobs","transcription_concurrency")}))
            print("PENDING_RECOVERY_POST_RELEASE_AUDIT_DONE")
            PY
