name: BeOnMeet read-only pending delivery safety audit

on:
  push:
    branches: [ops/inspect-delivery-pending-20261121]
    paths:
      - .github/workflows/inspect-delivery-pending.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read delivery state before controller-only release
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.SHARED_VPS_PASS || secrets.PASS }}
          command_timeout: 4m
          script: |
            set -eu
            cd /opt/beonmeet
            python3 - <<'PY'
            import os,json,subprocess
            from pathlib import Path
            for name in ("setfacl","getfacl"):
                p=subprocess.run(["sh","-c","command -v "+name],capture_output=True,text=True)
                print("ACL_TOOL",name,"installed",p.returncode==0)
            root=Path("/dev/shm/beonmeet")
            print("RECORDING_ROOT_MODE",oct(root.stat().st_mode&0o7777))
            children=list(root.iterdir()) if root.exists() else []
            dirs=[p for p in children if p.is_dir()]
            print("DIRECT_SUBDIRS_COUNT",len(dirs))
            group_missing=sum(1 for p in dirs if not(p.stat().st_mode&0o020))
            print("DIRECT_SUBDIRS_GROUP_NOT_WRITABLE",group_missing)
            print("ACL_PERMISSIONS_AUDIT_DONE")
            PY
