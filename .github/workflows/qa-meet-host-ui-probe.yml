name: QA Google Meet host prejoin UI (read-only)
on:
  push:
    branches: [feat/five-isolated-local-recorders-20261122]
    paths: [.github/workflows/qa-meet-host-ui-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --check tests/meet_qa_host_ui_probe.js
      - name: Inspect disposable Google Meet host buttons in new Chrome
        uses: appleboy/ssh-action@v1
        with:
          host: 143.20.60.195
          port: 9011
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 3m
          timeout: 20s
          script: |
            set -eu
            cd /opt/beonmeet
            exec 9>/var/lock/pars-vds-bot-deploy.lock
            flock -w 90 9
            git fetch -q origin feat/five-isolated-local-recorders-20261122
            SHA=${{ github.sha }}
            test -d .five-isolated-runtime
            tmp=$(mktemp /tmp/meet-host-ui.XXXXXXXX.js)
            trap 'rm -f "$tmp"' EXIT
            git show "$SHA:tests/meet_qa_host_ui_probe.js" > "$tmp"
            docker exec -i beonmeet-worker-five node - < "$tmp"
